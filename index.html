{t:"As 5 competências do ENEM",d:"Como a redação é corrigida, competência por competência.",kw:"",
s:[["Como funciona a nota","Cada redação é corrigida por dois avaliadores, cada um atribuindo de 0 a 200 pontos em cada uma das 5 competências, em níveis de 40 pontos. A nota final é a média. Se houver discrepância grande, um terceiro corretor entra. A nota máxima é 1000."],
["C1 e C2","C1 avalia o domínio da modalidade escrita formal: ortografia, acentuação, concordância, regência, pontuação e estrutura das frases. C2 avalia se você entendeu a proposta, se usou repertório sociocultural legitimado e produtivo (ligado ao tema e ao argumento) e se seguiu o tipo dissertativo-argumentativo."],
["C3 e C4","C3 avalia a seleção, a organização e a interpretação das informações em defesa de um ponto de vista: projeto de texto claro, argumentos desenvolvidos e autoria. C4 avalia a coesão: conectivos entre parágrafos e dentro deles, retomadas variadas e ausência de repetições."],
["C5 e situações de nota zero","C5 avalia a proposta de intervenção: completa, detalhada, articulada à discussão e respeitando os direitos humanos. Zera a redação: fuga total ao tema, não ser dissertativo-argumentativo, até 7 linhas, parte desconectada do tema, desrespeito aos direitos humanos em versões anteriores do edital, folha em branco, identificação do candidato e texto predominantemente cópia dos textos motivadores."]],
k:["5 competências × 200 = 1000.","Repertório precisa ser legitimado e produtivo.","C4: conectivos e retomadas variadas.","C5: intervenção completa e detalhada."],
ex:["Um aluno citou uma frase famosa na introdução, mas não a relacionou com o tema. O que acontece em C2?","O repertório fica 'não produtivo': não conta como bem aproveitado, o que limita a nota em C2. É preciso explicar a relação entre a citação e o argumento."]},
{t:"Estrutura do texto dissertativo-argumentativo",d:"Introdução, desenvolvimento e conclusão com um modelo seguro.",kw:"",
s:[["Introdução","Comece com uma contextualização usando repertório (fato histórico, dado, lei, filósofo, obra). Em seguida, apresente a tese, ou seja, sua posição sobre o tema. Feche anunciando os dois argumentos que serão desenvolvidos. Três ou quatro períodos bastam."],
["Desenvolvimento","Cada parágrafo de desenvolvimento defende um argumento. Estrutura sugerida: tópico frasal (a ideia do parágrafo), fundamentação (repertório, dado ou exemplo), análise (explique como isso prova seu ponto, é aqui que está a autoria) e fechamento ligando ao tema."],
["Conclusão","Retome a tese de forma breve e apresente a proposta de intervenção completa, ligada aos problemas discutidos nos desenvolvimentos. Uma boa conclusão pode trazer duas propostas, uma para cada argumento."],
["Planejamento","Antes de escrever, faça um rascunho rápido: tese, argumento 1, argumento 2, repertórios e intervenção. Planejar evita contradições, ajuda a controlar as 30 linhas e economiza tempo na hora de passar a limpo."]],
k:["Introdução: contexto + tese + anúncio.","Desenvolvimento: tópico, fundamentação, análise, fechamento.","Conclusão: retomada + intervenção.","Planeje antes de escrever."],
ex:["Para o tema 'estigma associado às doenças mentais', proponha uma tese.","Exemplo: O estigma persiste no Brasil por causa da desinformação sobre saúde mental e da insuficiência de serviços públicos especializados."]},
{t:"Proposta de intervenção",d:"Os cinco elementos que levam C5 a 200 pontos.",kw:"",
s:[["Os cinco elementos","Agente: quem vai realizar (Ministério da Saúde, escolas, mídia, ONGs, família). Ação: o que será feito. Meio ou modo: como será feito. Finalidade ou efeito: para que será feito. Detalhamento: uma informação a mais sobre qualquer um dos elementos."],
["Exemplo completo","O Ministério da Educação (agente) deve incluir aulas de educação midiática nas escolas (ação), por meio de oficinas semanais com especialistas (meio), a fim de formar leitores críticos de notícias (finalidade). Essas oficinas, voltadas sobretudo ao ensino médio, ... (detalhamento)."],
["Articulação","A proposta deve responder aos problemas discutidos no texto. Se você argumentou sobre falta de informação e falta de estrutura, proponha uma ação para cada. Propostas genéricas, como 'o governo deve fazer algo', valem pouco."],
["Direitos humanos","A proposta não pode ferir os direitos humanos: nada de punições cruéis, violência, censura ou discriminação. Prefira ações educativas, políticas públicas, campanhas e fiscalização."]],
k:["Agente + ação + meio + finalidade + detalhamento.","Uma proposta para cada problema discutido.","Evite agentes vagos.","Respeite os direitos humanos."],
ex:["O que falta em: 'É preciso conscientizar a população sobre o tema.'?","Falta agente (quem conscientiza), meio (como, por exemplo, campanhas em redes sociais), finalidade e detalhamento. Só há uma ação genérica."]},
{t:"Repertório sociocultural",d:"Como montar um banco de repertórios que serve para vários temas.",kw:"",
s:[["O que conta como repertório","Informações de fora dos textos motivadores: leis (Constituição de 1988, ECA, Estatuto do Idoso), dados de órgãos oficiais (IBGE, OMS), fatos históricos, filósofos e sociólogos, obras literárias, filmes e séries."],
["Repertórios coringas","Constituição de 1988 (direitos à saúde, educação e dignidade), Zygmunt Bauman (modernidade líquida, relações frágeis), Durkheim (anomia), Hannah Arendt (banalidade do mal), Paulo Freire (educação libertadora), Djamila Ribeiro (lugar de fala), Milton Santos (globalização perversa). Funcionam em muitos temas se bem relacionados."],
["Como usar bem","Repertório bom é pertinente ao tema e produtivo: você explica o que ele significa e como ajuda seu argumento. Uma citação solta, sem análise, vale pouco. Melhor um repertório bem explorado do que três jogados."],
["Como estudar","Monte um caderno de repertórios por eixo temático: saúde, educação, tecnologia, meio ambiente, cidadania, cultura, desigualdade. Para cada item, escreva em uma frase como usá-lo. Leia notícias e reportagens para atualizar dados."]],
k:["Repertório = conhecimento de fora da coletânea.","Precisa ser pertinente e explicado.","Tenha coringas por eixo temático.","Qualidade vale mais que quantidade."],
ex:["Como usar Bauman num tema sobre redes sociais?","Explique que, para Bauman, as relações contemporâneas são frágeis e passageiras; nas redes, isso aparece em vínculos rasos e descartáveis, o que dificulta debates construtivos."]},
{t:"Fuvest, Unicamp e Unesp",d:"O que muda na redação dos vestibulares paulistas.",kw:"",
s:[["Fuvest","Dissertação em prosa a partir de uma coletânea de textos, geralmente com tema mais filosófico ou abstrato. Não exige proposta de intervenção. Valoriza a capacidade de reflexão, o desenvolvimento do ponto de vista e o domínio da língua. Título costuma ser obrigatório: confira no edital do ano."],
["Unicamp","Pede gêneros variados, como carta aberta, artigo de opinião, discurso, verbete, resenha ou postagem, com situação de produção definida: quem escreve, para quem e com qual objetivo. Ignorar o gênero, o interlocutor ou o propósito derruba muito a nota."],
["Unesp","Texto dissertativo-argumentativo a partir de uma coletânea, em geral com tema de atualidade. Parecido com o ENEM em formato, mas sem a exigência formal da proposta de intervenção."],
["Como treinar","Faça redações no formato de cada banca a partir de temas antigos, leia as redações nota máxima divulgadas pelas próprias universidades e controle o tempo. Use o corretor da plataforma para o formato ENEM e peça à Easier comentários sobre o formato das outras bancas."]],
k:["Fuvest: dissertação reflexiva, sem intervenção obrigatória.","Unicamp: atenção ao gênero e ao interlocutor.","Unesp: dissertação com coletânea.","Leia redações nota máxima das bancas."],
ex:["A Unicamp pede uma carta ao prefeito sobre arborização. Qual o erro mais grave possível?","Escrever uma dissertação comum, sem vocativo, sem dirigir-se ao prefeito e sem o propósito de convencê-lo: isso foge ao gênero solicitado."]},
{t:"Competência 1 — Norma-padrão",d:"Como o corretor avalia a estrutura das frases e os desvios de escrita.",kw:"",
s:[["O que a C1 avalia","A Competência 1 mede o domínio da escrita formal. O corretor olha dois aspectos separados: a estrutura sintática (se as frases estão bem montadas, completas e bem pontuadas) e os desvios (erros de grafia, acentuação, concordância, regência, crase, pontuação, registro e escolha de palavras). A nota sai da combinação dos dois, e quando o texto tem características de dois níveis, vale sempre o mais baixo."],
["A grade, nível por nível","0 pontos: estrutura sintática inexistente, qualquer que seja a quantidade de desvios. 40: estrutura deficitária com muitos desvios. 80: estrutura deficitária ou muitos desvios. 120: estrutura regular e alguns desvios. 160: estrutura boa e poucos desvios. 200: estrutura excelente (no máximo uma falha) e no máximo dois desvios. Repare: o nível 200 é o único com número fixo de erros."],
["Problemas de estrutura que mais pesam","Truncamento: um período cortado ao meio por ponto final, deixando uma oração solta (por exemplo, começar frase com \"Pois\" ou \"Que\" depois de um ponto). Justaposição: orações ou períodos grudados só com vírgula, sem conectivo ou pontuação adequada. Excesso, falta ou duplicação de palavras que quebram a frase. Esses problemas contam como falhas de estrutura, e não como desvios comuns."],
["Os quatro tipos de desvio","Convenções da escrita: acentuação, ortografia, hífen, maiúsculas e minúsculas, separação de sílabas no fim da linha. Gramaticais: regência, concordância, pontuação, paralelismo, uso de pronomes e crase. Registro: marcas de informalidade e oralidade, como \"pra\", \"tipo\" e \"a gente\". Escolha vocabular: palavras usadas com sentido impreciso ou inadequado ao contexto."],
["Como chegar aos 200","Prefira frases de tamanho médio, com sujeito, verbo e complemento claros. Revise a pontuação de orações intercaladas e deslocadas. Confira concordância nos sujeitos longos e pospostos, crase antes de palavras femininas, e o uso de \"onde\" só para lugar. Reserve dois ou três minutos no fim da prova só para caçar erros de acentuação e grafia."]],
k:["Dois eixos: estrutura sintática + desvios.","Com características de dois níveis, vale o mais baixo.","200 = no máximo 1 falha de estrutura e 2 desvios.","Truncamento e justaposição contam como falha de estrutura."],
ex:["Um texto tem frases bem construídas (estrutura boa), mas apresenta muitos desvios de acentuação. Qual o nível provável na C1?","Nível 2 (80 pontos). \"Muitos desvios\" já é característica do nível 2 e, quando há traços de dois níveis, prevalece o inferior, mesmo que a estrutura seja boa."]},
{t:"Competência 2 — Tema, tipo textual e repertório",d:"Abordagem do tema, estrutura dissertativo-argumentativa e uso de repertório.",kw:"",
s:[["O que a C2 avalia","A Competência 2 confere três coisas: se você abordou o tema completo (e não só o assunto geral), se escreveu um texto dissertativo-argumentativo em prosa com introdução, desenvolvimento e conclusão proporcionais, e se usou repertório sociocultural de forma legitimada, pertinente e produtiva."],
["A grade, nível por nível","40: tangência ao tema, ou texto que é aglomerado de palavras, ou que tem traços constantes de outro tipo textual (narração, por exemplo). 80: tema completo, mas com duas partes do texto embrionárias ou conclusão terminada em frase incompleta. 120: tema completo, três partes (uma pode ser embrionária) e repertório baseado nos textos motivadores, não legitimado ou não pertinente. 160: três partes desenvolvidas e repertório legitimado e pertinente, mas com uso improdutivo. 200: tudo isso com repertório legitimado, pertinente e com uso produtivo."],
["Tema completo x tangência","O tema é a frase temática inteira. Se a proposta fala de \"manipulação do comportamento do usuário pelo controle de dados na internet\", falar só de internet ou só de tecnologia é tangenciar. Texto que não toca nem no assunto geral leva fuga ao tema e zera a redação toda. Retome os elementos do tema na introdução, nos argumentos e na conclusão."],
["Repertório: legitimado, pertinente e produtivo","Legitimado é o que tem respaldo nas áreas do conhecimento: conceitos, fatos históricos, leis, dados, autores, obras, filmes, meios de comunicação conhecidos. Pertinente é o que se liga a pelo menos um elemento do tema. Produtivo é quando você amarra o repertório à sua discussão, explicando como ele sustenta o argumento. Citar um filósofo e seguir em frente sem conectar é uso improdutivo e trava a nota em 160. Repertório tirado só dos textos motivadores fica no máximo em 120."],
["Partes embrionárias e cópia","Uma parte embrionária é um parágrafo muito curto, que só esboça a ideia. Duas partes embrionárias derrubam a C2 para 80. Copiar muitos trechos dos textos motivadores também limita a C2 a 80, mesmo que o resto do texto esteja bom."]],
k:["Tema = frase temática inteira, não só o assunto.","Tangência limita a C2 a 40.","200 exige repertório legitimado, pertinente E produtivo.","Repertório só dos textos motivadores: no máximo 120."],
ex:["O aluno cita o conceito de \"menoridade\" de Kant, que tem relação com o tema, mas não explica como ele se liga ao seu argumento. Qual o nível na C2, se o resto estiver adequado?","160 pontos. O repertório é legitimado e pertinente, mas sem uso produtivo, porque não há vínculo com a discussão do texto."]},
{t:"Competência 3 — Projeto de texto e argumentação",d:"Projeto de texto, direção e desenvolvimento dos argumentos.",kw:"",
s:[["O que a C3 avalia","A Competência 3 avalia como você seleciona, relaciona, organiza e interpreta informações, fatos e opiniões para defender um ponto de vista. O corretor procura duas coisas: um projeto de texto (o planejamento que se percebe pela ordem dos argumentos) e o desenvolvimento (a fundamentação e explicação de cada argumento)."],
["A grade, nível por nível","40: texto tangente ao tema com direção, ou tema completo mas sem direção. 80: projeto com muitas falhas e sem desenvolvimento, ou desenvolvendo só uma informação; textos com contradição grave não passam daqui. 120: projeto com algumas falhas e desenvolvimento de algumas informações. 160: projeto com poucas falhas e desenvolvimento da maior parte das informações. 200: projeto estratégico e desenvolvimento das informações em todo o texto, admitindo deslizes pontuais."],
["Direção e projeto de texto","Ter direção é deixar claro o que você defende, com ideias conectadas entre si. Um texto sem direção junta frases soltas sem um ponto de vista identificável. O projeto de texto não é o rascunho: é o caminho que o leitor percebe no texto final, por exemplo, tese que anuncia duas causas, um parágrafo para cada causa e uma conclusão que resolve as duas."],
["O que conta como desenvolvimento","Desenvolver é explicar por que a informação prova sua tese. Use definições, comparações, dados, exemplos, relações de causa e consequência e citações, sempre seguidas de análise. Informação jogada sem explicação conta como não desenvolvida. Quanto mais informações você apresentar sem desenvolver, mais baixo o nível."],
["Erros que travam a nota","Contradição grave entre partes do texto limita a C3 a 80. Repetir a mesma ideia com outras palavras não é desenvolvimento. Argumentos que fogem do recorte do tema contam como falha de projeto. Prefira dois argumentos bem explicados a quatro argumentos rasos."]],
k:["C3 = projeto de texto + desenvolvimento.","Com traços de dois níveis, vale o mais baixo.","Contradição grave: no máximo 80.","200: projeto estratégico e tudo desenvolvido."],
ex:["Uma redação tem projeto de texto com algumas falhas, mas apresenta várias informações sem nenhuma explicação, desenvolvendo só uma delas. Qual o nível?","80 pontos. O desenvolvimento de apenas uma informação é característica do nível 2 e prevalece sobre o projeto, que seria de nível 3."]},
{t:"Competência 4 — Coesão",d:"Mecanismos de coesão, conectivos entre parágrafos, repetições e inadequações.",kw:"",
s:[["O que a C4 avalia","A Competência 4 avalia os recursos linguísticos que ligam palavras, frases e parágrafos. Há a coesão referencial (retomar termos com pronomes, sinônimos, hiperônimos, expressões resumitivas) e a sequencial (operadores argumentativos como \"além disso\", \"no entanto\", \"portanto\"). O corretor olha a presença desses elementos, as repetições e as inadequações."],
["A grade, nível por nível","0: palavras e períodos justapostos, sem articulação. 40: presença rara de elementos coesivos, ou repetições e inadequações excessivas. 80: presença pontual, ou muitas repetições e inadequações. 120: presença regular, ou algumas repetições e inadequações. 160: presença constante dentro e entre parágrafos, poucas repetições e inadequações. 200: presença expressiva dentro e entre parágrafos, repetições raras ou ausentes e nenhuma inadequação."],
["A regra dos operadores entre parágrafos","Para chegar a 160, é preciso ter pelo menos um operador argumentativo ligando um parágrafo ao anterior. Para 200, são pelo menos dois momentos de operador entre parágrafos e pelo menos um elemento coesivo dentro de cada parágrafo. Atenção: um conectivo no início do parágrafo que só liga ideias internas daquele parágrafo (como um \"De acordo com\" que abre uma citação) não conta como ligação entre parágrafos."],
["Repetição e inadequação","Repetir palavras do tema é esperado. O que pesa é repetir o mesmo conectivo (três \"porém\" seguidos repetem sempre a mesma relação) ou o mesmo termo sem nenhuma substituição. Inadequação é usar um conectivo com sentido errado, como \"portanto\" sem relação de conclusão, ou \"onde\" sem ideia de lugar. Qualquer inadequação já impede os 200 pontos."],
["Monobloco","Texto escrito em um único bloco, sem parágrafos, mostra desconhecimento de paragrafação e fica no máximo com 80 pontos na C4. Separe sempre introdução, desenvolvimentos e conclusão em parágrafos distintos."]],
k:["160 exige ao menos 1 operador entre parágrafos.","200 exige 2 operadores entre parágrafos + coesivo dentro de todos os parágrafos.","Qualquer inadequação impede o 200.","Monobloco: no máximo 80."],
ex:["Uma redação tem ótimos conectivos dentro dos parágrafos, mas nenhum parágrafo começa ligando-se ao anterior. Ela pode tirar 160 na C4?","Não. Sem nenhum operador argumentativo entre parágrafos, ela não cumpre o requisito do nível 4 e fica no máximo com 120."]},
{t:"Competência 5 — Proposta de intervenção",d:"Os cinco elementos, elementos nulos, condicionais e direitos humanos.",kw:"",
s:[["O que a C5 avalia","A Competência 5 avalia a proposta de intervenção para o problema do tema, que precisa respeitar os direitos humanos. A nota depende de quantos elementos válidos a proposta mais completa do texto tem: ação, agente, modo/meio, efeito e detalhamento."],
["A grade, nível por nível","0: sem proposta, proposta copiada da prova, proposta que desrespeita os direitos humanos ou que não tem relação nem com o assunto. 40: texto tangente ao tema, ou só elementos nulos, ou um elemento válido. 80: dois elementos válidos. 120: três. 160: quatro. 200: cinco elementos válidos. Estruturas condicionais (\"se o governo fizer X, então Y\") com dois ou mais elementos ficam no máximo em 80."],
["Os cinco elementos","Ação: o que deve ser feito. Agente: quem executa. Modo ou meio: como será feito. Efeito: para que, qual resultado se espera. Detalhamento: uma informação a mais sobre qualquer um dos outros elementos, como um exemplo, uma explicação ou uma característica. O agente não precisa ser o sujeito da frase, e ação e agente podem estar em frases diferentes."],
["Elementos nulos e constatação de falta","Ações muito vagas (\"medidas são necessárias\", \"esses obstáculos devem ser superados\") são nulas e não contam. Agentes imprecisos também são nulos: \"alguém\", \"ninguém\", \"alguns\", \"você\" e verbo no imperativo sem vocativo. Já \"nós\", \"todos\" e \"as pessoas\" valem como a sociedade. Dizer só o que falta (\"falta liberdade de escolha\") não é proposta: é preciso apontar a solução."],
["Direitos humanos","Propostas com tortura, violência, linchamento, justiça com as próprias mãos ou que tirem direitos de grupos levam nota 0 na C5, mesmo que haja outra proposta boa no texto. Pena de morte e prisão perpétua, quando atribuídas ao Estado por vias legais, não são consideradas desrespeito, mas são escolhas arriscadas. Prefira educação, políticas públicas, campanhas e fiscalização."]],
k:["Ação + agente + modo/meio + efeito + detalhamento.","Cada elemento válido vale um nível (5 = 200).","Agentes nulos: alguém, alguns, você, imperativo.","Condicional com 2+ elementos: no máximo 80."],
ex:["\"Portanto, é preciso criar leis mais rígidas a fim de reduzir crimes virtuais.\" Quantos elementos válidos há?","Dois: ação (criar leis mais rígidas) e efeito (reduzir crimes virtuais). Não há agente explícito, nem modo/meio nem detalhamento. Nível 2, 80 pontos."]},
{t:"C1 na prática — os desvios que mais derrubam a nota",d:"Vírgula, concordância de \"é necessário\", crase, pronomes, registro e truncamento.",kw:"",
s:[["Truncamento e justaposição","Truncar é cortar um período com ponto antes da hora: \"A desinformação cresce. Pois as pessoas não checam as fontes.\" O \"Pois\" deveria continuar o período anterior, depois de vírgula. O mesmo vale para frases que começam com gerúndio ou com \"Visto que\" isoladas. Justapor é o contrário: grudar com vírgula orações que deveriam ser frases separadas, como \"A internet mudou a comunicação, os jovens passam horas nas redes, isso afeta o sono\". Use ponto ou um conectivo."],
["Vírgula: o que é erro","Erro por excesso: vírgula entre sujeito e verbo (\"Os jovens brasileiros, usam muito as redes\"), entre verbo e complemento, ou depois de \"que\" e \"visto que\" antes da oração. Erro por falta: não isolar aposto, oração intercalada, adjunto adverbial deslocado com três palavras ou mais (\"Na maioria das vezes, o usuário...\") e os itens de uma enumeração. Não é erro deixar de pôr vírgula antes de \"e\" quando o sujeito muda."],
["A concordância de \"é necessário\"","Se o termo depois tem artigo ou pronome, concorde: \"É necessária uma campanha\", \"São necessárias algumas campanhas\". Sem determinante, o masculino é aceito: \"É necessário campanhas\". Se vem um verbo ou \"que\", fica sempre no masculino: \"É necessário criar campanhas\", \"É necessário que haja campanhas\". \"É necessário uma campanha\" e \"São necessárias fazer campanhas\" são desvios."],
["Crase, pronomes e paralelismo","Nunca há crase antes de verbo (\"à partir\", \"à fazer\" estão errados) e ela é obrigatória em casos como \"junto às mídias\" e \"à medida que\". Não comece frase com pronome oblíquo (\"Nos perguntamos\" vira \"Perguntamo-nos\" ou \"Nós nos perguntamos\"). Palavras negativas puxam o pronome: \"não se deixar levar\". Em enumerações, mantenha a mesma classe: \"conversar, pagar contas e estudar\", e não \"conversar, pagamento de contas e estudo\"."],
["Registro e escolha de palavras","Evite marcas de fala: \"pra\", \"tá\", \"né\", \"um monte de\", \"vc\", abreviações como \"p/\" e diminutivos. Cuidado com palavras parecidas: \"algoritmo\" (não \"logaritmo\"), \"conjectura\" (não \"conjuntura\"), \"ratificar\" (confirmar) x \"retificar\" (corrigir), \"infligir\" (aplicar pena) x \"infringir\" (violar). E não invente palavras derivadas que não existem."]],
k:["\"Pois\" isolado depois de ponto é truncamento.","Sem vírgula entre sujeito e verbo.","Adjunto deslocado de 3+ palavras pede vírgula.","\"É necessária uma\", mas \"é necessário fazer\"."],
ex:["Quantos problemas de C1 há em: \"É necessário uma mudança. Pois, os jovens brasileiros, passam muito tempo nas redes.\"?","Três: concordância (\"É necessária uma mudança\"), truncamento (o \"Pois\" deveria continuar o período anterior) e vírgula entre sujeito e verbo (\"os jovens brasileiros, passam\")."]},
{t:"C2 na prática — tema completo e repertório produtivo",d:"Como identificar os núcleos do tema e transformar repertório em argumento.",kw:"",
s:[["Ache os núcleos do tema","Antes de escrever, sublinhe as palavras-chave da frase temática. Em \"Desafios para a valorização de comunidades e povos tradicionais no Brasil\", os núcleos são: desafios, valorização, comunidades e povos tradicionais, Brasil. Falar só de \"povos indígenas no passado\" ou só de \"cultura brasileira\" é tangência. Retome os núcleos na introdução, em cada desenvolvimento e na conclusão."],
["As três partes, sem embrião","A banca confere se há introdução, desenvolvimento e conclusão proporcionais. Um parágrafo de duas linhas é uma parte embrionária. Uma parte embrionária limita a nota a 120; duas, a 80. Uma conclusão que termina com frase cortada também limita a 80. Planeje para que cada parágrafo tenha pelo menos três ou quatro períodos."],
["Que repertório vale","Vale o que tem respaldo nas áreas do conhecimento: um conceito sociológico, um fato histórico, uma lei, um dado de pesquisa, um livro, filme ou música conhecidos, uma personalidade conhecida. Não vale como repertório de fora o que você só repetiu dos textos motivadores, nem uma experiência pessoal (\"meu vizinho...\"). Repertório que não tem nada a ver com o tema também não ajuda."],
["Como tornar o repertório produtivo","Use a sequência: apresente o repertório, explique o que ele diz e mostre como ele prova o seu argumento. Exemplo: \"O sociólogo Zygmunt Bauman descreve a modernidade líquida, marcada por vínculos frágeis. Essa fragilidade aparece nas redes sociais, onde informações são compartilhadas sem reflexão, o que favorece a desinformação.\" A segunda frase é o que torna o repertório produtivo e libera os 200 pontos."],
["Tipos de argumento que funcionam","Provas concretas (dados e fatos sobre o tema), exemplos (casos parecidos ou ligados ao tema), autoridade (o que um especialista ou pensador diz), lógica (relação de causa e consequência). Um bom desenvolvimento costuma combinar autoridade ou dado com a sua própria explicação de causa e consequência."]],
k:["Sublinhe os núcleos da frase temática.","Parte embrionária: 1 limita a 120; 2 limitam a 80.","Repertório só dos textos motivadores: no máximo 120.","Produtivo = apresentar + explicar + ligar ao argumento."],
ex:["Um aluno escreve: \"Como disse Aristóteles, o homem é um animal político.\" e muda de assunto. Como tornar isso produtivo num texto sobre participação jovem na política?","Explicar e conectar: \"Para Aristóteles, o ser humano se realiza na vida em comunidade e na política. Quando os jovens se afastam do debate público, deixam de exercer essa dimensão e abrem espaço para decisões que ignoram seus interesses.\""]},
{t:"C3 na prática — projeto de texto e autoria",d:"Como planejar a argumentação para chegar aos 200 pontos.",kw:"",
s:[["Comece pelo projeto","Antes de escrever, defina em uma linha: tese (o que você defende) + argumento 1 + argumento 2 + solução. A introdução anuncia esse caminho, cada desenvolvimento cumpre um argumento e a conclusão resolve os dois. Se você anuncia duas causas e desenvolve só uma, isso é falha de projeto."],
["Direção","O leitor precisa saber, desde o início, qual é a sua posição. Um texto que só lista fatos sobre o tema, sem defender nada, não tem direção e cai para 40 pontos. Use verbos de posicionamento na tese: \"esse cenário decorre de...\", \"o problema persiste por causa de...\"."],
["Desenvolver é explicar","Cada informação precisa vir acompanhada de explicação: por que ela prova a sua tese? Ferramentas: definição, comparação, dado, exemplo, analogia, causa e consequência, citação de autoridade. O texto bem desenvolvido não deixa para o leitor a tarefa de ligar as ideias. Quanto mais informações soltas, menor a nota."],
["Autoria não é decorar repertório","Para a banca, autoria é ter um projeto estratégico e executá-lo de forma organizada. Um texto com repertório só dos textos motivadores pode ter autoria; um texto cheio de citações pode não ter. O texto deve se sustentar sozinho, sem que o leitor precise conhecer o assunto para entender."],
["160 ou 200?","No 160, ainda há falhas de projeto: algo anunciado que não é cumprido, um argumento que foge do recorte, uma ideia que fica solta no fim do parágrafo. No 200, só deslizes pontuais. Contradição grave entre partes do texto, como defender uma coisa na introdução e o contrário na conclusão, limita a nota a 80."]],
k:["Projeto: tese + 2 argumentos + solução, anunciados e cumpridos.","Sem direção: no máximo 40.","Informação sem explicação conta como não desenvolvida.","Contradição grave: no máximo 80."],
ex:["Introdução: \"o problema decorre da falta de fiscalização e da desinformação\". Os desenvolvimentos tratam de fiscalização e de desigualdade social. Qual o problema?","Falha de projeto: a introdução anunciou desinformação, mas o texto desenvolveu outro argumento (desigualdade). O anunciado não foi cumprido, o que impede o 200 na C3."]},
{t:"C4 na prática — operadores e inadequações",d:"Quadro de operadores argumentativos, coesão referencial e erros de conectivo.",kw:"",
s:[["Coesão referencial: retome sem repetir","Para não repetir palavras, retome com pronomes (\"isso\", \"essa medida\"), sinônimos (\"jovens\" e \"adolescentes\"), hiperônimos (\"o Instagram\" e \"essa rede social\"), nomes genéricos (\"esse fenômeno\", \"tal cenário\") e nominalizações (\"o governo investiu... esse investimento\"). Repetir as palavras do tema é aceito, desde que você alterne com algumas retomadas."],
["Operadores por função","Adição: além disso, ademais, não só... mas também. Oposição: no entanto, contudo, todavia, embora, ainda que. Conclusão: portanto, logo, por isso, por conseguinte. Explicação ou causa: porque, visto que, já que, uma vez que. Finalidade: a fim de, para que. Alternativa: ou... ou, seja... seja. Escolha pelo sentido, não pela aparência."],
["Ligar parágrafos","O conectivo no início do parágrafo deve se ligar ao parágrafo anterior: \"Além disso\" (soma um novo argumento), \"Por outro lado\" (contrapõe), \"Portanto\" (conclui). Para os 200, faça isso em pelo menos dois parágrafos e garanta ao menos um coesivo dentro de cada um. Um \"Segundo fulano\" que abre o parágrafo só para citar não conta como ligação entre parágrafos."],
["Inadequações comuns","Usar \"mas\" onde existe consequência (\"as pessoas não entendem os algoritmos, mas continuam sendo manipuladas\" pede \"e por isso\"); usar \"portanto\" onde existe oposição; usar \"onde\" para algo que não é lugar (\"uma relação onde todos opinam\" → \"em que\"). Uma única inadequação já impede os 200."],
["Repetição que pesa","O que mais derruba a C4 é repetir o mesmo operador (três \"porém\" no texto repetem sempre a mesma relação) e repetir um termo várias vezes perto um do outro sem nenhuma substituição. Varie o repertório coesivo e releia cada parágrafo procurando palavras repetidas na mesma linha."]],
k:["Retome com pronome, sinônimo, hiperônimo ou \"esse fenômeno\".","Escolha o conectivo pelo sentido.","200: 2 parágrafos ligados ao anterior + coesivo em todos.","\"Onde\" só para lugar."],
ex:["Corrija o conectivo: \"As campanhas de vacinação são gratuitas, portanto muitas pessoas não se vacinam.\"","A relação é de oposição, não de conclusão: \"As campanhas de vacinação são gratuitas; no entanto, muitas pessoas não se vacinam.\""]},
{t:"C5 na prática — montando a proposta nota 200",d:"Modelo, armadilhas e checklist da proposta de intervenção.",kw:"",
s:[["Modelo em uma frase","[Agente] deve [ação], por meio de [modo/meio], a fim de [efeito]. [Detalhamento]. Exemplo: \"O Ministério da Saúde deve ampliar o atendimento psicológico nas unidades básicas, por meio da contratação de psicólogos para as equipes de saúde da família, a fim de reduzir o estigma e facilitar o acesso ao tratamento. Essas equipes, que já visitam as casas, poderiam identificar casos precocemente.\" A última frase é o detalhamento."],
["Marcas de proposta","A banca reconhece a proposta por expressões de intenção: \"deve\", \"é necessário\", \"é preciso\", \"é importante\", \"cabe a\". Uma frase só descritiva (\"o governo cria leis\") é constatação. Citar uma lei ou um autor que diz \"deve\" (\"segundo a Constituição, o Estado deve garantir...\") também não é proposta sua."],
["Armadilhas que tiram pontos","Agente vago: \"alguém\", \"alguns\", \"você\" ou verbo no imperativo não contam. Ação vaga: \"medidas devem ser tomadas\" não conta. Forma condicional: \"se o governo investir, o problema diminuirá\" limita a 80. Constatação de falta: \"falta conscientização\" não é proposta. \"Nós\", \"todos\" e \"as pessoas\" valem como agente."],
["Onde colocar","A proposta pode aparecer em qualquer parágrafo, mas o mais seguro é concentrá-la na conclusão, ligada aos problemas dos desenvolvimentos. A banca avalia a proposta mais completa, então uma proposta bem feita vale mais do que três incompletas. Duas propostas completas, uma para cada argumento, fecham bem o projeto de texto."],
["Checklist final","Antes de passar a limpo, confira: 1) a ação responde ao problema do tema; 2) o agente está escrito; 3) há \"por meio de\" ou equivalente; 4) há \"a fim de\" ou \"para que\"; 5) há uma informação a mais sobre algum elemento; 6) nada fere os direitos humanos (nada de violência, tortura ou justiça com as próprias mãos)."]],
k:["Agente + deve + ação + por meio de + a fim de + detalhamento.","Citação com \"deve\" não é proposta sua.","Condicional: no máximo 80.","Avalia-se a proposta mais completa."],
ex:["Complete para 5 elementos: \"Portanto, é preciso combater as fake news.\"","Exemplo: \"Portanto, o Ministério da Educação deve combater as fake news (agente + ação), por meio de aulas de educação midiática nas escolas (meio), a fim de formar leitores críticos (efeito). Essas aulas poderiam ensinar a checar fontes em sites de verificação (detalhamento).\""]}
];

{t:"Antiguidade",d:"Grécia, Roma e as bases da política ocidental.",kw:"Grécia|grego|Roma|roman|Atenas|Esparta|antig|democracia",
s:[["Grécia","As pólis eram cidades-Estado independentes. Esparta era militarista e oligárquica. Atenas desenvolveu a democracia no século V a.C., com participação direta dos cidadãos na assembleia, mas cidadania restrita a homens adultos, livres e filhos de atenienses: mulheres, estrangeiros (metecos) e escravizados eram excluídos."],
["Cultura grega","Os gregos desenvolveram a filosofia, o teatro (tragédia e comédia), a história como investigação (Heródoto, Tucídides) e os Jogos Olímpicos. O período helenístico, após Alexandre, o Grande, misturou culturas grega e oriental."],
["Roma","Passou por Monarquia, República e Império. Na República, patrícios e plebeus disputaram direitos; os plebeus conquistaram tribunos e a Lei das Doze Tábuas. A expansão trouxe escravizados e riquezas, mas também crise. No Império, a pax romana e depois a crise do século III. O Império do Ocidente caiu em 476."],
["Legado","Direito romano, latim (base do português), urbanismo, aquedutos e o cristianismo, que se tornou religião oficial no fim do Império. O ENEM gosta de comparar a democracia ateniense com a atual."]],
k:["Democracia ateniense: direta e excludente.","Roma: Monarquia, República, Império.","476: queda de Roma no Ocidente.","Direito romano influencia o direito atual."],
ex:["Por que a democracia ateniense é considerada limitada?","Porque só uma minoria era cidadã: mulheres, estrangeiros e escravizados não participavam das decisões."]},
{t:"Idade Média",d:"Feudalismo, Igreja, cruzadas e crise do século XIV.",kw:"feudal|medieval|Igreja|servo|cruzad|senhor|Idade Média",
s:[["Feudalismo","Após o fim do Império Romano do Ocidente, a Europa ruralizou-se. O feudo era a unidade econômica, com produção para subsistência. Suseranos concediam terras a vassalos em troca de fidelidade militar. Servos estavam presos à terra e pagavam obrigações como corveia (trabalho) e talha (parte da produção)."],
["Igreja","A Igreja Católica era a principal instituição: detinha terras, cultura e poder político. A sociedade era vista como dividida em ordens: os que rezam (clero), os que guerreiam (nobreza) e os que trabalham (servos). O saber se concentrava em mosteiros."],
["Baixa Idade Média","A partir do século XI, as Cruzadas reabriram o comércio com o Oriente, surgiram feiras e cidades (burgos) e uma nova camada, a burguesia. Universidades foram fundadas."],
["Crise do século XIV","Fome, Peste Negra (que matou cerca de um terço da população europeia) e a Guerra dos Cem Anos abalaram o feudalismo. Revoltas camponesas e a centralização do poder nas mãos dos reis abriram caminho para os Estados nacionais."]],
k:["Feudo: base econômica rural.","Suserania e vassalagem entre nobres.","Cruzadas → renascimento comercial e urbano.","Século XIV: fome, peste e guerra."],
ex:["Como as Cruzadas contribuíram para o fim do feudalismo?","Reabriram rotas comerciais com o Oriente, estimulando feiras, cidades e a burguesia, o que enfraqueceu a economia fechada dos feudos."]},
{t:"Idade Moderna",d:"Grandes navegações, absolutismo, mercantilismo, Reforma e Iluminismo.",kw:"absolutis|mercantilis|Reforma|Iluminis|navegaç|renasciment",
s:[["Navegações e mercantilismo","Portugal e Espanha lideraram as navegações nos séculos XV e XVI, buscando especiarias e metais. O mercantilismo defendia acumular metais preciosos, balança comercial favorável, protecionismo e exploração de colônias (pacto colonial)."],
["Absolutismo","Os reis centralizaram o poder, apoiados na burguesia e na teoria do direito divino. Teóricos: Hobbes (Estado forte para evitar a guerra de todos contra todos) e Bossuet. Exemplo clássico: Luís XIV, na França."],
["Renascimento e Reforma","O Renascimento valorizou o ser humano (antropocentrismo), a razão e a cultura clássica. A Reforma Protestante, iniciada por Lutero em 1517, criticou a venda de indulgências; surgiram luteranismo, calvinismo e anglicanismo. A Igreja respondeu com a Contrarreforma (Concílio de Trento, Inquisição, jesuítas)."],
["Iluminismo","No século XVIII, pensadores defenderam a razão contra o absolutismo e os privilégios. Locke (direitos naturais), Montesquieu (separação dos três poderes), Voltaire (liberdade de expressão e tolerância), Rousseau (soberania popular). Adam Smith criticou o mercantilismo e defendeu o liberalismo econômico."]],
k:["Mercantilismo: metais e balança favorável.","Absolutismo: poder centralizado no rei.","Reforma: Lutero, 1517.","Montesquieu: três poderes."],
ex:["Por que o Iluminismo é chamado de 'século das luzes'?","Porque seus pensadores usavam a 'luz da razão' para criticar a ignorância, a intolerância religiosa e o poder absoluto."]},
{t:"Revoluções e século XIX",d:"Revolução Inglesa, Industrial, Francesa e a independência das Américas.",kw:"revoluç|industrial|operári|burgues|francesa|independência|fábrica",
s:[["Revolução Industrial","Começou na Inglaterra no século XVIII, com máquinas a vapor e indústria têxtil. Trouxe produção em larga escala, urbanização, jornadas longas, trabalho infantil e o surgimento do proletariado. Reações: ludismo (quebra de máquinas), cartismo e o movimento sindical."],
["Revolução Francesa","Em 1789, com a queda da Bastilha, a burguesia e o povo derrubaram o Antigo Regime. A Declaração dos Direitos do Homem e do Cidadão afirmou igualdade perante a lei. Fases: Monarquia Constitucional, Convenção (com o Terror jacobino) e Diretório, até o golpe de Napoleão em 1799."],
["Era Napoleônica","Napoleão expandiu o império francês e espalhou o Código Civil. O Bloqueio Continental contra a Inglaterra levou à invasão de Portugal e à vinda da família real para o Brasil em 1808. Após a derrota, o Congresso de Viena tentou restaurar as monarquias."],
["Ideologias do século XIX","Liberalismo (liberdade individual e econômica), socialismo (crítica ao capitalismo; Marx e Engels, Manifesto Comunista de 1848), anarquismo (fim do Estado) e nacionalismo, que levou às unificações da Itália e da Alemanha e ao imperialismo na África e na Ásia."]],
k:["Revolução Industrial: Inglaterra, século XVIII.","1789: Revolução Francesa e Direitos do Homem.","1808: família real portuguesa no Brasil.","1848: Manifesto Comunista."],
ex:["Qual a relação entre Napoleão e a vinda da corte portuguesa ao Brasil?","Portugal não aderiu ao Bloqueio Continental contra a Inglaterra; Napoleão invadiu Portugal e a família real fugiu para o Brasil em 1808, com apoio inglês."]},
{t:"Brasil Colônia",d:"Colonização, açúcar, escravidão, mineração e revoltas.",kw:"colôni|colonial|açúcar|engenho|escrav|bandeir|minera|jesuít|indígen",
s:[["Início da colonização","Após 1500, os primeiros 30 anos foram de exploração do pau-brasil. Em 1534 vieram as capitanias hereditárias e, em 1548, o governo-geral, sediado em Salvador. Os jesuítas catequizavam os indígenas e fundaram vilas como São Paulo."],
["Economia açucareira","Do século XVI ao XVII, o açúcar foi o centro da economia, no Nordeste, em grandes propriedades (latifúndios) monocultoras, voltadas à exportação e baseadas no trabalho de africanos escravizados (plantation). A escravidão africana movimentou o lucrativo tráfico negreiro."],
["Resistência","Indígenas resistiram em guerras como a Confederação dos Tamoios. Africanos escravizados resistiram com fugas, revoltas, preservação cultural e quilombos. O maior foi Palmares, em Alagoas, liderado por Zumbi, destruído em 1695. 20 de novembro é o Dia da Consciência Negra."],
["Mineração e revoltas","No século XVIII, o ouro em Minas Gerais deslocou o centro econômico para o Sudeste e a capital foi para o Rio de Janeiro (1763). A Coroa cobrava o quinto e ameaçava com a derrama. Revoltas: Inconfidência Mineira (1789), da elite, inspirada no Iluminismo, com Tiradentes executado; e Conjuração Baiana (1798), mais popular, com propostas de fim da escravidão."]],
k:["1534 capitanias; 1548 governo-geral.","Plantation: latifúndio, monocultura, exportação, escravidão.","Palmares e Zumbi: resistência.","1789 Inconfidência; 1798 Conjuração Baiana."],
ex:["Qual a principal diferença entre a Inconfidência Mineira e a Conjuração Baiana?","A Inconfidência foi liderada pela elite e não propunha o fim da escravidão; a Conjuração Baiana teve participação popular e defendia igualdade e abolição."]},
{t:"Brasil Império",d:"Independência, regências, Segundo Reinado e abolição.",kw:"Império|imperador|Pedro|regênci|abolição|escravidão|1822|1888|Lei Áurea",
s:[["Independência e Primeiro Reinado","Em 1822, D. Pedro proclamou a independência, mantendo a monarquia e a escravidão. A Constituição de 1824 foi outorgada e criou o Poder Moderador, que dava ao imperador poder sobre os demais. Houve crise política e econômica, e D. Pedro I abdicou em 1831."],
["Período Regencial (1831–1840)","Com o herdeiro criança, o Brasil foi governado por regentes. Explodiram revoltas provinciais: Cabanagem (Pará), Balaiada (Maranhão), Sabinada (Bahia), Farroupilha (Rio Grande do Sul, a mais longa) e Revolta dos Malês (Bahia, de africanos muçulmanos escravizados). O Golpe da Maioridade antecipou o reinado de D. Pedro II."],
["Segundo Reinado","O café, no Vale do Paraíba e depois no Oeste Paulista, virou o motor da economia. Houve a Guerra do Paraguai (1864–1870). A imigração europeia cresceu com a substituição gradual da mão de obra escravizada."],
["Abolição e fim do Império","Leis graduais: Eusébio de Queirós (1850, fim do tráfico), Ventre Livre (1871) e Sexagenários (1885). A Lei Áurea, em 1888, aboliu a escravidão, sem indenização nem integração dos libertos à sociedade, o que deixou heranças de desigualdade. Em 1889, a República foi proclamada."]],
k:["1822 independência; 1824 Constituição com Poder Moderador.","Regências: revoltas provinciais.","Café no Segundo Reinado.","1888 Lei Áurea, sem integração dos libertos."],
ex:["Por que se diz que a abolição de 1888 foi incompleta?","Porque libertou os escravizados sem terra, educação, trabalho ou políticas de inclusão, mantendo a população negra marginalizada."]},
{t:"Brasil República",d:"República Velha, Era Vargas, ditadura e redemocratização.",kw:"República|Vargas|ditadura|militar|1964|AI-5|coronel|Constituição|Estado Novo",
s:[["República Velha (1889–1930)","Dominada pelas oligarquias: política do café com leite (São Paulo e Minas), política dos governadores e coronelismo, com voto de cabresto (o voto não era secreto). Revoltas: Canudos, Contestado, Revolta da Vacina (1904) e Revolta da Chibata (1910). O tenentismo questionou o sistema nos anos 1920."],
["Era Vargas (1930–1945)","A Revolução de 1930 levou Getúlio Vargas ao poder. Houve industrialização, criação do Ministério do Trabalho, voto feminino (1932) e a CLT (1943). Em 1937, o Estado Novo instaurou uma ditadura com censura e propaganda (DIP). Vargas voltou eleito em 1951, criou a Petrobras e se suicidou em 1954."],
["Ditadura civil-militar (1964–1985)","O golpe de 1964 derrubou João Goulart. O regime usou Atos Institucionais; o AI-5 (1968) fechou o Congresso e suspendeu garantias, intensificando censura, tortura e perseguição. O 'milagre econômico' trouxe crescimento com concentração de renda e dívida externa. A Lei da Anistia é de 1979."],
["Redemocratização","O movimento Diretas Já (1984) pediu eleições diretas. Tancredo Neves foi eleito indiretamente em 1985 e morreu; assumiu Sarney. A Constituição de 1988, chamada de Constituição Cidadã, ampliou direitos sociais e criou o SUS. A primeira eleição direta pós-ditadura foi em 1989."]],
k:["Café com leite e coronelismo.","Vargas: CLT (1943) e Estado Novo (1937).","AI-5 em 1968.","Constituição Cidadã de 1988 cria o SUS."],
ex:["O que foi o voto de cabresto?","Era o controle do voto dos eleitores pelos coronéis, possível porque o voto não era secreto na República Velha."]},
{t:"Século XX no mundo",d:"Guerras mundiais, crise de 1929, totalitarismos, Guerra Fria e descolonização.",kw:"Guerra Fria|guerra mundial|nazis|fascis|totalit|soviétic|1929|descoloniz",
s:[["Primeira Guerra (1914–1918)","Causas: imperialismo, nacionalismo, corrida armamentista e alianças militares. O estopim foi o assassinato do herdeiro austríaco em Sarajevo. Guerra de trincheiras. O Tratado de Versalhes impôs duras punições à Alemanha. Em 1917 ocorreu a Revolução Russa, que criou o primeiro Estado socialista."],
["Entreguerras","A crise de 1929, com a quebra da Bolsa de Nova York, gerou desemprego mundial. Os EUA responderam com o New Deal (intervenção do Estado na economia). Na Europa, a crise favoreceu regimes totalitários: fascismo na Itália (Mussolini) e nazismo na Alemanha (Hitler), com nacionalismo extremo, antissemitismo e culto ao líder."],
["Segunda Guerra (1939–1945)","Começou com a invasão da Polônia pela Alemanha. O Holocausto exterminou cerca de 6 milhões de judeus, além de ciganos, homossexuais e outros grupos. Terminou com as bombas atômicas em Hiroshima e Nagasaki. Depois surgiram a ONU (1945) e a Declaração Universal dos Direitos Humanos (1948)."],
["Guerra Fria e descolonização","Disputa entre EUA (capitalismo) e URSS (socialismo), sem confronto direto entre eles: corrida armamentista e espacial, Muro de Berlim (1961–1989), guerras da Coreia e do Vietnã, crise dos mísseis em Cuba. Terminou com o fim da URSS em 1991. Ao mesmo tempo, colônias da África e da Ásia conquistaram independência."]],
k:["1917: Revolução Russa.","1929: crise e New Deal.","Totalitarismos: nazismo e fascismo.","Guerra Fria: 1947 a 1991."],
ex:["Por que a Guerra Fria recebeu esse nome?","Porque EUA e URSS nunca se enfrentaram diretamente; a disputa ocorreu por meio de corrida armamentista, propaganda e conflitos em outros países."]}
];

MOD["Geografia"] = [
{t:"Cartografia",d:"Coordenadas, fusos horários, escalas e projeções.",kw:"mapa|latitude|longitude|fuso|projeç|escala|cartogr",
s:[["Coordenadas geográficas","Latitude é a distância em graus até a Linha do Equador (0° a 90° norte ou sul). Longitude é a distância até o Meridiano de Greenwich (0° a 180° leste ou oeste). O cruzamento das duas localiza qualquer ponto na Terra."],
["Fusos horários","A Terra gira 360° em 24 horas, ou seja, 15° por hora. A leste as horas estão adiantadas; a oeste, atrasadas. O Brasil tem quatro fusos; o horário de Brasília é o oficial (UTC−3)."],
["Escalas","Escala numérica (1:100.000) ou gráfica (barra). Escala grande mostra pequena área com muitos detalhes (planta de bairro); escala pequena mostra grande área com poucos detalhes (mapa-múndi). Lembre que 1:10.000 é maior que 1:1.000.000."],
["Projeções","Toda projeção distorce algo. Mercator é cilíndrica e conforme: preserva formas e ângulos, mas exagera áreas perto dos polos (a Groenlândia parece do tamanho da África), e é ligada a uma visão eurocêntrica. Peters é equivalente: preserva áreas e distorce formas, valorizando os países do Sul."]],
k:["15° de longitude = 1 hora.","Leste adianta; oeste atrasa.","Escala grande = mais detalhe.","Mercator: formas. Peters: áreas."],
ex:["Em Brasília (45° O, aprox.) são 12h. Que horas são em um ponto a 15° L?","A diferença é 60°, ou seja, 4 horas. Como o ponto está a leste, adianta: 16h."]},
{t:"Geologia, relevo e solos",d:"Estrutura da Terra, placas, agentes do relevo e solos tropicais.",kw:"relevo|solo|erosão|placa|rocha|tectôn|vulc|assoreamento",
s:[["Estrutura interna e placas","A Terra tem crosta, manto e núcleo. A litosfera é dividida em placas tectônicas que se movem sobre o manto. Nos limites ocorrem terremotos, vulcões e cordilheiras. O Brasil está no centro da Placa Sul-Americana, por isso tem poucos terremotos fortes e nenhum vulcão ativo."],
["Rochas","Magmáticas: formadas pelo resfriamento do magma (granito, basalto). Sedimentares: acúmulo de sedimentos, onde se encontram petróleo e fósseis (arenito). Metamórficas: transformação de outras rochas por pressão e temperatura (mármore, ardósia)."],
["Agentes externos","Intemperismo é a desagregação das rochas, físico ou químico; em clima quente e úmido, o químico predomina. Erosão é o transporte de material por água, vento ou gelo. Desmatamento aumenta a erosão e causa assoreamento, o acúmulo de sedimentos no leito dos rios."],
["Solos tropicais","Lixiviação: a chuva lava os nutrientes do solo. Laterização: formação de crostas ferruginosas que endurecem o solo. Voçorocas são grandes erosões. Técnicas de conservação: curvas de nível, terraceamento, plantio direto e mata ciliar."]],
k:["Brasil: centro de placa, estável.","Sedimentares guardam petróleo e fósseis.","Desmatamento → erosão → assoreamento.","Curva de nível e mata ciliar protegem o solo."],
ex:["Por que a retirada da mata ciliar prejudica os rios?","Sem a vegetação, a chuva carrega sedimentos para o rio, causando assoreamento, menos profundidade, enchentes e piora da qualidade da água."]},
{t:"Clima e questões ambientais",d:"Fatores climáticos, climas do Brasil e problemas atmosféricos.",kw:"clima|chuva|temperatura|aquecimento|estufa|El Niño|seca|ilha de calor",
s:[["Fatores do clima","Latitude (mais perto do Equador, mais calor), altitude (mais alto, mais frio), maritimidade e continentalidade (o mar reduz a amplitude térmica), massas de ar, correntes marítimas e relevo. Chuva orográfica ocorre quando o ar úmido sobe a serra, esfria e condensa."],
["Climas do Brasil","Equatorial (Amazônia, quente e úmido), tropical (verão chuvoso e inverno seco), tropical de altitude (Sudeste serrano), semiárido (Sertão nordestino, chuvas escassas e irregulares), litorâneo úmido e subtropical (Sul, com estações bem definidas e possibilidade de geada)."],
["Fenômenos","El Niño: aquecimento das águas do Pacífico, causa seca no Norte e Nordeste e chuvas no Sul. La Niña: resfriamento, efeitos geralmente opostos. Ilha de calor: centros urbanos mais quentes pelo asfalto e falta de vegetação. Inversão térmica: no inverno, uma camada fria fica embaixo e retém poluentes."],
["Mudanças climáticas","O efeito estufa é natural e essencial à vida, mas é intensificado por emissões de CO₂ e metano (combustíveis fósseis, desmatamento, pecuária). Isso causa aquecimento global, eventos extremos e elevação do nível do mar. A camada de ozônio é outro problema: filtra raios ultravioleta e foi afetada pelos CFCs, controlados pelo Protocolo de Montreal. O Acordo de Paris (2015) trata das emissões."]],
k:["Maritimidade reduz amplitude térmica.","El Niño: seca no Nordeste, chuva no Sul.","Inversão térmica: inverno e poluição.","Efeito estufa ≠ buraco na camada de ozônio."],
ex:["Por que São Paulo tem mais problemas respiratórios no inverno?","Porque a inversão térmica é mais comum nessa estação: o ar frio fica preso perto do solo e os poluentes não se dispersam."]},
{t:"Biomas e recursos hídricos",d:"Biomas brasileiros, bacias hidrográficas e conflitos pela água.",kw:"bioma|Amazôn|Cerrado|Caatinga|Mata Atlântica|bacia|rio|água|aquífero",
s:[["Amazônia e Cerrado","Amazônia: maior floresta tropical do mundo, alta biodiversidade, solo pobre e dependente da ciclagem de nutrientes; ameaçada por desmatamento para pecuária, soja, garimpo e grilagem. Cerrado: savana com raízes profundas, chamado de berço das águas por abrigar nascentes de grandes bacias; muito afetado pela expansão agrícola."],
["Caatinga, Mata Atlântica, Pantanal e Pampa","Caatinga: exclusivamente brasileira, semiárido, plantas adaptadas à seca (xerófitas). Mata Atlântica: a mais devastada, restam pequenas porcentagens; abriga a maior parte da população. Pantanal: maior planície alagável do mundo, com cheias e vazantes. Pampa: campos do Sul, ameaçados pela pecuária intensiva e pela arenização."],
["Água no Brasil","O Brasil tem grande parte da água doce superficial do mundo, mas mal distribuída: muita água na Amazônia e pouca no Nordeste. Bacias importantes: Amazônica, do Paraná (maior potencial hidrelétrico em uso) e do São Francisco (rio da integração nacional, alvo de transposição). Aquíferos como o Guarani guardam água subterrânea."],
["Problemas e soluções","Desperdício, poluição por esgoto e agrotóxicos, crises hídricas e conflitos pelo uso. Soluções: saneamento básico, reúso, proteção de nascentes e matas ciliares, cisternas no semiárido e cobrança pelo uso da água."]],
k:["Cerrado: berço das águas.","Caatinga: só existe no Brasil.","Mata Atlântica: mais devastada.","Água abundante, mas mal distribuída."],
ex:["Por que a destruição do Cerrado afeta o abastecimento de outras regiões?","Porque nascem nele rios de grandes bacias (como São Francisco e Paraná); desmatar reduz a infiltração e alimenta menos as nascentes."]},
{t:"Urbanização e população",d:"Urbanização brasileira, problemas urbanos, demografia e migrações.",kw:"urban|cidade|metrópole|favela|populaç|migraç|êxodo|demográf",
s:[["Urbanização brasileira","Foi rápida e concentrada a partir de 1950, com a industrialização e o êxodo rural causado pela mecanização do campo e pela concentração de terras. Hoje a grande maioria dos brasileiros vive em cidades. A velocidade do processo, sem planejamento, gerou problemas."],
["Problemas urbanos","Favelização e moradias em áreas de risco, déficit habitacional, segregação socioespacial (ricos e pobres separados), mobilidade difícil, enchentes por impermeabilização do solo, ilhas de calor e violência. Gentrificação é a valorização de uma área que expulsa os moradores mais pobres."],
["Rede urbana","Metrópoles concentram serviços e influência. Conurbação é a união física de cidades vizinhas. Megalópole é a junção de metrópoles, como o eixo Rio–São Paulo. Hoje há desconcentração industrial para cidades médias do interior."],
["Demografia","Transição demográfica: primeiro cai a mortalidade, depois a natalidade. O Brasil vive envelhecimento populacional, com pirâmide de base estreita e topo largo. Isso pressiona a previdência e a saúde, mas houve um período de bônus demográfico, com muita população em idade de trabalhar."]],
k:["Êxodo rural + industrialização = urbanização acelerada.","Segregação socioespacial e gentrificação.","Conurbação: cidades que se juntam.","Brasil está envelhecendo."],
ex:["Por que as enchentes urbanas aumentaram nas grandes cidades?","A impermeabilização do solo por asfalto e concreto impede a infiltração da chuva, e a água escoa rapidamente para rios canalizados e assoreados."]},
{t:"Geografia econômica e globalização",d:"Globalização, indústria, agropecuária, energia e blocos econômicos.",kw:"globaliz|indústria|agro|exporta|commodit|energia|petróleo|Mercosul|economia",
s:[["Globalização","Integração mundial de economias, culturas e informações, acelerada pelos meios de transporte e comunicação. Milton Santos chama esse momento de meio técnico-científico-informacional e critica a globalização perversa, que aprofunda desigualdades. Multinacionais espalham etapas da produção por vários países."],
["Indústria","No Brasil, a industrialização ganhou força com Vargas e Juscelino Kubitschek (indústria automobilística). Concentrou-se no Sudeste e hoje se desconcentra por incentivos fiscais, mão de obra mais barata e guerra fiscal entre estados. Há preocupação com a desindustrialização."],
["Agropecuária","O agronegócio brasileiro é grande exportador de commodities (soja, milho, carne, café, açúcar). Convive com concentração fundiária, conflitos no campo, uso intenso de agrotóxicos e desmatamento. A agricultura familiar produz grande parte dos alimentos consumidos internamente."],
["Energia e blocos","A matriz elétrica brasileira é majoritariamente renovável, com destaque para hidrelétricas e crescimento de eólica e solar. A matriz energética total ainda depende muito de petróleo. Blocos econômicos: Mercosul, União Europeia, USMCA (antigo Nafta). O BRICS reúne economias emergentes."]],
k:["Milton Santos: meio técnico-científico-informacional.","Brasil exporta commodities.","Matriz elétrica brasileira é majoritariamente renovável.","Desconcentração industrial para o interior."],
ex:["Por que a matriz elétrica do Brasil é considerada limpa, mas vulnerável?","É majoritariamente hidrelétrica (renovável), mas depende das chuvas; em secas, os reservatórios baixam e é preciso acionar termelétricas, mais caras e poluentes."]}
];

MOD["Filosofia e Sociologia"] = [
{t:"Filosofia antiga",d:"Pré-socráticos, sofistas, Sócrates, Platão e Aristóteles.",kw:"Sócrates|Platão|Aristóteles|filósof|sofista|grego",
s:[["Pré-socráticos","Primeiros filósofos gregos, buscavam a arché, o princípio de todas as coisas, com explicações racionais em vez de mitológicas. Tales: água. Heráclito: tudo flui, a realidade é mudança. Parmênides: o ser é imutável, a mudança é ilusão. Demócrito: átomos."],
["Sofistas e Sócrates","Sofistas eram professores de retórica que ensinavam a convencer e defendiam o relativismo (o homem é a medida de todas as coisas, segundo Protágoras). Sócrates buscava a verdade pelo diálogo: ironia (mostrar a ignorância do interlocutor) e maiêutica (ajudar a parir ideias). Foi condenado à morte em Atenas."],
["Platão","Dividiu a realidade em mundo sensível (aparências, cópias imperfeitas) e mundo das ideias (essências perfeitas e eternas). A alegoria da caverna mostra prisioneiros que tomam sombras por realidade; o filósofo é quem sai da caverna e busca o conhecimento verdadeiro. Em A República, propõe um governo de filósofos."],
["Aristóteles","Discípulo de Platão, valorizou a experiência sensível. Criou a lógica formal (silogismo). Na ética, a felicidade (eudaimonia) vem da virtude, que é o justo meio entre dois extremos: a coragem fica entre a covardia e a temeridade. Definiu o ser humano como animal político."]],
k:["Arché: princípio de tudo.","Sócrates: ironia e maiêutica.","Platão: mundo das ideias e caverna.","Aristóteles: justo meio e animal político."],
ex:["O que representa a saída do prisioneiro da caverna em Platão?","A passagem da ignorância e das aparências para o conhecimento verdadeiro, alcançado pela razão."]},
{t:"Filosofia moderna e política",d:"Racionalismo, empirismo, Kant e os contratualistas.",kw:"Descartes|Kant|Hobbes|Locke|Rousseau|Maquiavel|contrato|razão",
s:[["Racionalismo e empirismo","Descartes, racionalista, usou a dúvida metódica: duvidar de tudo até chegar a uma certeza, o penso, logo existo. Para ele, a razão é a fonte segura do conhecimento. Os empiristas, como Locke e Hume, defendem que o conhecimento vem da experiência; Locke compara a mente a uma folha em branco."],
["Kant","Kant uniu as duas correntes: o conhecimento começa na experiência, mas é organizado por estruturas da razão. Na ética, propôs o imperativo categórico: aja de modo que sua ação possa virar lei universal, e trate as pessoas sempre como fim, nunca apenas como meio."],
["Maquiavel e os contratualistas","Maquiavel, em O Príncipe, separou política e moral: o governante deve buscar manter o poder, sendo mais seguro ser temido do que amado. Contratualistas explicam a origem do Estado por um pacto: Hobbes (no estado de natureza há guerra de todos contra todos; o Estado forte, o Leviatã, garante a paz)."],
["Locke e Rousseau","Locke: os homens têm direitos naturais à vida, à liberdade e à propriedade; o Estado existe para protegê-los, e o povo pode se rebelar contra governos tiranos (base do liberalismo). Rousseau: o homem nasce bom e a sociedade o corrompe; a soberania pertence ao povo e se expressa na vontade geral."]],
k:["Descartes: penso, logo existo.","Kant: imperativo categórico.","Hobbes: Estado forte. Locke: direitos naturais.","Rousseau: vontade geral."],
ex:["Por que Hobbes defende um Estado com muito poder?","Porque no estado de natureza os homens viveriam em guerra constante; só um poder forte, aceito por todos no contrato, garantiria segurança e paz."]},
{t:"Sociologia clássica",d:"Durkheim, Weber e Marx.",kw:"Durkheim|Weber|Marx|social|classe|trabalho|capitalis",
s:[["Durkheim","Fundador da sociologia como ciência. Fato social é toda maneira de agir, pensar e sentir que é exterior ao indivíduo, coercitiva e geral, como leis, moral e idioma. Solidariedade mecânica une sociedades simples pela semelhança; orgânica une sociedades modernas pela divisão do trabalho. Anomia é a falta de normas que gera desorientação social."],
["Weber","Estudou a ação social, aquela orientada pelo comportamento dos outros, com tipos: racional com relação a fins, racional com relação a valores, afetiva e tradicional. Definiu três tipos de dominação legítima: tradicional (costume, como reis), carismática (qualidades do líder) e racional-legal (leis e burocracia). Em A Ética Protestante, ligou o protestantismo ao espírito do capitalismo."],
["Marx","A história é a história da luta de classes. No capitalismo, a burguesia detém os meios de produção e o proletariado vende sua força de trabalho. Mais-valia é o valor produzido pelo trabalhador além do que recebe de salário, apropriado pelo capitalista. Alienação é o afastamento do trabalhador do produto e do sentido do seu trabalho."],
["Comparando","Durkheim enfatiza a sociedade sobre o indivíduo e a coesão social. Weber parte das ações individuais e do sentido que as pessoas dão a elas. Marx foca nos conflitos econômicos e na transformação da sociedade."]],
k:["Durkheim: fato social e anomia.","Weber: ação social e dominações.","Marx: luta de classes, mais-valia, alienação.","Coesão (Durkheim) × conflito (Marx)."],
ex:["Um trabalhador de linha de montagem que repete o mesmo gesto o dia todo e não reconhece o produto final vive o que, para Marx?","Alienação: ele se afasta do produto e do sentido de seu trabalho."]},
{t:"Pensamento contemporâneo",d:"Autores do século XX muito usados em questões e redações.",kw:"Bauman|Foucault|Arendt|Adorno|indústria cultural|Beauvoir|Sartre",
s:[["Escola de Frankfurt","Adorno e Horkheimer criaram o conceito de indústria cultural: a cultura transformada em mercadoria padronizada, produzida em série para o consumo, que tende a reduzir o senso crítico do público. Muito usado em temas sobre mídia e consumo."],
["Foucault","Estudou as relações de poder espalhadas pela sociedade, e não só no Estado. O poder disciplinar age sobre os corpos em instituições como prisões, escolas, hospitais e quartéis, por meio da vigilância constante (o panóptico) e da normalização dos comportamentos."],
["Arendt e o existencialismo","Hannah Arendt, ao acompanhar o julgamento de um oficial nazista, formulou a banalidade do mal: o mal praticado por pessoas comuns que obedecem sem refletir. Sartre, existencialista, afirmou que a existência precede a essência: somos livres e responsáveis pelo que fazemos de nós mesmos. Simone de Beauvoir mostrou que o gênero é construção social."],
["Bauman e outros","Zygmunt Bauman descreveu a modernidade líquida: relações, empregos e identidades frágeis, instáveis e descartáveis. Pierre Bourdieu falou em capital cultural, que ajuda a explicar a desigualdade escolar. Byung-Chul Han trata da sociedade do cansaço e do desempenho."]],
k:["Indústria cultural: cultura como mercadoria.","Foucault: poder disciplinar e vigilância.","Arendt: banalidade do mal.","Bauman: modernidade líquida."],
ex:["Que autor usar numa redação sobre vigilância em redes sociais e por quê?","Foucault: a ideia de vigilância permanente e de normalização dos comportamentos ajuda a analisar como as redes moldam condutas."]},
{t:"Cultura, cidadania e movimentos sociais",d:"Conceitos de cultura, etnocentrismo, cidadania e direitos.",kw:"cultura|etnocentr|cidadania|direitos|movimento social|racismo|desigualdade",
s:[["Cultura e etnocentrismo","Cultura, na antropologia, é todo o modo de vida de um grupo: crenças, costumes, técnicas e valores. Etnocentrismo é julgar outras culturas a partir da própria, considerando-a superior. Relativismo cultural propõe compreender cada cultura em seu próprio contexto."],
["Cidadania","Segundo T. H. Marshall, a cidadania foi construída em etapas: direitos civis (liberdade), políticos (votar e ser votado) e sociais (saúde, educação, trabalho). No Brasil, José Murilo de Carvalho aponta que a ordem foi diferente, com direitos sociais concedidos antes da plena garantia dos políticos e civis."],
["Desigualdade e racismo","O racismo estrutural é aquele que está presente nas instituições e na organização da sociedade, não só em atitudes individuais. Políticas de ação afirmativa, como as cotas (Lei de Cotas de 2012), buscam reduzir desigualdades históricas de acesso."],
["Movimentos sociais","Ações coletivas organizadas que reivindicam direitos ou mudanças: movimento negro, feminista, LGBTQIA+, indígena, sem-terra, ambientalista. Usam protestos, ocupações, redes sociais e participação institucional. São tema frequente em questões de Ciências Humanas."]],
k:["Etnocentrismo: julgar o outro pela própria cultura.","Cidadania: direitos civis, políticos e sociais.","Racismo estrutural: está nas instituições.","Cotas: ação afirmativa."],
ex:["Um viajante diz que a comida de outro país é 'nojenta' por ser diferente da sua. Que conceito isso ilustra?","Etnocentrismo: avaliar a cultura alheia tendo a própria como padrão de normalidade."]}
];

const RUBRICA=`GRADES DE CORREÇÃO DAS 5 COMPETÊNCIAS DO ENEM
Regra geral: se o texto tem características de dois níveis, atribua o nível MAIS BAIXO.
C1 (norma-padrão) — avalie estrutura sintática e desvios separadamente.
 0: estrutura sintática inexistente | 40: estrutura deficitária COM muitos desvios | 80: estrutura deficitária OU muitos desvios | 120: estrutura regular E alguns desvios | 160: estrutura boa E poucos desvios | 200: estrutura excelente (no máximo 1 falha) E no máximo 2 desvios.
 Falhas de estrutura: truncamento de períodos, justaposição de orações só com vírgula, excesso/falta/duplicação de palavras. Desvios: convenções da escrita (acentuação, ortografia, hífen, maiúsculas, translineação), gramaticais (regência, concordância, pontuação, paralelismo, pronomes, crase), registro (informalidade/oralidade) e escolha vocabular imprecisa.
C2 (tema, tipo textual, repertório).
 40: tangência ao tema OU aglomerado de palavras OU traços constantes de outros tipos textuais | 80: tema completo E (2 partes embrionárias OU conclusão com frase incompleta); muitos trechos copiados dos textos motivadores também limitam a 80 | 120: tema completo E 3 partes (1 pode ser embrionária) E repertório baseado nos textos motivadores, não legitimado ou não pertinente | 160: 3 partes não embrionárias E repertório legitimado e pertinente MAS improdutivo | 200: 3 partes não embrionárias E repertório legitimado, pertinente E com uso produtivo (vinculado à discussão).
C3 (projeto de texto e desenvolvimento).
 40: tangente ao tema com direção, OU tema completo sem direção | 80: projeto com muitas falhas E sem desenvolvimento ou desenvolvendo só uma informação; contradição grave limita a 80 | 120: projeto com algumas falhas E desenvolvimento de algumas informações | 160: projeto com poucas falhas E desenvolvimento da maior parte | 200: projeto estratégico E desenvolvimento em todo o texto (admite deslizes pontuais).
C4 (coesão).
 0: justaposição sem articulação | 40: presença rara de coesivos OU repetições/inadequações excessivas | 80: presença pontual OU muitas repetições/inadequações; monobloco (sem parágrafos) fica no máximo em 80 | 120: presença regular OU algumas repetições/inadequações | 160: presença constante intra e interparágrafos E poucas repetições/inadequações; exige operador argumentativo entre parágrafos em pelo menos 1 momento | 200: presença expressiva E repetições raras/ausentes E NENHUMA inadequação; exige operador entre parágrafos em pelo menos 2 momentos e ao menos 1 coesivo dentro de todos os parágrafos. Conectivo no início do parágrafo que só liga ideias internas dele não conta como interparágrafos. Repetição de palavras do tema é tolerada; pese repetição de operadores e de termos sem substituição.
C5 (proposta de intervenção) — conte os elementos VÁLIDOS da proposta mais completa: ação, agente, modo/meio, efeito, detalhamento.
 0: sem proposta, proposta copiada, desrespeito aos direitos humanos (tortura, violência, linchamento, justiça com as próprias mãos, supressão de direitos) ou proposta sem relação com o assunto | 40: tangência OU só elementos nulos OU 1 elemento válido | 80: 2 válidos | 120: 3 | 160: 4 | 200: 5. Estrutura condicional ("se..., então...") com 2+ elementos fica no máximo em 80.
 Elementos nulos: ação vaga ("medidas são necessárias"); agente impreciso ("alguém", "ninguém", "alguns", "você", imperativo sem vocativo). "Nós", "todos" e "as pessoas" valem como agente. Constatação de falta ("falta X") não é proposta. Pena de morte ou prisão perpétua atribuídas ao Estado NÃO são desrespeito aos direitos humanos. Só conte agente textualmente marcado.
Situações de nota zero geral: fuga total ao tema, não ser dissertativo-argumentativo, até 7 linhas, parte desconectada, cópia integral dos textos motivadores.`;

function hashStr(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function dailyQ(){if(!Q.length)return null;const pool=Q.filter(q=>q.a==="ciencias-natureza");return pool[hashStr(todayKey())%pool.length];}
function modQuestions(m){

/* ---------- Easier (IA) ---------- */
let samplePromise=null;
function serverSample(){
  const f=async(input,opts={})=>{
    let r;
    const hdr={"content-type":"application/json"};
    try{const ses=sb?(await sb.auth.getSession()).data.session:null;if(ses)hdr.authorization="Bearer "+ses.access_token;}catch(e){}
    try{r=await fetch("/api/easier",{method:"POST",headers:hdr,body:JSON.stringify({prompt:input,kb:opts.kb||undefined,tipo:opts.tipo||undefined}),signal:opts.signal});}
    catch(e){throw {code:"network",message:String(e)};}
    const hu=r.headers.get("X-Easier-Usos"),hr=r.headers.get("X-Easier-Redacoes");
    if(ACC&&hu){ACC.uso={usos:+hu.split("/")[0],redacoes:+(hr||"0/0").split("/")[0]};}
    if(!r.ok){let code="server",detail="";try{const j=await r.json();code=j.code||code;if(ACC&&j.code==="limit_reached"){ACC.uso={usos:j.usos,redacoes:j.redacoes};}detail=[j.status&&("HTTP "+j.status),j.detail].filter(Boolean).join(" · ");}catch(e){detail="HTTP "+r.status+" em /api/easier";}if(r.status===429&&code!=="rate_limited"&&!detail)code="rate_limited";throw {code,detail};}
    const reader=r.body.getReader(),dec=new TextDecoder();let text="";
    while(true){const {done,value}=await reader.read();if(done)break;const delta=dec.decode(value,{stream:true});text+=delta;opts.onText&&opts.onText({text,delta});}
    return {text,truncated:false};
  };
  f.server=true;
  f.json=async(input,opts)=>{const {text}=await f(input,opts);const m=text.match(/\{[\s\S]*\}/);if(!m)throw {code:"bad_json"};return JSON.parse(m[0]);};
  return f;
}
function getSample(){
  if(!samplePromise){
    samplePromise=(window.claude&&window.claude.use)
      ? window.claude.use("sample").then(s=>s||serverSample()).catch(()=>serverSample())
      : Promise.resolve(serverSample());
  }
  return samplePromise;
}

const errCopy=c=>({not_granted:"Você não autorizou a Easier nesta página. Recarregue e permita para usar este recurso.",rate_limited:"A Easier está com muita demanda agora. Espere um minutinho e tente de novo.",no_key:"A Easier está em manutenção no momento. Tente de novo mais tarde.",limit_reached:"Você usou todos os usos da Easier do seu plano neste mês. Eles renovam no dia 1º, ou você pode mudar para o Easy Pro na aba Planos. A correção automática de redação continua liberada.",login_required:"Entre na sua conta para usar a Easier.",no_plan:"Seu plano não está ativo. Assine um plano na aba Planos para usar a Easier."}[c]||"A Easier está com muita demanda agora. Tente de novo em instantes.");
function mdBlock(t){
  const lines=esc(t).split("\n"); let out="",inList=false;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|\s)\*(?!\s)(.+?)\*/g,"$1<em>$2</em>");
  for(const raw of lines){const l=raw.trim();
    if(/^[-*•]\s+/.test(l)||/^\d+[.)]\s+/.test(l)){if(!inList){out+="<ul>";inList=true;}out+="<li>"+inline(l.replace(/^([-*•]|\d+[.)])\s+/,""))+"</li>";continue;}
    if(inList){out+="</ul>";inList=false;}
    if(!l)continue;
    if(/^#{1,4}\s/.test(l)){out+="<h3>"+inline(l.replace(/^#+\s*/,""))+"</h3>";continue;}
    out+="<p>"+inline(l)+"</p>";
  }
  if(inList)out+="</ul>"; return out;
}

function getVideos(id){
  const c=VCACHE[id];if(c&&c.videos?.length&&Date.now()-c.t<14*864e5)return Promise.resolve(c);
  if(VPEND[id])return VPEND[id];
  const m=MODMAP[id];if(!m)return Promise.resolve(null);const vq=vQuery(m);

function prepararThumbs(){
  if(vObs)vObs.disconnect();const fila=[];let ativos=0;
  const roda=()=>{while(ativos<2&&fila.length){const el=fila.shift();const id=el.dataset.thumb;ativos++;getVideos(id).then(c=>{ativos--;const v=c?.videos?.[0];

  const els=[...document.querySelectorAll("[data-thumb]")];
  els.forEach(el=>{const v=VCACHE[el.dataset.thumb]?.videos?.[0];if(v){el.classList.add("has-img");el.style.backgroundImage=`url(${ytThumb(v)})`;}});
  if(!("IntersectionObserver" in window))return;
  vObs=new IntersectionObserver(en=>{en.forEach(x=>{if(x.isIntersecting){vObs.unobserve(x.target);if(!VCACHE[x.target.dataset.thumb]){fila.push(x.target);roda();}}});},{rootMargin:"200px"});
  els.forEach(el=>vObs.observe(el));
}

const ACTIONS=/\b(deve|devem|deverá|deverão|cabe a|cabe ao|cabe à|é preciso|é necessário|faz-se necessário|é fundamental|é imprescindível|precisa|precisam|é dever)\b/i;
const MEANS=/\b(por meio de|por meio da|por meio do|mediante|através de|através da|através do|por intermédio|com o auxílio|com o apoio|via|a partir de)\b/i;

const DETAIL=/\b(ou seja|isto é|por exemplo|a exemplo de|tais como|como|os quais|as quais|que contem|que contenham|com o uso de|com a participação)\b/i;
