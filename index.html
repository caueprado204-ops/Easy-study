const NULL_AGENT=/\b(alguém|ninguém|alguns|uns e outros|você|vocês)\b/i;
const CONDITIONAL=/(^|[.;,:]\s*)(se|caso)\s+(o|a|os|as|houver|existir|for|forem|não|todos|cada|nós|governo|sociedade|escolas?|famílias?|mídia)\b/i;
const INFORMAL=/\b(pra|pro|pros|tá|tô|né|vc|vcs|tb|tbm|tipo assim|a gente|aí|daí|beleza|galera|coisa)\b/gi;

function analyzeEssay(text,theme){
  const items=[];const add=(group,status,title,msg)=>items.push({group,status,title,msg});
  const paras=text.split(/\n+/).map(p=>p.trim()).filter(p=>p.length>0);
  const words=(text.match(/[A-Za-zÀ-ÿ]+(?:-[A-Za-zÀ-ÿ]+)*/g)||[]);
  const sentences=text.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  const lines=lineEstimate(text);
  const low=text.toLowerCase();

  // Estrutura
  if(lines<=7)add("Estrutura","bad","Texto muito curto",`Cerca de ${lines} linhas. No ENEM, redações com até 7 linhas recebem nota zero.`);
  else if(lines>30)add("Estrutura","bad","Passou do limite",`Cerca de ${lines} linhas. O limite da folha oficial é 30 linhas.`);
  else if(lines<20)add("Estrutura","warn","Texto curto",`Cerca de ${lines} linhas. Textos entre 25 e 30 linhas costumam desenvolver melhor os argumentos.`);
  else add("Estrutura","ok","Tamanho adequado",`Cerca de ${lines} linhas e ${words.length} palavras.`);
  if(paras.length<3)add("Estrutura","bad","Poucos parágrafos",`${paras.length} parágrafo(s). Use introdução, dois de desenvolvimento e conclusão.`);
  else if(paras.length===3)add("Estrutura","warn","Só 3 parágrafos","O modelo mais seguro tem 4: introdução, dois desenvolvimentos e conclusão.");
  else if(paras.length>6)add("Estrutura","warn","Muitos parágrafos",`${paras.length} parágrafos. Parágrafos curtos demais costumam ter argumentação rasa.`);
  else add("Estrutura","ok","Parágrafos bem divididos",`${paras.length} parágrafos.`);
  const longS=sentences.filter(s=>s.split(/\s+/).length>55);
  if(longS.length)add("Estrutura","warn","Frases muito longas",`${longS.length} frase(s) com mais de 55 palavras. Divida para ganhar clareza. Começo: “${longS[0].slice(0,70)}…”`);

  // C1
  const inf=[...new Set((low.match(INFORMAL)||[]))];
  if(inf.length)add("C1 · Norma-padrão","bad","Marcas de informalidade",`Evite: ${inf.slice(0,6).join(", ")}.`);
  if(/\b(eu|meu|minha|acho que)\b/i.test(text))add("C1 · Norma-padrão","warn","Primeira pessoa do singular","Prefira a impessoalidade (\"percebe-se\", \"é necessário\") ao \"eu acho\".");
  if(/\betc\b/i.test(text))add("C1 · Norma-padrão","warn","Uso de \"etc.\"","Na dissertação, enumere os exemplos que importam em vez de usar \"etc.\".");
  if(/[.!?]\s+[a-zà-ÿ]/.test(text))add("C1 · Norma-padrão","warn","Letra minúscula após ponto","Comece cada frase com letra maiúscula.");
  if(/\s+[,.;:!?]/.test(text))add("C1 · Norma-padrão","warn","Espaço antes da pontuação","Tire o espaço antes de vírgulas e pontos.");
  if(/\?/.test(text))add("C1 · Norma-padrão","warn","Pergunta retórica","Perguntas no texto dissertativo enfraquecem a argumentação. Prefira afirmar.");
  if(!items.some(i=>i.group.startsWith("C1")))add("C1 · Norma-padrão","ok","Sem marcas de informalidade","Veja abaixo a revisão de ortografia e gramática.");

  // C2
  const themeWords=[...new Set(((theme||"").toLowerCase().replace(/\(.*?\)/g,"").match(/[a-zà-ÿ]{5,}/g)||[]).filter(w=>!STOP.has(w)))];
  if(themeWords.length){
    const found=themeWords.filter(w=>low.includes(w.slice(0,Math.max(5,w.length-2))));
    const pct=found.length/themeWords.length;
    if(pct<0.4)add("C2 · Tema e repertório","bad","Pouca relação com o tema",`Palavras-chave do tema quase não aparecem: ${themeWords.filter(w=>!found.includes(w)).slice(0,5).join(", ")}. Cuidado com a fuga ao tema.`);
    else if(pct<0.7)add("C2 · Tema e repertório","warn","Tema parcialmente retomado",`Retome também: ${themeWords.filter(w=>!found.includes(w)).slice(0,5).join(", ")}.`);
    else add("C2 · Tema e repertório","ok","Tema bem retomado","As palavras-chave do tema aparecem no texto.");
  }
  const rep=[...new Set((text.match(REPERTOIRE)||[]).map(x=>x.toLowerCase()))];
  const years=(text.match(/\b(1[5-9]\d\d|20[0-3]\d)\b/g)||[]).length;
  const nRep=rep.length+(years?1:0);
  if(nRep===0)add("C2 · Tema e repertório","bad","Sem repertório identificado","Use pelo menos dois repertórios legitimados: lei, dado de órgão oficial, pensador, obra ou fato histórico.");
  else if(nRep===1)add("C2 · Tema e repertório","warn","Só um repertório",`Encontrado: ${rep[0]||"uma data histórica"}. O ideal é um repertório produtivo em cada parágrafo de desenvolvimento.`);
  else add("C2 · Tema e repertório","ok","Repertório presente",`Encontrados: ${rep.slice(0,5).join(", ")}${years?(rep.length?", ":"")+"datas históricas":""}. Lembre-se de explicar como cada um prova seu argumento.`);

  // C3
  const dev=paras.slice(1,-1);
  if(dev.length){
    const thin=dev.filter(p=>p.split(/\s+/).length<60);
    if(thin.length)add("C3 · Argumentação","warn","Desenvolvimento curto",`${thin.length} parágrafo(s) de desenvolvimento com menos de 60 palavras. Inclua fundamentação, análise e fechamento.`);
    else add("C3 · Argumentação","ok","Desenvolvimento encorpado","Os parágrafos de desenvolvimento têm tamanho para argumentar bem.");
  }
  if(paras[0]&&!/\b(dev|necessári|precis|problema|desafio|impasse|entrave|obstácul|causa|devido|em razão|por causa|fator|consequência)/i.test(paras[0]))
    add("C3 · Argumentação","warn","Tese pouco clara na introdução","Deixe explícito na introdução qual é o problema e quais causas você vai discutir.");

  // C4 (grade oficial: operadores entre parágrafos, coesivo em todo parágrafo, repetição, monobloco)
  const conn={};for(const [k,re] of Object.entries(CONNECTIVES)){const m=low.match(re);if(m)conn[k]=[...new Set(m)];}
  const distinct=Object.values(conn).flat().length;
  if(paras.length===1)add("C4 · Coesão","bad","Texto em monobloco","Sem divisão em parágrafos, a C4 fica no máximo em 80 pontos. Separe introdução, desenvolvimentos e conclusão.");
  if(distinct<3)add("C4 · Coesão","bad","Poucos conectivos",`Só ${distinct} conectivo(s) diferentes. Use \"além disso\", \"no entanto\", \"portanto\", \"dessa forma\".`);
  else if(distinct<6)add("C4 · Coesão","warn","Conectivos pouco variados",`${distinct} conectivos diferentes (${Object.values(conn).flat().slice(0,5).join(", ")}). Varie mais entre os parágrafos.`);
  else add("C4 · Coesão","ok","Boa variedade de conectivos",`${distinct} conectivos diferentes, de ${Object.keys(conn).length} tipos.`);
  if(paras.length>1){
    const inter=paras.slice(1).filter(p=>OPENERS.test(p.toLowerCase())).length;
    if(inter>=2)add("C4 · Coesão","ok",`Operadores entre parágrafos: ${inter}`,"Atende ao requisito do nível 200: pelo menos 2 parágrafos ligados ao anterior por operador argumentativo.");
    else if(inter===1)add("C4 · Coesão","warn","Só 1 operador entre parágrafos","Pela grade oficial, isso permite chegar a 160. Para 200, ligue pelo menos 2 parágrafos ao anterior (ex.: \"Além disso\", \"Portanto\").");
    else add("C4 · Coesão","bad","Nenhum operador entre parágrafos","Sem ligar nenhum parágrafo ao anterior com operador argumentativo, a C4 fica no máximo em 120.");
    const semCoesivo=paras.map((p,i)=>({i:i+1,ok:Object.values(CONNECTIVES).some(re=>{re.lastIndex=0;return re.test(p.toLowerCase());})||/\b(isso|esse|essa|esses|essas|tal|tais|o qual|a qual|os quais|as quais|cujo|cuja|que)\b/i.test(p)})).filter(x=>!x.ok);
    if(semCoesivo.length)add("C4 · Coesão","warn","Parágrafo sem elemento coesivo",`Parágrafo(s) ${semCoesivo.map(x=>x.i).join(", ")}. O nível 200 exige ao menos um coesivo dentro de cada parágrafo.`);
  }
  const opCount={};(low.match(/\b(porém|contudo|todavia|entretanto|no entanto|além disso|ademais|portanto|dessa forma|desse modo|assim|logo)\b/g)||[]).forEach(w=>opCount[w]=(opCount[w]||0)+1);
  const opRep=Object.entries(opCount).filter(([w,n])=>n>=3);
  if(opRep.length)add("C4 · Coesão","warn","Mesmo conectivo repetido",opRep.map(([w,n])=>`\"${w}\" (${n}x)`).join(", ")+". Repetir o operador repete sempre a mesma relação de sentido.");
  if(/\bonde\b/i.test(text))add("C4 · Coesão","warn","Confira o uso de \"onde\"","\"Onde\" só deve indicar lugar físico. Para situações ou épocas, use \"em que\", \"no qual\" ou \"quando\". O uso errado conta como inadequação coesiva.");
  const freq={};(low.match(/[a-zà-ÿ]{5,}/g)||[]).forEach(w=>{if(!STOP.has(w))freq[w]=(freq[w]||0)+1;});
  const rep4=Object.entries(freq).filter(([w,n])=>n>=4&&!themeWords.some(t=>w.startsWith(t.slice(0,5)))).sort((a,b)=>b[1]-a[1]).slice(0,4);
  if(rep4.length)add("C4 · Coesão","warn","Palavras repetidas",rep4.map(([w,n])=>`\"${w}\" (${n}x)`).join(", ")+". Use sinônimos, pronomes ou hiperônimos.");

  // C5 (grade oficial: cada elemento válido vale um nível)
  const countEl=p=>[ACTIONS,AGENTS,MEANS,PURPOSE,DETAIL].filter(re=>re.test(p)).length;
  let last=paras[paras.length-1]||"";
  paras.forEach(p=>{if(countEl(p)>countEl(last))last=p;});
  const el=[["Ação",ACTIONS],["Agente",AGENTS],["Modo/meio",MEANS],["Efeito",PURPOSE],["Detalhamento",DETAIL]].map(([n,re])=>[n,re.test(last)]);
  let nEl=el.filter(x=>x[1]).length;
  const listEl=el.map(([n,ok])=>`${ok?"✓":"✗"} ${n}`).join("  ");
  const isCond=CONDITIONAL.test(last);
  const nota5=isCond&&nEl>=2?80:[0,40,80,120,160,200][nEl];
  if(paras.length<2)add("C5 · Intervenção","bad","Sem conclusão separada","Escreva um parágrafo de conclusão com a proposta de intervenção.");
  else if(nEl===0)add("C5 · Intervenção","bad","Proposta não identificada","Não encontramos proposta de intervenção. Sem proposta, a C5 é zero. Diga o que deve ser feito, por quem, como, para quê e detalhe.");
  else{
    const st=nEl>=4?"ok":nEl>=2?"warn":"bad";
    add("C5 · Intervenção",st,`Proposta com ${nEl} de 5 elementos (cerca de ${nota5} pontos)`,listEl+(nEl<5?". Pela grade oficial, cada elemento válido sobe um nível.":"."));
  }
  if(NULL_AGENT.test(last))add("C5 · Intervenção","warn","Agente possivelmente nulo","\"Alguém\", \"alguns\" ou \"você\" não contam como agente. Nomeie quem age: governo, escolas, mídia, famílias, sociedade, \"nós\".");
  if(isCond)add("C5 · Intervenção","warn","Proposta em forma condicional","Propostas do tipo \"se o governo fizer X...\" ficam no máximo em 80 pontos na C5. Afirme a ação: \"o governo deve fazer X\".");
  if(/\b(segundo|conforme|de acordo com)\b[^.]{0,120}\bdeve\b/i.test(last))add("C5 · Intervenção","warn","Citação com \"deve\"","Se o \"deve\" está dentro de uma citação de lei ou autor, ele não conta como proposta sua. Escreva a sua própria proposta.");
  if(/\bfalta(m)?\b/i.test(last)&&!ACTIONS.test(last))add("C5 · Intervenção","warn","Constatação de falta","Dizer o que falta não é proposta. Aponte a solução: \"é necessário garantir...\", \"o Ministério deve criar...\".");
  if(VIOLENT.test(low))add("C5 · Intervenção","bad","Possível desrespeito aos direitos humanos","Propostas com violência, tortura ou justiça com as próprias mãos levam nota 0 na C5. Prefira educação, políticas públicas e fiscalização.");

  // C1: desvios frequentes nos manuais
  const c1=[[/\bafim de\b/i,"\"afim de\" → \"a fim de\" (finalidade)"],[/\ba nível de\b/i,"\"a nível de\" → \"em nível de\" ou reformule"],[/\bhaviam\b/i,"\"haviam\" no sentido de existir → \"havia\""],[/\bfazem\s+\w+\s+anos\b/i,"\"fazem X anos\" → \"faz X anos\""],[/(^|\s)à\s+(partir|ser|fazer|ter|receber|dar|trabalhar|estudar)\b/i,"crase antes de verbo ou em \"a partir\" → sem crase"],[/\ba medida que\b/i,"\"a medida que\" → \"à medida que\""],[/\bmenas\b/i,"\"menas\" → \"menos\""],[/(^|[\s,])(é|faz-se|torna-se)\s+necessário\s+(uma|a|esta|essa|alguma)\b/i,"\"é necessário uma/a...\" → \"é necessária uma/a...\""],[/\bsão\s+necessári[ao]s\s+\w+(ar|er|ir)\b/i,"\"são necessárias fazer\" → \"é necessário fazer\""],[/[.!?]\s+Pois\b/,"frase começando com \"Pois\" depois de ponto é truncamento: use vírgula"],[/(^|[.!?]\s+)(Me|Te|Se|Nos|Vos|Lhe|Lhes)\s+[a-zà-ÿ]+/m,"frase começando com pronome oblíquo (ex.: \"Nos perguntamos\")"],[/(^|\s)(p\/|c\/|q\/|vc|blz|tbm)(\s|[.,;])/i,"abreviações informais (p/, c/, vc)"],[/\bpor que\b[^?]*$/im,""],[/\b(mais|mas)\s+(também|sim)\b/i,"confira \"mas\" (oposição) x \"mais\" (quantidade)"]].filter(([re,m])=>m&&re.test(text)).map(x=>x[1]);
  if(c1.length)add("C1 · Norma-padrão","warn","Desvios comuns encontrados",c1.join("; ")+".");
  const shortParas=paras.filter((p,i)=>i>0&&p.split(/\s+/).length<25).length;
  if(shortParas>=2)add("C2 · Tema e repertório","bad","Partes embrionárias",`${shortParas} parágrafos muito curtos. Pela grade, duas partes embrionárias limitam a C2 a 80 pontos.`);
  else if(shortParas===1)add("C2 · Tema e repertório","warn","Uma parte embrionária","Um parágrafo está muito curto. Uma parte embrionária limita a C2 a 120.");

  return {items,ok:items.filter(i=>i.status==="ok").length,warn:items.filter(i=>i.status!=="ok").length,at:Date.now()};
}

async function checkGrammar(text){
  grammar={status:"loading"};paintAuto();
  try{
    const r=await fetch("https://api.languagetool.org/v2/check",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({text:text.slice(0,19000),language:"pt-BR"})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    grammar={status:"ok",matches:(j.matches||[]).slice(0,25),total:(j.matches||[]).length};
  }catch(e){console.warn("[LanguageTool]",e);grammar={status:"err"};}
  paintAuto();
}
function runAuto(){
  const text=(S.essayDraft||"").trim(),theme=S.essayTheme==="__custom"?"":S.essayTheme;
  if(text.split(/\s+/).length<40){toast("Escreva pelo menos umas 40 palavras para a correção automática.");return false;}
  autoResult=analyzeEssay(text,theme);grammar=null;
  if(VIEW==="redacao")render();
  checkGrammar(text);
  return true;
}
function paintAuto(){const el=document.getElementById("autoBox");if(el)el.outerHTML=autoHTML();}
function autoHTML(){
  if(!autoResult)return `<div id="autoBox"></div>`;
  const r=autoResult;const groups=[...new Set(r.items.map(i=>i.group))];
  let g="";
  if(!grammar||grammar.status==="loading")g=`<p class="small muted" style="margin:0">Revisando ortografia e gramática…</p>`;
  else if(grammar.status==="err")g=`<p class="small muted" style="margin:0">A revisão de ortografia está indisponível agora. Tente de novo em instantes.</p>`;
  else if(!grammar.total)g=`<p class="small" style="margin:0">Nenhum erro de ortografia ou gramática encontrado.</p>`;
  else g=`<p class="small" style="margin:0 0 8px">${grammar.total} ponto(s) encontrado(s)${grammar.total>grammar.matches.length?`, mostrando os ${grammar.matches.length} primeiros`:""}:</p>
    <div class="gram">${grammar.matches.map(m=>{const c=m.context||{text:"",offset:0,length:0};const sug=(m.replacements||[]).slice(0,3).map(x=>x.value).filter(Boolean);
      return `<div class="gm"><div class="small">${esc(c.text.slice(0,c.offset))}<mark>${esc(c.text.substr(c.offset,c.length))}</mark>${esc(c.text.slice(c.offset+c.length))}</div><div class="small muted">${esc(m.message)}${sug.length?` <b style="color:var(--ok)">Sugestão: ${esc(sug.join(" / "))}</b>`:""}</div></div>`}).join("")}</div>`;
  return `<div id="autoBox" class="card auto" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><h3 style="font-size:17px;margin-right:auto">Correção automática</h3><span class="chip" style="background:var(--lime)">grátis · sem IA</span></div>
    <p class="small muted" style="margin:0 0 10px">${r.ok} ponto(s) fortes e ${r.warn} para melhorar. É uma análise por regras: aponta problemas comuns, mas não dá nota oficial.</p>
    ${groups.map(gr=>`<div class="ag"><div class="ag-h">${esc(gr)}</div>${r.items.filter(i=>i.group===gr).map(i=>`<div class="ai"><span class="st st-${i.status}" aria-label="${i.status==="ok"?"ok":i.status==="warn"?"atenção":"problema"}"></span><div><b class="small">${esc(i.title)}</b><div class="small muted">${esc(i.msg)}</div></div></div>`).join("")}</div>`).join("")}
    <div class="ag"><div class="ag-h">Ortografia e gramática</div>${g}
      <p class="note" style="margin:8px 0 0">Revisão feita por <a href="https://languagetool.org" target="_blank" rel="noopener">LanguageTool</a>. Seu texto é enviado ao serviço só para essa checagem (<a href="https://languagetool.org/legal/privacy" target="_blank" rel="noopener">política de privacidade</a>).</p></div>
  </div>`;
}

async function correctEssay(){
  const text=(S.essayDraft||"").trim(),theme=S.essayTheme==="__custom"?"":S.essayTheme;
  if(text.split(/\s+/).length<80){toast("Escreva pelo menos umas 80 palavras para corrigir.");return;}
  if(!theme){toast("Escolha ou escreva um tema.");return;}
  const sample=await getSample();
  essayBusy=true;essayResult=null;render();
  const prompt=`Seu nome é Easier, a corretora de IA da plataforma Easy Study. Corrija a redação abaixo exatamente como um corretor oficial do ENEM, aplicando as grades a seguir com rigor. Para cada competência, identifique o nível (0 a 5) pelos descritores, aplique as regras de limite e cite trechos curtos do texto que justificam a nota. Comentários em português do Brasil, objetivos e úteis para o aluno melhorar.

${sample&&sample.server?"Use a BASE DE CRITÉRIOS da redação que você recebeu.":RUBRICA}

Tema: ${theme}

Redação:
"""
${text}
"""

Responda SOMENTE com JSON neste formato:
{"competencias":[{"nota":0,"nivel":"descritor do nível aplicado","comentario":"justificativa com trechos do texto"},{"nota":0,"nivel":"","comentario":""},{"nota":0,"nivel":"","comentario":""},{"nota":0,"nivel":"","comentario":""},{"nota":0,"nivel":"","comentario":""}],"elementos_c5":{"acao":"","agente":"","modo_meio":"","efeito":"","detalhamento":""},"total":0,"resumo":"uma frase de avaliação geral","melhorias":["3 a 5 ações concretas para subir a nota, citando a competência"]}
As notas de cada competência são 0, 40, 80, 120, 160 ou 200. Em elementos_c5, copie o trecho de cada elemento válido ou deixe vazio se ele não existir ou for nulo.`;
  let failed=false;
  try{if(!sample)throw {code:"server"};const r=await sample.json(prompt,{modelTier:"default",kb:"redacao",tipo:"redacao"});r.competencias=(r.competencias||[]).slice(0,5).map(c=>({nota:Math.max(0,Math.min(200,Math.round((+c.nota||0)/40)*40)),nivel:String(c.nivel||""),comentario:String(c.comentario||"")}));r.total=r.competencias.reduce((a,c)=>a+c.nota,0);essayResult=r;S.essays.push({theme,total:r.total,date:Date.now()});addXP(40);save();}
  catch(e){essayResult={error:errMsg(e)};failed=true;}
  essayBusy=false;
  // se a IA falhar, a correção automática entra no lugar
  if(failed&&!autoResult){autoResult=analyzeEssay(text,theme);grammar=null;if(VIEW==="redacao")render();checkGrammar(text);return;}
  if(VIEW==="redacao")render();
}

function pesosDoCurso(c){
  c=(c||"").toLowerCase();
  if(/medicina|odonto|enferm|fisio|farm|biomed|nutri|veterin/.test(c))return [["Biologia",5],["Química",4],["Matemática",3],["Física",3],["Linguagens",2],["História",1],["Geografia",1],["Filosofia e Sociologia",1]];
  if(/engenh|computa|sistemas|física|matem|arquitet/.test(c))return [["Matemática",5],["Física",4],["Química",3],["Linguagens",2],["Biologia",1],["História",1],["Geografia",1],["Filosofia e Sociologia",1]];
  if(/direito|psico|letras|jornal|relações|história|pedagog|ciências sociais|publicid|administra|econom/.test(c))return [["Linguagens",4],["História",3],["Filosofia e Sociologia",3],["Geografia",2],["Matemática",3],["Biologia",1],["Química",1],["Física",1]];
  return [["Matemática",3],["Linguagens",3],["Biologia",2],["Química",2],["Física",2],["História",2],["Geografia",2],["Filosofia e Sociologia",1]];

function genRoutine(start,hours,sat,sun,block){
  const weights=pesosDoCurso(ACC?.perfil?.curso_foco||"");
  const bag=[];weights.forEach(([s,w])=>{for(let i=0;i<w;i++)bag.push(s);});
  const out=[];let p=0;const [hh,mm]=start.split(":").map(Number);const perDay=[hours,hours,hours,hours,hours,sat,sun];
  perDay.forEach((h,d)=>{const n=Math.floor(h*60/block);let t=(d>=5?9*60:hh*60+mm);
    for(let i=0;i<n;i++){let s;if((d===2||d===5)&&i===n-1)s="Redação";else{s=bag[p%bag.length];p+=3;if(out.length&&out[out.length-1].s===s&&out[out.length-1].d===d){s=bag[p%bag.length];p++;}}
      out.push({id:Math.random().toString(36).slice(2,9),d,h:pad(Math.floor(t/60)%24)+":"+pad(t%60),dur:block,s,note:s==="Redação"?"Escrever 1 redação completa":i===n-1&&n>2?"Questões e revisão":"Próximo módulo"});t+=block+10;}});
  return out;}

function fcCloze(t){if(/[=→×÷]/.test(t))return null;const ws=t.split(/\s+/);if(ws.length<5)return null;let best=-1,bl=0;
  ws.forEach((w,i)=>{const c=w.replace(/[^\p{L}\p{N}₀-₉⁺⁻²³]/gu,"");if(c.length>=6&&!FC_STOP.has(c.toLowerCase())&&c.length>bl){bl=c.length;best=i;}});
  if(best<0)return null;const w=ws[best];ws[best]=w.replace(/[\p{L}\p{N}₀-₉⁺⁻²³]+/u,"_____");return ws.join(" ");}

  if(d.enter!==undefined){enterApp();return;}
  if(d.enterSignup!==undefined){if(ACC){abrirApp();go("planos");}else showAuth("cadastro");return;}
  if(d.authReset!==undefined){sb.auth.resetPasswordForEmail(ACC.user.email,{redirectTo:location.origin}).then(()=>toast("Enviamos o link para trocar a senha no seu e-mail."));return;}
  if(d.landing!==undefined){showLanding(true);try{history.replaceState(null,"","#inicio");}catch(e){}return;}
  if(d.go){e.preventDefault();go(d.go);return;}
  if(d.area){areaFilter=d.area;render();return;}
  if(d.vclose!==undefined){fecharVideo();if(d.mod)openModule(d.mod);return;}
  if(d.vpick!==undefined){vState.i=+d.vpick;paintVideo();return;}
  if(d.play){e.preventDefault();abrirVideo(d.play);return;}
  if(d.mod){openModule(d.mod);return;}
  if(d.modhome!==undefined){modState={...modState,s:null,id:null,search:""};render();return;}
  if(d.subjopen){modState={...modState,s:d.subjopen,id:null,search:""};go("modulos");return;}
  if(d.sec!==undefined){modState.sec=+d.sec;markRead();render();document.querySelector(".reader")?.scrollIntoView({block:"start"});return;}
  if(d.mq!==undefined){modState.qi=+d.mq;render();return;}
  if(d.moddone){S.modDone[d.moddone]=1;addXP(30);render();toast("Módulo concluído! +30 XP");return;}
  if(d.ailesson){genLesson(d.ailesson);return;}
  if(d.subject){qf={s:d.subject,y:"Todos",pend:false};rebuildQ();go("questoes");return;}
  if(d.openq){qf={s:"Todas",y:"Todos",pend:false};rebuildQ(d.openq);go("questoes");return;}
  if(d.aula){aulaFilter=d.aula;render();return;}
  if(d.watch){S.watched[d.watch]=1;addXP(10);render();if(vState.id)paintVideo();toast("+10 XP");return;}
  if(d.clearsearch!==undefined){modState.search="";document.getElementById("searchInput").value="";render();return;}
  if(d.ans!==undefined){const q=QMAP[d.qid],i=+d.ans;
    if(d.mode==="train"){if(S.ans[q.id]!==undefined)return;S.ans[q.id]=i;addXP(i===q.k?10:5,"q");render();}
    else if(d.mode==="sim"){S.sim.ans[q.id]=i;save();render();}return;}
  if(d.qmove){qIdx=Math.max(0,Math.min(qList.length-1,qIdx+(+d.qmove)));render();return;}
  if(d.qrand!==undefined){qIdx=Math.floor(Math.random()*qList.length);render();return;}
  if(d.explain){explainQ(d.explain);return;}
  if(d.startsim){const s=SIMS.find(x=>x.id===d.startsim);startSim(s.name,shuffle(Q.filter(s.f)).slice(0,s.n).map(q=>q.id),s.min);return;}
  if(d.startyear!==undefined){const y=+document.getElementById("yearSel").value,a=document.getElementById("yearArea").value;const ids=Q.filter(q=>q.y===y&&(!a||q.a===a)).sort((p,q)=>p.n-q.n).map(q=>q.id);if(!ids.length){toast("Sem questões em texto para essa combinação.");return;}startSim("ENEM "+y+(a?" · "+document.getElementById("yearArea").selectedOptions[0].text:""),ids,ids.length*3);return;}
  if(d.simgo!==undefined){S.sim.cur=Math.max(0,Math.min(S.sim.ids.length-1,+d.simgo));save();render();return;}
  if(d.finishsim!==undefined){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirmar entrega?";setTimeout(()=>{t.dataset.confirm="";t.textContent="Entregar";},3000);return;}finishSim();return;}
  if(d.closesim!==undefined){S.sim=null;simView=null;save();render();return;}
  if(d.correct!==undefined){correctEssay();return;}
  if(d.autocheck!==undefined){if(runAuto())toast("Correção automática pronta");return;}
  if(d.delblk){S.routine=S.routine.filter(b=>b.id!==d.delblk);save();render();return;}
  if(d.clearroutine!==undefined){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirmar?";setTimeout(()=>{t.dataset.confirm="";t.textContent="Limpar semana";},3000);return;}S.routine=[];save();render();return;}
  if(d.addexam!==undefined){S.exams.push({n:"Nova prova",d:""});save();render();return;}
  if(d.pmode){const [f,b]=d.pmode.split("-").map(Number);pomo={...pomo,mode:f,brk:b,phase:"focus",left:f*60,running:false};render();return;}
  if(d.ptoggle!==undefined){if(pomo.running){pomo.left=Math.max(0,Math.round((pomo.endAt-Date.now())/1000));pomo.running=false;}else{pomo.endAt=Date.now()+pomo.left*1000;pomo.running=true;}t.textContent=pomo.running?"Pausar":"Iniciar";return;}
  if(d.preset!==undefined){pomo.running=false;pomo.phase="focus";pomo.left=pomo.mode*60;render();return;}
});

async function explainQ(id){
  const q=QMAP[id],box=document.getElementById("exp-"+id);if(!box)return;const sample=await getSample();
  if(!sample){box.innerHTML=`<div class="explain">A Easier está indisponível agora. Tente de novo em instantes.</div>`;return;}
  box.innerHTML=`<div class="explain" id="expT-${id}">Pensando…</div>`;const chosen=S.ans[id]??S.sim?.ans?.[id];
  const prompt=`Seu nome é Easier, a tutora de IA da plataforma Easy Study, professora de cursinho pré-vestibular. ${cursoAluno()} Explique a resolução desta questão do ENEM ${q.y} de forma clara e curta (até 180 palavras), em português do Brasil, em texto simples sem markdown. Diga por que a alternativa correta está certa, por que a alternativa marcada pelo aluno está errada (se errou) e termine com uma dica de conteúdo para revisar.\n\nTexto-base: ${q.c}\nEnunciado: ${q.q}\nAlternativas:\n${q.o.map((o,i)=>"ABCDE"[i]+") "+o).join("\n")}\nGabarito: ${"ABCDE"[q.k]}\nAlternativa marcada pelo aluno: ${chosen===undefined?"nenhuma":"ABCDE"[chosen]}`;
  try{const {text}=await sample(prompt,{modelTier:"default",onText:({text})=>{const el=document.getElementById("expT-"+id);if(el)el.textContent=text;}});qExplain[id]=text;const el=document.getElementById("expT-"+id);if(el)el.textContent=text;}
  catch(err){const el=document.getElementById("expT-"+id);if(el)el.textContent=err&&err.text?err.text:errMsg(err);}
}

const traduzErro=m=>{m=String(m||"");
  if(/Invalid login/i.test(m))return "E-mail ou senha incorretos.";
  if(/Email not confirmed/i.test(m))return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if(/already registered|already been registered/i.test(m))return "Esse e-mail já tem conta. Entre ou recupere a senha.";
  if(/Password should|weak/i.test(m))return "Senha fraca. Use pelo menos 8 caracteres, misturando letras e números.";
  if(/rate limit|too many/i.test(m))return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  return "Não foi possível concluir agora. Tente de novo em instantes.";};

  const atual=ACC?planoAtual():null;
  return `<div class="progs plan-cards">${Object.entries(PLANS).map(([k,p])=>`
    <div class="pg ${p.cls}">
      <div class="tags">${k==="pro"?"<span>Mais completo</span>":""}<span>${p.usos} usos/mês</span><span>${p.redacoes} redações/mês</span></div>
      <h3>${p.nome}</h3>
      <div class="price"><b class="num">${brl(p.preco)}</b>${p.preco?"<span>/mês</span>":""}</div>
      <p>${p.desc}</p>
      <ul>${p.itens.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
      ${ctaLanding?`<button class="l-cta" data-enter-signup>Assinar ${p.nome}</button>`
        :atual===k?`<span class="cur-plan">Seu plano atual</span>`:p.preco?`<button class="l-cta" data-assinar="${k}">Assinar ${p.nome}</button>`:""}
    </div>`).join("")}</div>`;
}
function vPlanos(){
  const k=planoAtual(),p=k?PLANS[k]:null,u=ACC?.uso||{usos:0,redacoes:0};
  const venc=ACC?.assinatura?.valido_ate&&ACC.assinatura.plano!=="nenhum"&&!k;
  return `<div class="row-head" style="margin-top:4px"><h1 class="h-sec">${k?"Planos":"Escolha seu plano"}</h1><span class="small muted">Os limites da Easier renovam todo dia 1º</span></div>
  ${k?`<div class="card usage-card">
    <div><span class="chip dark">${esc(p.nome)}</span>${ACC?.assinatura?.valido_ate?`<span class="small muted" style="margin-left:8px">válido até ${new Date(ACC.assinatura.valido_ate+"T12:00").toLocaleDateString("pt-BR")}</span>`:""}</div>
    ${usageBars(u,p)}</div>`
  :`<div class="card paywall"><b>${venc?"Seu plano venceu.":"Falta só um passo."}</b> <span class="small">${venc?"Renove para voltar a estudar com tudo que você já fez salvo na sua conta.":"Assine um plano para liberar módulos, questões, simulados, redação, rotina e a Easier. Seu progresso fica salvo na conta."}</span></div>`}
  ${planCardsHTML(false)}
  <div id="assinarBox"></div>
  <div class="card" style="margin-top:14px"><b>O que conta como uso da Easier</b>
    <ul class="small" style="padding-left:18px;margin:6px 0 0"><li>Explicar uma questão, tirar uma dúvida ou gerar uma aula completa: 1 uso.</li><li>Corrigir uma redação pelas 5 competências: 1 correção de redação.</li><li>Módulos, questões, simulados, rotina e a correção automática de redação não gastam nada.</li><li>Se a Easier falhar, o uso é devolvido.</li></ul></div>`;
}
function usageBars(u,p){
  const b=(n,m,l)=>`<div class="ub"><div class="small" style="display:flex;justify-content:space-between"><span>${l}</span><b class="num">${n}/${m}</b></div><div class="bar"><i style="width:${Math.min(100,n/m*100)}%;${n>=m?"background:var(--bad)":""}"></i></div></div>`;
  return `<div class="ubs">${b(u.usos||0,p.usos,"Usos da Easier este mês")}${b(u.redacoes||0,p.redacoes,"Correções de redação este mês")}</div>`;
}
function assinarHTML(k){
  const p=PLANS[k],box=document.getElementById("assinarBox");if(!box)return;
  const msg=encodeURIComponent(`Olá! Quero assinar o plano ${p.nome} (${brl(p.preco)}/mês) do Easy Study. Meu e-mail de cadastro: ${ACC?.user?.email||""}`);
  const temContato=CONTATO.whatsapp||CONTATO.email;
  box.innerHTML=`<div class="card" style="margin-top:14px;border-color:var(--violet)"><h3 style="font-size:17px;margin-bottom:6px">Assinar o plano ${esc(p.nome)}</h3>
    ${temContato?`<p class="small" style="margin:0 0 10px">Fale com a equipe, faça o pagamento por Pix e seu plano é liberado em até 24 horas na sua conta (${esc(ACC?.user?.email||"")}).</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${CONTATO.whatsapp?`<a class="btn" href="https://wa.me/${CONTATO.whatsapp}?text=${msg}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:""}${CONTATO.email?`<span class="chip" style="padding:6px 10px;user-select:all">${esc(CONTATO.email)}</span>`:""}</div>`
      :`<p class="small" style="margin:0">As assinaturas abrem em breve. Deixe sua conta criada que avisamos você.</p>`}</div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- aba Minha conta ---------- */
function vConta(){
  const pf=ACC?.perfil||{},k=planoAtual(),p=k?PLANS[k]:null;
  const vs=pf.vestibulares||[];
  return `<div class="row-head" style="margin-top:4px"><h1 class="h-sec">Minha conta</h1><button class="btn sm ghost" data-logout>Sair da conta</button></div>
  <div class="grid forms" style="margin-top:0">
    <form class="card form" id="perfilForm"><h3 style="font-size:17px">Perfil e metas</h3>
      <label>Nome<input class="inp" id="pNome" value="${esc(pf.nome||"")}" maxlength="80"></label>
      <div class="two"><label>Curso foco<select class="inp" id="pCurso">${CURSOS.map(c=>`<option ${c===pf.curso_foco?"selected":""}>${c}</option>`).join("")}</select></label>
      <label>Faculdade dos sonhos<input class="inp" id="pFacul" list="faculList2" value="${esc(pf.faculdade||"")}" maxlength="120"></label></div>
      <datalist id="faculList2">${FACULDADES.map(f=>`<option value="${f}">`).join("")}</datalist>
      <fieldset class="vests"><legend>Vestibulares</legend>${VESTS.map(v=>`<label class="chk"><input type="checkbox" value="${v}" ${vs.includes(v)?"checked":""}> ${v}</label>`).join("")}</fieldset>
      <label>Meta de estudo (horas por semana)<input class="inp" id="pHoras" type="number" min="1" max="100" value="${pf.meta_horas_semana||20}"></label>
      <label>Minha meta<textarea class="inp" id="pMeta" rows="2" maxlength="300">${esc(pf.meta_texto||"")}</textarea></label>
      <button class="btn" style="align-self:flex-start">Salvar perfil</button></form>
    <div class="card form"><h3 style="font-size:17px">Plano e consumo</h3>
      ${p?`<div><span class="chip dark">${esc(p.nome)}</span></div>${usageBars(ACC?.uso||{},p)}`:`<p class="small" style="margin:0">Nenhum plano ativo.</p>`}
      <button class="btn sm violet" data-go="planos" style="align-self:flex-start">${p?"Ver planos":"Assinar um plano"}</button>
      <h3 style="font-size:17px;margin-top:8px">Acesso</h3>
      <p class="small" style="margin:0">E-mail: <b>${esc(ACC?.user?.email||"")}</b></p>
      <p class="small muted" style="margin:0">Seu progresso é salvo na nuvem e aparece em qualquer aparelho em que você entrar.</p>
      <button class="btn sm ghost" data-auth-reset style="align-self:flex-start">Trocar senha</button>
    </div>
  </div>`;
}
function metaSemana(){
  const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));let min=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);min+=S.act[dkey(d)]?.min||0;}
  return {feito:Math.round(min/6)/10,meta:ACC?.perfil?.meta_horas_semana||20};
}
function contaStripHTML(){
  if(!ACC)return "";
  const k=planoAtual();if(!k)return "";const p=PLANS[k],u=ACC.uso||{},m=metaSemana(),pf=ACC.perfil||{};
  return `<div class="acc-strip">
    <div class="acc-who"><span class="avatar">${esc((pf.nome||"E").trim()[0]?.toUpperCase()||"E")}</span><div><b>${esc(pf.nome||"Estudante")}</b><div class="small muted">${esc(pf.curso_foco||"Curso dos sonhos")}${pf.faculdade?" · "+esc(pf.faculdade):""}</div></div></div>
    <div class="acc-stat"><span class="small muted">Plano</span><b>${esc(p.nome)}</b></div>
    <div class="acc-stat"><span class="small muted">Easier no mês</span><b class="num">${u.usos||0}/${p.usos}</b></div>
    <div class="acc-stat"><span class="small muted">Redações no mês</span><b class="num">${u.redacoes||0}/${p.redacoes}</b></div>
    <div class="acc-stat"><span class="small muted">Meta da semana</span><b class="num">${m.feito}/${m.meta} h</b></div>
    <div class="acc-btns"><button class="btn sm ghost" data-go="conta">Minha conta</button><button class="btn sm" data-logout>Sair da conta</button></div>
  </div>`;
}

/* ---------- início ---------- */
let iniciado=false;
async function aoMudarSessao(ev,session){
  if(ev==="PASSWORD_RECOVERY"){if(session&&(!ACC||ACC.user.id!==session.user.id))await carregarConta(session.user);showAuth("novasenha");return;}
  if(session&&(!ACC||ACC.user.id!==session.user.id)){
    await carregarConta(session.user);
    const h=(location.hash||"").slice(1);
    if(!document.getElementById("auth").hidden&&authMode==="novasenha")return;
    if(h==="inicio"&&ev==="INITIAL_SESSION")showLanding(true);else abrirApp();
    return;
  }
  if(!session&&ev==="INITIAL_SESSION")showLanding(true);
}
(function iniciar(){
  const h=(location.hash||"").slice(1);if(LABEL[h])VIEW=h;
  if(!sb){showLanding(true);return;}
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>aoMudarSessao(ev,session).catch(e=>console.warn("[contas]",e)),0);});
})();
</script>

</body>
</html>
