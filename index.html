<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Easy Study: plataforma de estudos para o curso dos seus sonhos, com foco em FUVEST, Unicamp, Unesp, ENEM e Provão Paulista. Módulos, questões do ENEM, simulados, redação corrigida pela Easier e rotina de estudos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%234E3DF2'/%3E%3Cg fill='%23DFF24B'%3E%3Crect x='17' y='6' width='6' height='28' rx='3'/%3E%3Crect x='17' y='6' width='6' height='28' rx='3' transform='rotate(60 20 20)'/%3E%3Crect x='17' y='6' width='6' height='28' rx='3' transform='rotate(120 20 20)'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Easy Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: landing em blocos chapados roxo/lima/rosa (ref. IT-Kids) → app com moldura escura, barra de ícones e painel creme (ref. Learnify). Tema único e claro, por escolha. */
:root{
  --sky-bg:#BCD3DB; --shell:#2B2927; --panel:#FCF8F1; --cream:#FDFAF2; --ink:#1C1B1A; --muted:#6B6660; --line:#1C1B1A; --hair:#E6DED1;
  --violet:#4E3DF2; --violet-2:#6455FF; --lime:#DFF24B; --pink:#FF44C9; --orange:#FF5B37; --butter:#FFD966; --lilac:#C8B2FF; --sky:#BFE6FA;
  --mint:#C6F0D6; --peach:#FFD1B5; --rose:#FFC6EE; --lav:#E4DBFF; --ice:#D7E5FF; --sand:#FFE3A8; --ok:#1F9D57; --bad:#E2412B; --white:#FFFFFF;
  --display:"Montserrat","Arial Black",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--sky-bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-block:20px;padding-inline:16px}
html.on-landing,body.on-landing{background:var(--violet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.h-big{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.02}
.star{position:absolute;pointer-events:none}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- LANDING ---------- */
.landing{max-width:1180px;margin:0 auto;background:var(--cream);border-radius:6px;padding:14px 22px 26px;overflow:hidden}
.lnav{display:flex;align-items:center;gap:18px;background:var(--lime);border-radius:999px;padding:8px 8px 8px 22px;flex-wrap:wrap}
.lnav .logo{font-family:var(--display);font-weight:900;font-size:18px;margin-right:auto;letter-spacing:-.01em}
.lnav .logo span{color:var(--violet)}
.lnav a.lk{font-size:14px;font-weight:500;text-decoration:none}
.lnav a.lk:hover{text-decoration:underline}
.pill-btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 26px;font-family:var(--display);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.pill-btn:hover{background:var(--ink);color:var(--lime)}
.l-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.8fr) minmax(0,.78fr);grid-template-rows:auto auto;gap:12px;margin-top:14px}
.l-main{grid-row:span 2;background:var(--violet);color:var(--white);border-radius:24px;padding:34px 30px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:420px}
.l-main h1{font-size:clamp(34px,5.4vw,62px);position:relative;z-index:1}
.l-main h1 em{font-style:normal;color:var(--lime)}
.l-main h1 .oo{display:inline-flex;gap:2px;vertical-align:middle}
.l-main p{margin:auto 0 12px;font-size:13px;color:#C9C4FF;max-width:44ch;position:relative;z-index:1}
.l-cta{background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:15px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px;position:relative;z-index:1}
.l-cta:hover{background:var(--white)}
.half{position:absolute;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#7A6BFF,#35D0C8 70%,#B8F5A8);opacity:.95}
.l-small{background:var(--violet);color:var(--white);border-radius:24px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.l-small hr{border:0;border-top:2px solid var(--pink);width:70%;margin:12px 0}
.l-lime{background:var(--lime);border-radius:24px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;font-size:15px;min-height:190px}
.l-photo{grid-row:span 2;border-radius:24px;overflow:hidden;position:relative;background:radial-gradient(circle at 30% 20%,#FF8BE0 0,#FF44C9 30%,#8E5BFF 62%,#4E3DF2 100%);display:flex;align-items:center;justify-content:center;padding:18px;min-height:300px}
.phone{width:min(190px,100%);background:var(--cream);border:2px solid var(--ink);border-radius:26px;padding:14px 12px;box-shadow:8px 10px 0 rgba(28,27,26,.25);transform:rotate(-6deg);display:flex;flex-direction:column;gap:8px}
.phone .fl{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:900;font-size:26px}
.phone .mini{border:1.5px solid var(--ink);border-radius:12px;padding:8px;font-size:11px;font-weight:700}
.phone .mini i{display:block;height:6px;border-radius:9px;background:rgba(28,27,26,.15);margin-top:6px;overflow:hidden}
.phone .mini i b{display:block;height:100%;background:var(--ink)}
.l-sec-title{font-size:clamp(28px,4.4vw,46px);margin:70px 0 26px;max-width:16ch;position:relative}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
.feat .fc{background:var(--violet);color:var(--white);border-radius:22px;padding:20px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.feat .fc b{font-size:16px;line-height:1.25}
.feat .fc span{font-size:12.5px;color:#D3CFFF}
.feat .fc.tilt{transform:rotate(-7deg);background:var(--violet);box-shadow:-18px -16px 0 0 var(--lime)}
.lime-band{background:var(--lime);border-radius:30px;margin-top:70px;padding:40px 34px 0;position:relative;overflow:hidden}
.lb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:center}
.lb-art{position:relative;min-height:300px}
.blob{position:absolute;inset:30px 20px 20px 10px;background:linear-gradient(140deg,#8E5BFF,#FF44C9 70%);border-radius:44% 56% 40% 60%/55% 40% 60% 45%}
.lb-card{position:absolute;left:18%;top:22%;width:min(260px,72%);background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:14px;transform:rotate(4deg);box-shadow:6px 8px 0 rgba(28,27,26,.2);display:flex;flex-direction:column;gap:8px;font-size:13px}
.lb-card .alt-m{border:1.5px solid var(--ink);border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center}
.lb-card .alt-m.ok{background:#D9F7E4;border-color:var(--ok)}
.lb-card .alt-m b{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:11px;background:var(--white)}
.lb-text h2{font-size:clamp(28px,4.2vw,46px);color:var(--violet)}
.lb-text h2 em{font-style:normal;color:var(--pink)}
.lb-text p{max-width:40ch;margin:18px 0 0;font-size:14px}
.progs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:40px -34px 0;padding:0 0 0}
.pg{border-radius:26px 26px 0 0;padding:20px 22px 30px;color:var(--white);display:flex;flex-direction:column;gap:22px;min-height:260px}
.pg .tags{display:flex;gap:6px;flex-wrap:wrap}
.pg .tags span{border:1.5px solid currentColor;border-radius:99px;padding:3px 11px;font-size:11.5px}
.pg h3{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.6vw,42px);line-height:1;margin-top:auto;letter-spacing:-.02em}
.pg p{margin:0;font-size:13px;opacity:.88;max-width:32ch}
.pg-v{background:var(--violet)} .pg-p{background:var(--pink)}
.l-final{background:var(--shell);color:var(--white);border-radius:26px;margin-top:22px;padding:30px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.l-final h2{font-size:clamp(24px,3.4vw,36px);max-width:20ch}
.l-final h2 em{font-style:normal;color:var(--lime)}
.l-final .l-cta{margin-left:auto;padding:15px 34px}
.l-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--muted)}

/* ---------- APP ---------- */
.frame{max-width:1320px;margin:0 auto;background:var(--shell);border-radius:34px;padding:14px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px}
.nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:58px}
.nav button{width:44px;height:44px;border-radius:13px;border:0;background:transparent;color:#D8D2C8;display:grid;place-items:center;position:relative;flex:none}
.nav button:hover{background:#3A3734}
.nav button.on{background:var(--butter);color:var(--ink)}
.nav button svg{width:21px;height:21px}
.nav .tip{position:absolute;left:52px;background:var(--ink);color:var(--white);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.nav button:hover .tip{opacity:1}
.nav .sep{flex:1}
.panel{background:var(--panel);border-radius:26px;padding:22px 26px 30px;min-width:0;min-height:80vh}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-size:13px;color:var(--muted);margin-right:auto;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--display);font-weight:900;color:var(--orange);font-size:20px;letter-spacing:-.02em;margin-left:4px}
.search{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:3px 3px 3px 12px;background:var(--white);width:min(300px,100%)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:14px}
.search button{border:0;background:var(--orange);color:var(--white);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.flame{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;background:var(--lime)}
.flame svg{width:22px;height:22px}
.me{display:flex;align-items:center;gap:9px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--pink);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--white)}
.me small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.me strong{font-size:14px;line-height:1.2}
.h-sec{font-size:24px;font-weight:700;letter-spacing:-.01em}
.row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 14px}
.row-head .h-sec{margin-right:auto}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--white);border-radius:9px;padding:4px 11px;font-size:13px;font-weight:500}
.pill.on{background:var(--ink);color:var(--white)}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:7px;padding:1px 8px;font-size:12px;font-weight:500;background:var(--white)}
.chip.dark{background:var(--ink);color:var(--white)}
.btn{border:1.5px solid var(--line);background:var(--orange);color:var(--white);border-radius:10px;padding:8px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;justify-content:center}
.btn.ghost{background:var(--white);color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--white)}
.btn.violet{background:var(--violet);color:var(--white)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{border:1.5px solid var(--line);border-radius:18px;background:var(--white);padding:18px}
.grid{display:grid;gap:14px}
.bar{height:8px;border-radius:99px;background:rgba(28,27,26,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.dot{display:inline-block;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);vertical-align:middle;margin-right:8px;flex:none}
.empty{border:1.5px dashed var(--muted);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 16px;border-radius:12px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}

/* painel */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.9fr);gap:14px}
.hero-main{background:var(--violet);color:var(--white);border-radius:22px;padding:26px 26px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;min-height:250px}
.hero-main .h-big{font-size:clamp(28px,3.8vw,46px)}
.hero-main .h-big em{font-style:normal;color:var(--lime)}
.hero-main p{margin:0;max-width:42ch;color:#DCD8FF;font-size:14px}
.hero-main .btn{margin-top:auto;align-self:stretch;border-radius:999px;padding:12px;font-family:var(--display);text-transform:uppercase;font-size:14px;letter-spacing:.02em}
.stack{display:grid;gap:14px;grid-template-rows:auto 1fr}
.streak{background:var(--lime);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.streak .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:1}
.streak .wk{display:flex;gap:5px;margin-top:10px}
.streak .wk span{flex:1;text-align:center;font-size:11px;font-weight:700}
.streak .wk i{display:block;height:24px;border-radius:7px;border:1.5px solid var(--line);margin-bottom:3px;background:var(--white)}
.streak .wk i.on{background:var(--orange)}
.next-exam{background:var(--violet);color:var(--white);border-radius:22px;padding:16px 18px}
.next-exam .h-big{font-size:22px;color:var(--lime)}
.next-exam hr{border:0;border-top:1.5px solid var(--pink);margin:10px 0;width:70%}
.lvl{border-radius:22px;background:var(--pink);color:var(--white);padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.lvl .h-big{font-size:34px}
.lvl .bar{background:rgba(255,255,255,.35)} .lvl .bar i{background:var(--lime)}
.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}
.subj{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.subj .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.subj h3{font-size:17px;font-weight:700;line-height:1.25}
.subj .pr{display:flex;justify-content:space-between;font-size:12px}
.subj .bar{background:rgba(255,255,255,.7)}
.subj .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lower{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);margin-top:14px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 0;border-bottom:1.5px solid var(--hair)}
td{padding:11px 0;border-bottom:1.5px solid var(--hair);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12px;color:var(--muted)}
.dark-card{background:var(--shell);color:var(--white);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.dark-card h3{font-size:19px;line-height:1.3}
.dark-card .btn{margin-top:auto;padding:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;justify-content:start;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--hair)}
.heat i.l1{background:#FFD3C7}.heat i.l2{background:#FF9F86}.heat i.l3{background:var(--orange)}.heat i.l4{background:#B83316}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--white)}
.badge.off{opacity:.38;border-style:dashed}
.badge b{font-family:var(--display);font-size:12px;text-transform:uppercase}

/* módulos */
.subj-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.sg{border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:170px}
.sg:hover{transform:translateY(-2px);transition:transform .15s}
.sg h3{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;line-height:1.05;margin-top:auto}
.trail{display:flex;flex-direction:column;gap:10px;max-width:860px}
.mod{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:18px;background:var(--white);padding:12px 14px;text-align:left;width:100%}
.mod:hover{background:var(--lav)}
.mod .n{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px}
.mod.done .n{background:var(--ok);color:var(--white);border-color:var(--ok)}
.mod h3{font-size:16px}
.mod .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.mod .bar{width:110px;height:6px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.crumbs button{border:0;background:none;padding:0;text-decoration:underline;color:var(--muted)}
.mhead{border:1.5px solid var(--line);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.mhead .h-big{font-size:clamp(26px,4vw,42px);max-width:18ch}
.reader{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:16px;margin-top:16px;align-items:start}
.toc{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.toc button{text-align:left;border:1.5px solid transparent;background:transparent;border-radius:11px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.toc button.on{border-color:var(--line);background:var(--white);font-weight:700}
.toc .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:11px;background:var(--white)}
.toc .ck.y{background:var(--ok);border-color:var(--ok);color:var(--white)}
.lesson-card{border:1.5px solid var(--line);border-radius:22px;background:var(--white);padding:24px 26px}
.lesson-card .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--violet)}
.lesson-card h2{font-size:24px;margin:6px 0 12px}
.prose{font-size:16px;line-height:1.72;max-width:68ch}
.prose p{margin:0 0 12px}
.prose h3{font-size:18px;margin:18px 0 8px}
.prose ul{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:5px}
.lnav-row{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.keybox{border:1.5px solid var(--line);border-radius:18px;background:var(--lime);padding:16px 18px;margin-top:14px}
.keybox h3{font-family:var(--display);text-transform:uppercase;font-size:15px;margin-bottom:8px}
.keybox ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.exbox{border:1.5px solid var(--line);border-radius:18px;background:var(--lav);padding:16px 18px;margin-top:14px}
.exbox h3{font-family:var(--display);text-transform:uppercase;font-size:15px;margin-bottom:6px}
.side{display:flex;flex-direction:column;gap:12px}
.side .card{padding:14px}
.side h4{margin:0 0 8px;font-size:14px}
.linklist{display:flex;flex-direction:column;gap:6px}
.linklist a{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-decoration:none;font-size:13.5px;font-weight:500;background:var(--white)}
.linklist a:hover{background:var(--lav)}
.linklist .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:900;font-size:13px;border:1.5px solid var(--line)}
.ai-out{margin-top:10px;border:1.5px dashed var(--violet);border-radius:14px;padding:14px 16px;background:#F5F3FF}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0}

/* aulas */
.lessons{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lesson{border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--white);display:flex;flex-direction:column}
.lesson .thumb{height:118px;position:relative;display:flex;align-items:flex-end;padding:12px;border-bottom:1.5px solid var(--line)}
.lesson .thumb .play{position:absolute;right:14px;top:14px;width:42px;height:42px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.lesson .thumb .h-big{font-size:18px;max-width:80%}
.lesson .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.lesson .body .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.lesson .thumb.has-img{background-size:cover!important;background-position:center!important;cursor:pointer}
.lesson .thumb.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72))}
.lesson .thumb.has-img .h-big{color:#fff;position:relative}
.lesson .thumb .play{border:0;cursor:pointer;z-index:1}
.lesson .vsrc{font-size:12px;color:var(--muted)}
.fc-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 18px}
.fc-top .card{padding:14px}.fc-top b{display:block;font-size:26px;font-family:var(--display);line-height:1.1}
.fc-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fc-deck{border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--white)}
.fc-deck h3{font-size:17px;margin:0}.fc-deck .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.fc-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:18px}
.fc-form{display:grid;gap:8px}.fc-form textarea,.fc-form select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--white);resize:vertical}
.fc-stage{max-width:680px;margin:0 auto}
.fc-card{perspective:1400px;cursor:pointer;margin:12px 0 16px}
.fc-inner{position:relative;min-height:320px;transition:transform .5s;transform-style:preserve-3d}
.fc-card.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.fc-face.front{background:var(--white)}.fc-face.back{background:var(--ink);color:var(--white);transform:rotateY(180deg)}
.fc-face .txt{font-size:20px;line-height:1.45;font-weight:600;white-space:pre-line;margin:auto 0}
.fc-face.back .txt{font-size:18px;font-weight:500}
.fc-face .hint{font-size:13px;color:var(--muted)}.fc-face.back .hint{color:#bbb}
.fc-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fc-rate button{border-radius:14px;padding:12px 8px;border:1.5px solid var(--line);font:inherit;font-weight:700;cursor:pointer;background:var(--white)}
.fc-rate button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:2px}
.fc-rate .r0{background:var(--rose)}.fc-rate .r1{background:var(--butter)}.fc-rate .r2{background:var(--lime)}
.fc-mine{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.fc-mine div{border:1.5px solid var(--hair);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
@media (max-width:720px){.fc-top{grid-template-columns:repeat(2,minmax(0,1fr))}.fc-cols{grid-template-columns:minmax(0,1fr)}.fc-face .txt{font-size:18px}.fc-inner{min-height:300px}}
.vmodal{position:fixed;inset:0;z-index:80;background:rgba(20,18,30,.72);display:grid;place-items:center;padding:16px}
.vmodal[hidden]{display:none}
.vbox{background:var(--white);border-radius:22px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1.5px solid var(--line)}
.vhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 10px}
.vhead h3{font-size:18px;margin:2px 0 0}
.vclose{border:1.5px solid var(--line);background:var(--white);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.vplayer{position:relative;aspect-ratio:16/9;background:#000;margin:0 18px;border-radius:14px;overflow:hidden}
.vplayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplayer .vmsg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.vinfo{padding:12px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.valts{padding:0 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.valt{border:1.5px solid var(--line);border-radius:12px;background:var(--white);padding:0;text-align:left;cursor:pointer;overflow:hidden;font:inherit}
.valt.on{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet)}
.valt img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.valt span{display:block;padding:6px 8px;font-size:12px;line-height:1.3}
.vprev{display:block;position:relative;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);aspect-ratio:16/9;background:var(--ink) center/cover;cursor:pointer;width:100%;padding:0}
.vprev i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.vprev b{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;color:#fff;font-size:12px;text-align:left;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75))}
.done-tag{font-size:12px;font-weight:700;color:var(--ok)}

/* questões */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,.inp{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--white);font-size:14px;min-width:0}
.qcard{border:1.5px solid var(--line);border-radius:20px;background:var(--white);padding:20px}
.qmeta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.qctx{white-space:pre-wrap;font-size:14.5px;line-height:1.6;max-width:78ch;overflow-wrap:anywhere}
.qintro{font-weight:700;margin:14px 0 12px;max-width:78ch;white-space:pre-wrap}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel);width:100%;overflow-wrap:anywhere}
.alt:hover:not(:disabled){background:var(--lav)}
.alt .L{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--white)}
.alt.right{background:#D9F7E4;border-color:var(--ok)} .alt.right .L{background:var(--ok);color:var(--white);border-color:var(--ok)}
.alt.wrong{background:#FFE1DA;border-color:var(--bad)} .alt.wrong .L{background:var(--bad);color:var(--white);border-color:var(--bad)}
.alt.sel{background:var(--lav)} .alt.sel .L{background:var(--violet);color:var(--white)}
.alt:disabled{cursor:default}
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.explain{margin-top:12px;border:1.5px dashed var(--violet);border-radius:14px;padding:12px 14px;background:#F3F1FF;white-space:pre-wrap;font-size:14px}
.feedback{margin-top:12px;font-weight:700}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1.5px solid var(--hair);font-size:14px}
.stat:last-child{border-bottom:0}

/* simulados */
.programs{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.prog{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:220px;color:var(--white)}
.prog .tags{display:flex;gap:6px;flex-wrap:wrap}
.prog .tags span{border:1.5px solid currentColor;border-radius:99px;padding:2px 10px;font-size:12px}
.prog h3{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.05;margin-top:auto}
.prog p{margin:0;font-size:13px;opacity:.85}
.prog .btn{background:var(--white);color:var(--ink);border-radius:99px}
.c-violet{background:var(--violet)}.c-pink{background:var(--pink)}.c-lime{background:var(--lime);color:var(--ink)}.c-ink{background:var(--shell)}
.c-lime .btn{background:var(--ink);color:var(--white)}
.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--panel);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1.5px solid var(--hair);margin-bottom:14px}
.timer{font-family:var(--display);font-weight:900;font-size:24px;background:var(--lime);border:1.5px solid var(--line);border-radius:12px;padding:2px 12px}
.qgrid{display:flex;flex-wrap:wrap;gap:5px}
.qgrid button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--white);font-size:13px;font-weight:700}
.qgrid button.ans{background:var(--violet);color:var(--white)}
.qgrid button.cur{outline:3px solid var(--orange);outline-offset:1px}
.qgrid button.r{background:var(--ok);color:var(--white);border-color:var(--ok)}
.qgrid button.w{background:var(--bad);color:var(--white);border-color:var(--bad)}
.links{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.link-card{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--white);text-decoration:none;display:flex;flex-direction:column;gap:4px}
.link-card:hover{background:var(--lav)}
.link-card b{font-family:var(--display);text-transform:uppercase;font-size:15px}

/* redação */
.red-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.sheet{background:repeating-linear-gradient(var(--white),var(--white) 29px,#E7E1F5 30px);line-height:30px;padding:8px 14px;border:1.5px solid var(--line);border-radius:16px;min-height:540px;font-size:15px;width:100%;resize:vertical}
.comp{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--white);display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.comp .n{font-family:var(--display);font-weight:900;font-size:20px;text-align:center;border-radius:10px;padding:6px 0;border:1.5px solid var(--line)}
.score{background:var(--violet);color:var(--white);border-radius:20px;padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .h-big{font-size:52px;color:var(--lime)}

.auto .ag{border-top:1.5px solid var(--hair);padding-top:10px;margin-top:10px}
.auto .ag-h{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:12.5px;letter-spacing:.03em;margin-bottom:6px}
.auto .ai{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:5px 0}
.auto .st{width:14px;height:14px;border-radius:50%;margin-top:3px;border:1.5px solid var(--line)}
.st-ok{background:var(--ok)} .st-warn{background:var(--butter)} .st-bad{background:var(--bad)}
.gram{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.gm{border:1.5px solid var(--hair);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.gm mark{background:#FFE1DA;color:var(--ink);border-radius:4px;padding:0 2px;text-decoration:underline wavy var(--bad)}
/* rotina */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{border:1.5px solid var(--line);border-radius:16px;background:var(--white);padding:10px;display:flex;flex-direction:column;gap:7px;min-height:240px}
.day.today{background:var(--lime)}
.day h4{margin:0 0 4px;font-family:var(--display);text-transform:uppercase;font-size:14px;display:flex;justify-content:space-between}
.blk{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;position:relative;line-height:1.3}
.blk b{display:block;font-size:13px}
.blk .x{position:absolute;right:4px;top:3px;border:0;background:transparent;font-size:15px;line-height:1;padding:2px 4px}
.forms{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:4px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exams{display:flex;flex-direction:column;gap:6px}
.exam{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border-bottom:1.5px solid var(--hair);padding:6px 0}
.exam .days{font-family:var(--display);font-weight:800;font-size:14px;border-radius:8px;padding:2px 8px;background:var(--lime);border:1.5px solid var(--line);white-space:nowrap}

/* foco */
.focus{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pomo{background:var(--violet);border-radius:24px;color:var(--white);padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.ring{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .tt b{font-family:var(--display);font-weight:900;font-size:clamp(40px,10vw,58px);display:block;line-height:1}
.pomo .pills .pill{background:transparent;color:var(--white);border-color:var(--white)}
.pomo .pills .pill.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.spot{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--white)}
.pl .cv{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);flex:none}
.pl div{flex:1;min-width:0}
.pl b{display:block}


.cursos{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;position:relative;z-index:1}
.cursos span{border:1.5px solid var(--lime);color:var(--lime);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.easier{background:var(--shell);color:var(--white);border-radius:30px;margin-top:70px;padding:40px 34px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 30px}
.ez-head{grid-column:1/-1;max-width:760px;display:flex;flex-direction:column;gap:12px}
.ez-badge{align-self:flex-start;background:var(--lime);color:var(--ink);border-radius:99px;padding:4px 12px;font-family:var(--display);font-weight:800;font-size:12px;text-transform:uppercase}
.easier h2{font-size:clamp(28px,4.2vw,46px)}
.easier h2 em{font-style:normal;color:var(--lime)}
.ez-head p{margin:0;color:#D8D2C8;max-width:60ch}
.ez-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;grid-column:1/2}
.ez-card{background:#3A3734;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ez-card b{font-size:15px;line-height:1.25}
.ez-card span:last-child{font-size:12.5px;color:#D8D2C8}
.ez-ic{font-family:var(--display);font-weight:900;color:var(--pink);font-size:14px}
.ez-free{background:var(--violet)}
.ez-free span:last-child{color:#E3E0FF}
.ez-chat{grid-column:2/3;align-self:center;display:flex;flex-direction:column;gap:10px;background:var(--cream);border-radius:22px;padding:18px;color:var(--ink);border:2px solid var(--lime);transform:rotate(2deg)}
.ez-msg{background:var(--lav);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13.5px;max-width:90%}
.ez-msg.me{align-self:flex-end;background:var(--lime);border-radius:14px 14px 4px 14px}
.vests5{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.vests5 .pg{min-height:230px}
.vests5 .pg h3{font-size:clamp(24px,2.4vw,32px)}
@media (max-width:1050px){.vests5{grid-template-columns:repeat(2,minmax(0,1fr))!important}.easier{grid-template-columns:1fr}.ez-grid,.ez-chat{grid-column:1/-1}}
@media (max-width:760px){.easier{padding:28px 18px}.ez-grid{grid-template-columns:1fr}.vests5{grid-template-columns:1fr!important}}
.fig{margin:16px 0 0;border:1.5px solid var(--line);border-radius:18px;background:var(--cream);padding:14px;overflow-x:auto}
.fig svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
@media (max-width:640px){.fig{padding:10px}.fig svg{min-width:520px}.fig::after{content:"arraste para o lado para ver a figura inteira";display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}}
.reader>*{min-width:0}.lesson-card{min-width:0;max-width:100%}
.tabwrap{overflow-x:auto;margin-top:14px}
.mtab{border-collapse:collapse;min-width:420px;width:100%;font-size:14px}
.mtab caption{text-align:left;font-weight:700;padding:0 0 6px}
.mtab th{background:var(--ink);color:var(--white);padding:7px 10px;font-weight:700;border:0}
.mtab td{padding:7px 10px;border-bottom:1.5px solid var(--hair);vertical-align:top}
.mtab tr:nth-child(even) td{background:var(--panel)}
.sabia{margin-top:14px;border-left:5px solid var(--pink);background:var(--rose);border-radius:0 14px 14px 0;padding:10px 14px;font-size:14px}
.provabox{border:1.5px solid var(--line);border-radius:18px;background:var(--sky);padding:16px 18px;margin-top:14px}
.provabox h3{font-family:var(--display);text-transform:uppercase;font-size:15px;margin-bottom:6px}
.provabox p{margin:0}
.lerbox{margin-top:16px}
.lerbox h3{font-size:15px;margin-bottom:8px}
/* ---------- contas e planos ---------- */
.auth-wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;background:var(--cream);border-radius:6px;padding:14px}
.auth-side{background:var(--violet);color:var(--white);border-radius:24px;padding:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;min-height:520px}
.auth-side h1{font-size:clamp(34px,4.6vw,54px);margin-top:auto}
.auth-side h1 em{font-style:normal;color:var(--lime)}
.auth-side p{color:#D3CFFF;max-width:38ch;margin:0}
.auth-logo{align-self:flex-start;background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:900;font-size:16px;position:relative;z-index:1}
.auth-logo span{color:var(--violet)}
.auth-card{background:var(--white);border:1.5px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;align-self:start}
.auth-card .l-cta{width:100%}
.auth-card .form{gap:12px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.auth-tabs button{border:0;background:transparent;border-radius:999px;padding:9px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13px}
.auth-tabs button.on{background:var(--ink);color:var(--lime)}
.auth-link{border:0;background:none;color:var(--violet);text-decoration:underline;font-size:13px;align-self:center}
