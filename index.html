<script>
window.MOD = window.MOD || {};
MOD["Biologia"] = [
{t:"Bioquímica celular",d:"Água, sais, carboidratos, lipídios, proteínas e ácidos nucleicos.",kw:"proteín|carboidrat|lipídi|enzim|glicose|amido|vitamina|DNA|RNA",
s:[["Água e sais minerais","A água é o componente mais abundante dos seres vivos. É solvente universal, transporta substâncias e regula a temperatura por ter alto calor específico. Sais minerais atuam como íons: cálcio na contração muscular e coagulação, ferro na hemoglobina, sódio e potássio no impulso nervoso, iodo nos hormônios da tireoide."],
["Carboidratos e lipídios","Carboidratos são a principal fonte de energia imediata. Monossacarídeos (glicose, frutose) se unem em dissacarídeos (sacarose, lactose) e polissacarídeos (amido nas plantas, glicogênio nos animais, celulose na parede vegetal). Lipídios são reserva energética de longo prazo, isolante térmico e componentes de membranas (fosfolipídios) e de hormônios esteroides, derivados do colesterol."],
["Proteínas e enzimas","Proteínas são cadeias de aminoácidos unidos por ligações peptídicas. A sequência de aminoácidos define a forma, e a forma define a função. Enzimas são proteínas catalisadoras: aceleram reações diminuindo a energia de ativação e são específicas para o substrato (modelo chave-fechadura). Calor excessivo e pH inadequado causam desnaturação, ou seja, perda da forma e da função."],
["Ácidos nucleicos","DNA guarda a informação genética, tem dupla hélice e bases A, T, C e G (A pareia com T, C com G). RNA é fita simples, tem uracila no lugar da timina e participa da síntese de proteínas. Replicação copia o DNA; transcrição produz RNA a partir do DNA; tradução, nos ribossomos, produz a proteína a partir do RNA mensageiro."]],
k:["Amido (plantas) e glicogênio (animais) são reservas de glicose.","Enzimas desnaturam com temperatura alta e pH fora do ideal.","No DNA: A–T e C–G. No RNA: uracila no lugar da timina.","Fluxo da informação: DNA → RNA → proteína."],
ex:["Uma fita de DNA tem a sequência ATG CCA. Qual a fita de RNA mensageiro transcrita a partir dela?","Troque cada base pela complementar, usando U no lugar de T: A→U, T→A, G→C, C→G. Resultado: UAC GGU."]},
{t:"Citologia",d:"Organelas, membrana plasmática, transporte e divisão celular.",kw:"célul|organela|mitocôndri|membrana|osmose|mitose|meiose",
s:[["Tipos de célula","Células procariontes (bactérias) não têm núcleo nem organelas membranosas; o material genético fica disperso no citoplasma. Células eucariontes têm núcleo delimitado por carioteca e organelas. A célula vegetal tem parede de celulose, cloroplastos e grande vacúolo; a animal tem centríolos e não tem parede."],
["Organelas","Mitocôndria realiza a respiração celular e produz ATP. Cloroplasto faz fotossíntese. Ribossomos sintetizam proteínas. O retículo endoplasmático rugoso produz proteínas e o liso produz lipídios e desintoxica. O complexo golgiense modifica, empacota e secreta. Lisossomos fazem a digestão intracelular. Peroxissomos degradam água oxigenada."],
["Membrana e transporte","A membrana segue o modelo do mosaico fluido: bicamada de fosfolipídios com proteínas. Transporte passivo não gasta energia e segue o gradiente: difusão simples, difusão facilitada e osmose (passagem de água para o meio mais concentrado). Transporte ativo gasta ATP e vai contra o gradiente, como a bomba de sódio e potássio. Endocitose e exocitose movem partículas grandes."],
["Divisão celular","Mitose gera duas células iguais à original (2n → 2n) e serve para crescimento e reparo. Meiose gera quatro células com metade dos cromossomos (2n → n) e forma gametas. O crossing-over, na prófase I da meiose, recombina genes e aumenta a variabilidade genética."]],
k:["Procarionte: sem núcleo. Eucarionte: com núcleo e organelas.","Mitocôndria = energia (ATP); ribossomo = proteínas; golgiense = secreção.","Osmose: água vai do meio menos concentrado para o mais concentrado.","Mitose mantém o número de cromossomos; meiose reduz pela metade."],
ex:["Hemácias colocadas em água destilada incham e se rompem. Explique.","A água destilada é hipotônica em relação à hemácia. Por osmose, a água entra na célula, que incha até romper (hemólise)."]},
{t:"Genética",d:"Leis de Mendel, heredogramas, grupos sanguíneos e herança ligada ao sexo.",kw:"gene|genétic|alelo|heredit|cromossom|herança|mendel|sangu",
s:[["Conceitos básicos","Gene é um trecho de DNA que codifica uma característica. Alelos são versões do mesmo gene. Homozigoto tem alelos iguais (AA ou aa); heterozigoto tem alelos diferentes (Aa). Genótipo é a constituição genética; fenótipo é a característica observável, resultado do genótipo com o ambiente."],
["Primeira e segunda leis de Mendel","Primeira lei: cada característica é determinada por um par de alelos que se separam na formação dos gametas. O cruzamento Aa × Aa gera genótipos 1 AA : 2 Aa : 1 aa e fenótipos 3 dominantes : 1 recessivo. Segunda lei: genes em cromossomos diferentes segregam de forma independente; AaBb × AaBb gera 9:3:3:1."],
["Grupos sanguíneos","No sistema ABO, IA e IB são codominantes e i é recessivo: tipo A (IAIA ou IAi), B (IBIB ou IBi), AB (IAIB) e O (ii). O tipo O é doador universal de hemácias e o AB é receptor universal. No sistema Rh, a eritroblastose fetal ocorre quando a mãe Rh− já sensibilizada gera anticorpos contra as hemácias de um filho Rh+."],
["Herança ligada ao sexo","Genes no cromossomo X têm herança diferente entre homens (XY) e mulheres (XX). Daltonismo e hemofilia são recessivos ligados ao X: o homem precisa de só um alelo para manifestar, por isso são mais comuns nele. Um homem afetado passa o alelo para todas as filhas e para nenhum filho."]],
k:["Aa × Aa → 3:1 no fenótipo; probabilidade de aa = 1/4.","Diibridismo independente → 9:3:3:1.","O é doador universal de hemácias; AB é receptor universal.","Doenças recessivas ligadas ao X são mais comuns em homens."],
ex:["Um casal heterozigoto para albinismo (Aa × Aa) quer saber a chance de ter uma filha albina.","P(aa) = 1/4 e P(menina) = 1/2. Como são eventos independentes, multiplicamos: 1/4 × 1/2 = 1/8."]},
{t:"Ecologia",d:"Cadeias alimentares, ciclos, relações ecológicas e impactos ambientais.",kw:"ecossistem|cadeia alimentar|ecológ|espécie|ambient|poluiç|desmat|nitrogên|carbono",
s:[["Níveis tróficos e energia","Produtores (plantas, algas) fazem fotossíntese; consumidores se alimentam de outros seres; decompositores (fungos e bactérias) reciclam a matéria. A energia flui em um só sentido e diminui a cada nível, porque grande parte se perde como calor na respiração: só cerca de 10% passa adiante. Por isso cadeias raramente passam de cinco níveis."],
["Ciclos biogeoquímicos","Diferente da energia, a matéria circula. No ciclo do carbono, a fotossíntese retira CO₂ e a respiração e as queimadas devolvem. No ciclo do nitrogênio, bactérias fixadoras (como Rhizobium, nas raízes de leguminosas) transformam N₂ em compostos usáveis, bactérias nitrificantes produzem nitrato e desnitrificantes devolvem N₂ à atmosfera."],
["Relações ecológicas","Harmônicas: mutualismo (os dois ganham e dependem um do outro, como líquens), protocooperação (ganham sem dependência), comensalismo (um ganha e o outro não perde). Desarmônicas: predação, parasitismo, competição e amensalismo. Competição intraespecífica regula o tamanho das populações."],
["Impactos ambientais","Eutrofização: excesso de nutrientes (esgoto, fertilizantes) faz algas proliferarem, a decomposição consome oxigênio e os peixes morrem. Magnificação trófica: substâncias não biodegradáveis, como mercúrio e DDT, se acumulam nos níveis mais altos da cadeia. Efeito estufa intensificado vem da queima de combustíveis fósseis e do desmatamento."]],
k:["Energia: fluxo unidirecional. Matéria: ciclo.","Leguminosas + Rhizobium enriquecem o solo com nitrogênio.","Eutrofização termina em falta de oxigênio na água.","Poluentes persistentes se concentram no topo da cadeia."],
ex:["Por que uma área de soja intercalada com feijão pode precisar de menos adubo nitrogenado?","O feijão é leguminosa e abriga bactérias fixadoras de nitrogênio em nódulos das raízes, que enriquecem o solo com compostos nitrogenados."]},
{t:"Fisiologia humana",d:"Digestão, circulação, respiração, excreção, hormônios e imunidade.",kw:"sangue|hormôn|digest|rim|pulm|coração|insulina|nervos|órgão",
s:[["Digestão","A digestão do amido começa na boca com a amilase salivar. No estômago, a pepsina age sobre proteínas em meio ácido. No duodeno, o suco pancreático (amilase, lipase, tripsina) e a bile (que emulsiona gorduras, sem ser enzima) completam a digestão. A absorção dos nutrientes ocorre no intestino delgado, graças às vilosidades; o grosso absorve água."],
["Circulação e respiração","O coração humano tem quatro cavidades. A circulação é dupla (pulmonar e sistêmica) e completa (sangue arterial e venoso não se misturam). Artérias saem do coração; veias chegam. Nos alvéolos pulmonares ocorre a hematose: o O₂ passa para o sangue e o CO₂ sai, por difusão. A maior parte do CO₂ viaja no plasma como bicarbonato."],
["Excreção e hormônios","O néfron filtra o sangue, reabsorve o que é útil e forma a urina. O ADH aumenta a reabsorção de água; álcool inibe o ADH e aumenta a urina. Insulina (pâncreas) reduz a glicose no sangue; glucagon aumenta. Adrenalina prepara o corpo para luta ou fuga. Hormônios da tireoide controlam o metabolismo."],
["Imunidade","A imunidade inata é rápida e inespecífica (pele, fagócitos, inflamação). A adaptativa é específica: linfócitos B produzem anticorpos e linfócitos T coordenam e destroem células infectadas. A memória imunológica explica a resposta mais rápida no segundo contato, base das vacinas."]],
k:["Bile emulsiona gordura, mas não é enzima.","Absorção de nutrientes: intestino delgado.","Hematose = troca gasosa nos alvéolos.","Insulina baixa a glicemia; glucagon eleva."],
ex:["Uma pessoa que retirou a vesícula biliar pode ter dificuldade em digerir qual tipo de alimento?","Alimentos gordurosos: sem a bile armazenada, a emulsificação das gorduras fica menos eficiente, o que atrapalha a ação da lipase."]},
{t:"Evolução",d:"Lamarck, Darwin, teoria sintética, especiação e evidências.",kw:"evoluç|seleção natural|darwin|lamarck|espécie|fóssil|adapta|resistên",
s:[["Lamarckismo e darwinismo","Lamarck propôs a lei do uso e desuso e a herança de características adquiridas: a girafa esticaria o pescoço e passaria isso aos filhos. Isso não é aceito hoje. Darwin propôs a seleção natural: há variação entre indivíduos, e os mais aptos ao ambiente sobrevivem e deixam mais descendentes."],
["Teoria sintética","Une Darwin com a genética. Mutações e recombinação gênica (meiose e fecundação) criam variabilidade; a seleção natural escolhe o que é vantajoso; deriva genética e migração também alteram as populações. Evolução é a mudança das frequências de alelos ao longo das gerações."],
["Especiação","Uma nova espécie surge quando populações deixam de cruzar entre si. Na especiação alopátrica, uma barreira geográfica separa a população, as partes acumulam diferenças e surge isolamento reprodutivo. Espécies diferentes até podem cruzar, mas geram descendentes estéreis, como a mula."],
["Evidências","Fósseis mostram formas intermediárias. Órgãos homólogos têm a mesma origem embrionária e funções que podem diferir (braço humano e asa de morcego), indicando ancestral comum: divergência. Órgãos análogos têm mesma função e origens diferentes (asa de inseto e de ave): convergência. Semelhanças no DNA confirmam parentescos."]],
k:["Seleção natural não cria a variação, só seleciona.","O antibiótico seleciona bactérias resistentes que já existiam.","Homólogos: mesma origem. Análogos: mesma função.","Especiação exige isolamento reprodutivo."],
ex:["Por que o uso indiscriminado de antibióticos aumenta bactérias resistentes?","Na população já existem bactérias com mutações de resistência. O antibiótico elimina as sensíveis e as resistentes sobrevivem e se multiplicam: é seleção natural."]},
{t:"Microbiologia e saúde",d:"Vírus, bactérias, protozoários, vermes, vacinas e soros.",kw:"vírus|bactéri|vacina|doença|infec|parasit|mosquito|dengue|transmiss|soro",
s:[["Vírus","Vírus são acelulares e só se reproduzem dentro de células: são parasitas intracelulares obrigatórios. Têm material genético (DNA ou RNA) envolto por cápsula de proteína. Antibióticos não funcionam contra eles. Exemplos: gripe, covid-19, dengue, zika, chikungunya, febre amarela, sarampo, HIV."],
["Bactérias e protozoários","Bactérias são procariontes; causam tuberculose, tétano, leptospirose, cólera e sífilis, e são tratadas com antibióticos. Protozoários causam malária (Plasmodium, pelo mosquito Anopheles), doença de Chagas (Trypanosoma cruzi, pelas fezes do barbeiro), leishmaniose (mosquito-palha) e amebíase."],
["Verminoses","Esquistossomose: Schistosoma mansoni, com o caramujo como hospedeiro intermediário; pega-se em água contaminada. Teníase: carne de porco ou boi malcozida. Ascaridíase e amarelão: falta de saneamento e de higiene; o amarelão entra pela pele dos pés descalços. Saneamento básico é a principal prevenção."],
["Vacinas e soros","Vacina leva antígenos (vírus atenuado, inativado ou partes dele) e induz o corpo a produzir anticorpos e células de memória: imunidade ativa, lenta e duradoura, usada na prevenção. Soro já traz anticorpos prontos: imunidade passiva, imediata e temporária, usada no tratamento, como no caso de picada de cobra."]],
k:["Antibiótico não trata vírus.","Aedes aegypti: dengue, zika, chikungunya e febre amarela urbana.","Vacina previne (ativa); soro trata (passiva).","Saneamento básico previne a maioria das verminoses."],
ex:["Uma pessoa picada por cobra recebe soro, e não vacina. Por quê?","Ela precisa de anticorpos imediatamente para neutralizar o veneno. O soro traz anticorpos prontos; a vacina levaria dias ou semanas para gerar resposta."]}
];

MOD["Química"] = [
{t:"Atomística e tabela periódica",d:"Modelos atômicos, partículas, distribuição eletrônica e propriedades periódicas.",kw:"átomo|elétron|próton|isótop|radioativ|tabela periódica|nêutron",
s:[["Modelos atômicos","Dalton: átomo como esfera maciça e indivisível. Thomson: esfera positiva com elétrons incrustados (pudim de passas). Rutherford: núcleo pequeno, denso e positivo, com elétrons ao redor e muito espaço vazio. Bohr: elétrons em níveis de energia; ao absorver energia, sobem de nível e, ao voltar, emitem luz (explica os fogos de artifício e o teste de chama)."],
["Partículas e semelhanças","Número atômico (Z) é o número de prótons e identifica o elemento. Massa (A) = prótons + nêutrons. Isótopos têm mesmo Z e massas diferentes (carbono-12 e carbono-14). Íons são átomos que ganharam (ânions) ou perderam (cátions) elétrons."],
["Radioatividade","Emissão alfa: núcleo perde 2 prótons e 2 nêutrons (Z diminui 2, A diminui 4). Emissão beta: um nêutron vira próton (Z aumenta 1, A não muda). Gama é onda eletromagnética, sem massa. Meia-vida é o tempo para metade da amostra decair; é a base da datação por carbono-14."],
["Propriedades periódicas","Na tabela, os períodos são as linhas e as famílias são as colunas. O raio atômico aumenta para baixo e para a esquerda. Eletronegatividade e energia de ionização aumentam para cima e para a direita; o flúor é o mais eletronegativo. Metais tendem a perder elétrons; ametais, a ganhar."]],
k:["Z = prótons; A = prótons + nêutrons.","Alfa: A −4, Z −2. Beta: Z +1.","Após n meias-vidas, sobra (1/2)ⁿ da amostra.","Eletronegatividade cresce para cima e para a direita."],
ex:["Uma amostra de 80 g de um isótopo tem meia-vida de 5 anos. Quanto resta após 15 anos?","15 anos = 3 meias-vidas. 80 → 40 → 20 → 10 g. Restam 10 g."]},
{t:"Ligações e forças intermoleculares",d:"Iônica, covalente, metálica, polaridade e pontes de hidrogênio.",kw:"ligaç|polar|molécul|ponte de hidrogênio|interação|solubil|iônic",
s:[["Tipos de ligação","Iônica: transferência de elétrons entre metal e ametal; forma sólidos com alto ponto de fusão que conduzem corrente quando fundidos ou dissolvidos (NaCl). Covalente: compartilhamento de elétrons entre ametais (H₂O, CO₂). Metálica: elétrons livres entre cátions, o que explica a condução elétrica e o brilho dos metais."],
["Polaridade","Uma ligação é polar quando os átomos têm eletronegatividades diferentes. Uma molécula é polar quando os polos não se anulam pela geometria: a água (angular) é polar; o CO₂ (linear) é apolar, apesar de ter ligações polares. Semelhante dissolve semelhante: polar dissolve polar, apolar dissolve apolar."],
["Forças intermoleculares","Da mais fraca para a mais forte: dipolo induzido (London, em apolares), dipolo permanente (em polares) e ligação de hidrogênio (H ligado a F, O ou N). Quanto mais fortes as forças, maior o ponto de ebulição. Por isso a água ferve a 100 °C, muito acima do esperado para o tamanho da molécula."],
["Aplicações","Sabão tem uma ponta polar e uma cadeia apolar: a parte apolar envolve a gordura e a polar interage com a água, formando micelas. Gasolina e água não se misturam porque a gasolina é apolar. O etanol se mistura à água por fazer ligações de hidrogênio."]],
k:["Metal + ametal: iônica. Ametal + ametal: covalente.","Geometria decide se a molécula é polar.","Ligação de hidrogênio: H com F, O ou N.","Semelhante dissolve semelhante."],
ex:["Por que o etanol se dissolve em água e o óleo não?","O etanol tem o grupo –OH, polar, e faz ligações de hidrogênio com a água. O óleo é formado por cadeias longas e apolares, que não interagem bem com a água."]},
{t:"Estequiometria",d:"Mol, massa molar, proporções, reagente limitante e rendimento.",kw:"mol\\b|massa molar|estequiom|rendimento|reagente|produz|toneladas|quantidade de",
s:[["Mol e massa molar","Mol é uma quantidade: 6,02 × 10²³ entidades (constante de Avogadro). A massa molar é a massa de 1 mol, em g/mol, obtida somando as massas atômicas. Exemplo: H₂O = 2(1) + 16 = 18 g/mol. Um gás ideal ocupa 22,4 L por mol nas condições normais (0 °C e 1 atm)."],
["Proporção na reação","Com a equação balanceada, os coeficientes dão a proporção em mol. Em 2 H₂ + O₂ → 2 H₂O, 2 mol de hidrogênio reagem com 1 mol de oxigênio e formam 2 mol de água. Monte a regra de três sempre em mol e depois converta para massa, volume ou número de partículas."],
["Limitante e excesso","Quando as quantidades não estão na proporção exata, o reagente que acaba primeiro é o limitante e determina quanto produto se forma. O outro sobra em excesso. Calcule quanto de cada reagente seria necessário para consumir o outro e compare."],
["Pureza e rendimento","Se o minério tem 80% de pureza, só 80% da massa reage. Se o rendimento é 90%, o produto real é 90% do teórico. Aplique primeiro a pureza no reagente e por último o rendimento no produto."]],
k:["Balanceie antes de calcular.","Regra de três sempre a partir dos coeficientes (mol).","O limitante define o produto.","Pureza no reagente; rendimento no produto."],
ex:["Quantos gramas de água se formam ao queimar 4 g de H₂ com oxigênio suficiente? (H = 1, O = 16)","2 H₂ + O₂ → 2 H₂O. 4 g de H₂ = 2 mol, que formam 2 mol de H₂O = 2 × 18 = 36 g."]},
{t:"Soluções",d:"Concentrações, diluição, mistura e propriedades coligativas.",kw:"soluç|concentraç|dilu|soluto|solvente|g/L|mol/L|osmos|ebuliç",
s:[["Concentrações","Concentração comum: C = massa do soluto / volume da solução (g/L). Concentração em quantidade de matéria: M = n/V (mol/L). Título é a fração em massa (0,1 = 10%). Partes por milhão (ppm) indicam quantidades muito pequenas: 1 ppm = 1 mg por kg."],
["Diluição e mistura","Na diluição, adiciona-se solvente e a quantidade de soluto não muda: C₁V₁ = C₂V₂. Na mistura de soluções do mesmo soluto, as quantidades se somam: C_final = (C₁V₁ + C₂V₂)/(V₁ + V₂). Se os solutos reagem, como ácido e base, faça a estequiometria da neutralização."],
["Propriedades coligativas","Dependem do número de partículas dissolvidas, não da natureza delas. Um soluto não volátil diminui a pressão de vapor (tonoscopia), aumenta a temperatura de ebulição (ebulioscopia) e diminui a de congelamento (crioscopia). Sal em estradas evita gelo; água com sal ferve acima de 100 °C."],
["Osmose","Na osmose, o solvente atravessa a membrana semipermeável do meio menos concentrado para o mais concentrado. A pressão osmótica é a pressão necessária para impedir isso. Salgar carne a desidrata; dessalinização por osmose reversa aplica pressão maior que a osmótica para obter água doce."]],
k:["C = m/V; M = n/V.","Diluição: C₁V₁ = C₂V₂.","Mais partículas, maior o efeito coligativo.","NaCl gera 2 partículas por fórmula; glicose, 1."],
ex:["Diluindo 200 mL de solução de 5 g/L até 1 L, qual a nova concentração?","C₁V₁ = C₂V₂ → 5 × 0,2 = C₂ × 1 → C₂ = 1 g/L."]},
{t:"Físico-química",d:"Termoquímica, cinética, equilíbrio químico e pH.",kw:"entalpi|exotérm|endotérm|velocidade|catalis|equilíbrio|pH|ácid",
s:[["Termoquímica","Reação exotérmica libera calor (ΔH < 0), como a combustão. Endotérmica absorve (ΔH > 0), como a fotossíntese. A Lei de Hess diz que o ΔH depende só dos estados inicial e final: somam-se etapas, invertendo o sinal ao inverter a equação e multiplicando pelo coeficiente."],
["Cinética","A velocidade aumenta com temperatura, concentração, superfície de contato (comprimido em pó dissolve mais rápido) e catalisador. O catalisador diminui a energia de ativação, não é consumido e não muda o ΔH nem o rendimento. Enzimas são catalisadores biológicos."],
["Equilíbrio químico","Em sistema fechado, as velocidades direta e inversa se igualam e as concentrações ficam constantes. Kc = [produtos]/[reagentes], elevados aos coeficientes; sólidos e líquidos puros não entram. Le Chatelier: aumentar a concentração de um reagente desloca para os produtos; aumentar a pressão desloca para o lado com menos mols de gás; aquecer favorece o sentido endotérmico."],
["Ácidos, bases e pH","pH = −log[H⁺]. A 25 °C, pH 7 é neutro, abaixo é ácido e acima é básico. Uma unidade de pH representa um fator 10: pH 3 é dez vezes mais ácido que pH 4. Sais podem deixar a água ácida ou básica (hidrólise). Solução-tampão resiste a variações de pH, como o sistema bicarbonato no sangue."]],
k:["ΔH < 0 exotérmica; ΔH > 0 endotérmica.","Catalisador acelera sem mudar ΔH nem equilíbrio.","Aquecer favorece o sentido endotérmico.","pH muda de 1 = concentração muda 10 vezes."],
ex:["Uma solução passa de pH 5 para pH 3. Quantas vezes aumentou a concentração de H⁺?","Diminuiu 2 unidades de pH: 10² = 100 vezes mais H⁺."]},
{t:"Química orgânica",d:"Cadeias, funções, isomeria, reações e polímeros.",kw:"orgânic|carbono|álcool|éster|polímer|hidrocarbon|combustí|petróleo|isômer",
s:[["Carbono e cadeias","O carbono faz quatro ligações e forma cadeias abertas ou fechadas, saturadas (só ligações simples) ou insaturadas (duplas ou triplas). Hidrocarbonetos têm só C e H: alcanos (simples), alcenos (dupla), alcinos (tripla) e aromáticos (anel benzênico). Petróleo é uma mistura de hidrocarbonetos separada por destilação fracionada."],
["Funções orgânicas","Álcool: –OH em carbono saturado (etanol). Fenol: –OH no anel aromático. Aldeído: C=O na ponta (formol). Cetona: C=O no meio (acetona). Ácido carboxílico: –COOH (ácido acético, do vinagre). Éster: –COO– (aromas de frutas). Amina: –NH₂. Amida: –CONH₂. Éter: –O– entre carbonos."],
["Isomeria","Isômeros têm a mesma fórmula molecular e estruturas diferentes. Isomeria plana: muda cadeia, posição ou função. Geométrica (cis-trans): exige dupla ligação com ligantes diferentes em cada carbono. Óptica: exige carbono quiral (quatro ligantes diferentes); os dois isômeros desviam a luz em sentidos opostos e podem ter efeitos diferentes no organismo."],
["Reações e polímeros","Combustão completa produz CO₂ e água. Esterificação: ácido + álcool → éster + água. Saponificação: gordura + base forte → sabão + glicerol. Polímeros de adição juntam monômeros com dupla ligação (polietileno, PVC, isopor); de condensação liberam molécula pequena como água (PET, náilon, poliéster)."]],
k:["–OH álcool; –COOH ácido; –COO– éster.","Carbono quiral = 4 ligantes diferentes.","Saponificação produz sabão.","Plásticos comuns são polímeros de adição."],
ex:["Ácido acético reage com etanol. Qual a função do produto principal?","É uma esterificação: forma-se o éster acetato de etila e água."]},
{t:"Eletroquímica",d:"Oxirredução, pilhas, eletrólise e corrosão.",kw:"pilha|bateria|oxida|reduç|eletról|corros|eletrodo|potencial",
s:[["Oxirredução","Oxidação é perda de elétrons (o número de oxidação aumenta); redução é ganho de elétrons. Quem se oxida é o agente redutor; quem se reduz é o agente oxidante. Os elétrons perdidos por um são exatamente os ganhos pelo outro."],
["Pilhas","Na pilha, uma reação espontânea gera corrente. O ânodo é onde ocorre a oxidação (polo negativo) e o cátodo é onde ocorre a redução (polo positivo). Os elétrons vão do ânodo para o cátodo pelo fio. A ponte salina mantém a neutralidade das soluções. ΔE = E°red maior − E°red menor; se for positiva, a pilha funciona."],
["Eletrólise","É o processo inverso: usa corrente elétrica para forçar uma reação não espontânea. É usada para obter alumínio, cloro, soda cáustica e para galvanoplastia (revestir peças com cromo ou níquel). Na eletrólise, o ânodo é o polo positivo, mas a oxidação continua ocorrendo nele."],
["Corrosão","A ferrugem é a oxidação do ferro na presença de água e oxigênio. Formas de proteger: pintura, galvanização (cobrir com zinco) e metal de sacrifício, um metal que se oxida mais facilmente (como zinco ou magnésio) ligado ao ferro em navios e tubulações."]],
k:["Ânodo: oxidação. Cátodo: redução (vale para pilha e eletrólise).","Elétrons: do ânodo para o cátodo.","Pilha é espontânea; eletrólise não.","Metal de sacrifício tem maior tendência a oxidar."],
ex:["Zn²⁺/Zn tem E°red = −0,76 V e Cu²⁺/Cu tem +0,34 V. Qual a ddp da pilha?","ΔE = 0,34 − (−0,76) = 1,10 V. O zinco oxida (ânodo) e o cobre reduz (cátodo)."]}
];

MOD["Física"] = [
{t:"Cinemática",d:"Velocidade, aceleração, MU, MUV, queda livre e gráficos.",kw:"velocidade|aceleraç|km/h|distância|percur|movimento|tempo de",
s:[["Velocidade média","Velocidade média é a distância percorrida dividida pelo tempo: v = Δs/Δt. No SI é m/s; para passar de km/h para m/s, divida por 3,6. Em trechos com velocidades diferentes, não faça a média das velocidades: some as distâncias e divida pelo tempo total."],
["Movimento uniforme","No MU a velocidade é constante e a posição segue s = s₀ + v·t. O gráfico s × t é uma reta, e sua inclinação é a velocidade. Problemas de encontro: iguale as funções horárias dos dois móveis."],
["Movimento uniformemente variado","No MUV a aceleração é constante: v = v₀ + a·t e s = s₀ + v₀·t + a·t²/2. A equação de Torricelli não usa tempo: v² = v₀² + 2·a·Δs. No gráfico v × t, a inclinação é a aceleração e a área sob a curva é o deslocamento."],
["Queda livre e lançamentos","Sem resistência do ar, todos os corpos caem com a mesma aceleração, g ≈ 10 m/s², independente da massa. No lançamento horizontal, o movimento horizontal é uniforme e o vertical é queda livre, e os dois acontecem ao mesmo tempo."]],
k:["km/h ÷ 3,6 = m/s.","Velocidade média = distância total / tempo total.","Área do gráfico v × t = deslocamento.","Torricelli quando o problema não dá o tempo."],
ex:["Um carro vai de 0 a 108 km/h em 10 s. Qual a aceleração média?","108 km/h = 30 m/s. a = Δv/Δt = 30/10 = 3 m/s²."]},
{t:"Dinâmica",d:"Leis de Newton, peso, atrito, plano inclinado e movimento circular.",kw:"força|newton|atrito|peso|massa|inércia|tração",
s:[["Leis de Newton","1ª lei (inércia): sem força resultante, o corpo mantém repouso ou movimento retilíneo uniforme; por isso o cinto de segurança é necessário. 2ª lei: F_resultante = m·a. 3ª lei: toda ação tem reação de mesma intensidade e sentido oposto, aplicada em corpos diferentes."],
["Forças do dia a dia","Peso: P = m·g, sempre vertical para baixo. Normal: perpendicular à superfície. Atrito: Fat = μ·N, contrário à tendência de deslizamento; o atrito estático máximo é maior que o cinético, por isso é mais difícil começar a empurrar. Tração: força em fios e cabos."],
["Plano inclinado","No plano inclinado de ângulo θ, o peso se divide em P·sen θ (paralela ao plano, puxa o corpo para baixo) e P·cos θ (perpendicular, equilibrada pela normal). Sem atrito, a aceleração de descida é g·sen θ."],
["Movimento circular","Para fazer uma curva, é preciso força resultante apontando para o centro: a força centrípeta, Fc = m·v²/R. Em curvas de carro, quem faz esse papel é o atrito dos pneus. Com pista molhada o atrito cai e o carro tende a sair pela tangente."]],
k:["F = m·a; P = m·g.","Ação e reação atuam em corpos diferentes.","Fat = μ·N.","Fc = m·v²/R aponta para o centro."],
ex:["Um bloco de 4 kg é puxado por 20 N em superfície com atrito de 8 N. Qual a aceleração?","F_resultante = 20 − 8 = 12 N. a = 12/4 = 3 m/s²."]},
{t:"Energia e trabalho",d:"Trabalho, energias cinética e potencial, conservação, potência e impulso.",kw:"energia|potência|trabalho|rendimento|usina|cinétic|potencial",
s:[["Trabalho","Trabalho é a energia transferida por uma força ao longo de um deslocamento: τ = F·d·cos θ. Força perpendicular ao movimento não realiza trabalho. O trabalho da força resultante é igual à variação de energia cinética (teorema da energia cinética)."],
["Formas de energia","Energia cinética: Ec = m·v²/2 (dobrar a velocidade quadruplica a energia, por isso a frenagem fica muito mais longa). Potencial gravitacional: Ep = m·g·h. Potencial elástica: k·x²/2. Sem atrito, a energia mecânica se conserva: o que se perde em altura vira velocidade."],
["Potência e rendimento","Potência é a rapidez com que a energia é transformada: P = E/Δt, em watts (J/s). Rendimento = energia útil / energia total. Nenhuma máquina tem rendimento de 100%, porque sempre há perdas, principalmente em calor."],
["Usinas e matriz energética","Hidrelétrica: energia potencial da água vira cinética, que gira a turbina e o gerador. Termelétrica: queima combustível, aquece água, o vapor gira a turbina. Eólica usa a energia cinética do vento; solar fotovoltaica converte luz diretamente em eletricidade. O ENEM cobra a sequência de transformações e os impactos ambientais."]],
k:["Ec = mv²/2; Ep = mgh.","Sem atrito, a energia mecânica se conserva.","P = E/t; 1 W = 1 J/s.","Rendimento sempre menor que 100%."],
ex:["Uma bola cai de 5 m de altura, sem resistência do ar. Com que velocidade chega ao chão? (g = 10)","mgh = mv²/2 → v² = 2gh = 100 → v = 10 m/s."]},
{t:"Eletricidade",d:"Corrente, Ohm, potência, circuitos e consumo de energia.",kw:"corrente|resistên|tensão|circuito|watt|kWh|lâmpada|chuveiro|elétric",
s:[["Grandezas básicas","Corrente elétrica (i) é o fluxo de cargas, em ampères. Tensão (U), em volts, é a diferença de potencial que move as cargas. Resistência (R), em ohms, é a oposição à passagem da corrente. Primeira lei de Ohm: U = R·i."],
["Potência e consumo","Potência elétrica: P = U·i = R·i² = U²/R. Consumo de energia: E = P·Δt; em kWh, use potência em kW e tempo em horas. Exemplo: um chuveiro de 5.000 W usado 30 min por dia gasta 2,5 kWh por dia."],
["Associação de resistores","Em série, a corrente é a mesma em todos e as resistências se somam: se uma lâmpada queima, todas apagam. Em paralelo, a tensão é a mesma em todos, e 1/Req = 1/R₁ + 1/R₂...; a resistência equivalente é menor que a menor delas. As tomadas de casa são ligadas em paralelo."],
["Segurança e aparelhos","Disjuntores e fusíveis protegem contra corrente excessiva. Em tensão fixa, potência maior exige resistência menor: no chuveiro, a posição inverno usa um trecho menor do resistor. Fios mais grossos têm menor resistência e esquentam menos."]],
k:["U = R·i; P = U·i.","E (kWh) = P (kW) × t (h).","Série: soma. Paralelo: Req menor que a menor.","Casa: tudo em paralelo, mesma tensão."],
ex:["Uma lâmpada de 60 W fica acesa 5 h por dia durante 30 dias. Quantos kWh consome?","E = 0,06 kW × 5 h × 30 = 9 kWh."]},
{t:"Ondas e óptica",d:"Ondas, som, espectro eletromagnético, reflexão, refração, lentes e visão.",kw:"onda|frequência|som|luz|lente|espelho|refraç|comprimento de onda|radiaç",
s:[["Ondas","Onda transporta energia sem transportar matéria. Mecânicas precisam de meio (som); eletromagnéticas se propagam no vácuo (luz, rádio, raios X). Equação fundamental: v = λ·f. Quando a onda muda de meio, a frequência se mantém e a velocidade e o comprimento de onda mudam."],
["Som","O som é onda mecânica longitudinal. Altura relaciona-se com a frequência (agudo ou grave); intensidade com a amplitude (forte ou fraco); timbre com a forma da onda (permite distinguir instrumentos). Humanos ouvem de cerca de 20 Hz a 20.000 Hz. O efeito Doppler muda a frequência percebida quando a fonte se aproxima ou se afasta."],
["Reflexão e refração","Na reflexão, o ângulo de incidência é igual ao de reflexão. Na refração, a luz muda de meio e de velocidade, e pode desviar. Índice de refração: n = c/v. Lei de Snell: n₁·sen θ₁ = n₂·sen θ₂. Reflexão total ocorre indo para meio menos refringente acima do ângulo limite: princípio da fibra óptica."],
["Lentes e visão","Lente convergente concentra a luz (lupa); divergente espalha. Miopia: imagem forma-se antes da retina; corrige-se com lente divergente. Hipermetropia: imagem depois da retina; lente convergente. Presbiopia (vista cansada) também usa lente convergente. Vergência em dioptrias: V = 1/f, com f em metros."]],
k:["v = λ·f.","Som não se propaga no vácuo.","Na refração a frequência não muda.","Miopia: divergente. Hipermetropia: convergente."],
ex:["Uma rádio FM transmite em 100 MHz. Qual o comprimento de onda? (c = 3 × 10⁸ m/s)","λ = v/f = 3 × 10⁸ / 1 × 10⁸ = 3 m."]},
{t:"Termologia",d:"Escalas, calor, mudanças de estado, dilatação, gases e termodinâmica.",kw:"temperatura|calor|térmic|°C|gás|dilata|vapor|aquec",
s:[["Escalas e calor","Temperatura mede a agitação das partículas; calor é energia em trânsito do corpo mais quente para o mais frio. Conversões: C/5 = (F − 32)/9 e K = C + 273. Variação de 1 °C equivale a 1 K e a 1,8 °F."],
["Calorimetria","Calor sensível muda a temperatura: Q = m·c·ΔT. Calor latente muda o estado sem mudar a temperatura: Q = m·L. A água tem calor específico alto (1 cal/g·°C), por isso regiões litorâneas têm menor amplitude térmica. Em sistema isolado, a soma dos calores trocados é zero."],
["Transmissão de calor","Condução: de partícula a partícula, típica dos sólidos (cabo de panela). Convecção: correntes em fluidos (ar-condicionado no alto, aquecedor embaixo, brisas marítimas). Irradiação: ondas eletromagnéticas, funciona no vácuo (calor do Sol). A garrafa térmica reduz as três formas."],
["Gases e termodinâmica","Gás ideal: P·V/T = constante (T em kelvin). Isotérmica: P·V constante. Isobárica: V/T constante. Isocórica: P/T constante. Primeira lei: ΔU = Q − τ. Máquinas térmicas transformam parte do calor em trabalho e sempre rejeitam calor para a fonte fria (segunda lei)."]],
k:["K = C + 273.","Q = mcΔT (sensível) e Q = mL (latente).","Convecção: fluidos. Irradiação: funciona no vácuo.","ΔU = Q − τ."],
ex:["Quanto calor é preciso para aquecer 500 g de água de 20 °C a 80 °C? (c = 1 cal/g·°C)","Q = 500 × 1 × 60 = 30.000 cal = 30 kcal."]},
{t:"Hidrostática",d:"Densidade, pressão, Stevin, Pascal e empuxo.",kw:"pressão|densidade|empuxo|flutua|submers|hidrául|profundidade",
s:[["Densidade e pressão","Densidade: d = m/V. A água tem 1 g/cm³ = 1000 kg/m³. Pressão é força por área: p = F/A. A mesma força em área menor gera pressão maior: faca afiada corta melhor e salto fino afunda na areia."],
["Lei de Stevin","Num líquido em repouso, a pressão aumenta com a profundidade: p = p₀ + d·g·h. Na água, cada 10 m de profundidade somam cerca de 1 atm. Pontos na mesma altura do mesmo líquido têm a mesma pressão: princípio dos vasos comunicantes e das caixas-d'água."],
["Princípio de Pascal","Uma variação de pressão aplicada a um líquido se transmite integralmente a todos os pontos. Na prensa hidráulica, F₁/A₁ = F₂/A₂: uma força pequena no êmbolo pequeno gera força grande no êmbolo grande. É usado em freios e elevadores de carros."],
["Empuxo","Princípio de Arquimedes: todo corpo imerso recebe uma força vertical para cima igual ao peso do líquido deslocado, E = d_líquido·V_submerso·g. O corpo flutua se sua densidade média for menor que a do líquido. Navios de aço flutuam porque o casco cheio de ar reduz a densidade média."]],
k:["d = m/V; p = F/A.","+10 m de água ≈ +1 atm.","Prensa: F₁/A₁ = F₂/A₂.","E = d_líq · V_sub · g."],
ex:["Um mergulhador está a 20 m de profundidade no mar. Qual a pressão total aproximada?","Pressão atmosférica (1 atm) + 2 atm da coluna de água = cerca de 3 atm."]}
];

MOD["Matemática"] = [
{t:"Porcentagem e juros",d:"Porcentagem, aumentos e descontos sucessivos, juros simples e compostos.",kw:"%|porcent|juros|desconto|aumento|taxa|lucro",
s:[["Porcentagem","Porcentagem é uma razão de denominador 100: 25% = 0,25. Para calcular 18% de 250, faça 0,18 × 250 = 45. Para saber quanto um valor representa de outro, divida: 30 de 120 é 30/120 = 0,25 = 25%."],
["Fator multiplicativo","Aumento de p%: multiplique por (1 + p/100). Desconto de p%: multiplique por (1 − p/100). Aumentos e descontos sucessivos multiplicam os fatores: aumento de 10% seguido de desconto de 10% dá 1,1 × 0,9 = 0,99, ou seja, perda de 1%, e não zero."],
["Juros simples","Os juros incidem sempre sobre o capital inicial: J = C·i·t e M = C + J. O montante cresce em progressão aritmética. Atenção: taxa e tempo precisam estar na mesma unidade (mensal com meses, anual com anos)."],
["Juros compostos","Os juros incidem sobre o montante acumulado (juros sobre juros): M = C·(1 + i)ᵗ. O crescimento é exponencial. É o regime de financiamentos, cartão de crédito e aplicações. O ENEM costuma fornecer valores de potências ou logaritmos para facilitar as contas."]],
k:["Aumento de p%: × (1 + p/100).","Fatores sucessivos se multiplicam.","Simples: J = Cit. Compostos: M = C(1 + i)ᵗ.","Taxa e tempo na mesma unidade."],
ex:["Um produto de R$ 200 sobe 20% e depois tem desconto de 20%. Qual o preço final?","200 × 1,2 × 0,8 = 200 × 0,96 = R$ 192."]},
{t:"Razão, proporção e escalas",d:"Regra de três, grandezas proporcionais, escalas e unidades.",kw:"escala|proporç|razão|grandeza|unidade|litro|mapa|planta|metro",
s:[["Grandezas proporcionais","Diretamente proporcionais: quando uma dobra, a outra dobra (quantidade e preço). Inversamente proporcionais: quando uma dobra, a outra cai pela metade (velocidade e tempo de viagem). Na regra de três composta, analise cada grandeza em relação à que se quer calcular."],
["Escalas","Escala = medida no desenho / medida real, nas mesmas unidades. Escala 1:50.000 quer dizer que 1 cm no mapa vale 50.000 cm = 500 m. Em áreas, a razão fica ao quadrado; em volumes, ao cubo. Uma maquete na escala 1:100 tem área 10.000 vezes menor."],
["Unidades","Comprimento: km, hm, dam, m, dm, cm, mm (fator 10). Área: fator 100 (1 m² = 10.000 cm²). Volume: fator 1000 (1 m³ = 1000 L; 1 dm³ = 1 L; 1 cm³ = 1 mL). Tempo: 1 h = 60 min = 3600 s; frações de hora: 0,5 h = 30 min."],
["Leitura de enunciados","Questões de proporção trazem muitas informações. Identifique a grandeza pedida e a unidade da resposta, monte a relação e só no final faça a conta. Muitos erros vêm de esquecer de converter unidades."]],
k:["Escala linear k: área k², volume k³.","1 m³ = 1000 L; 1 dm³ = 1 L.","Direta: multiplica cruzado. Inversa: em linha.","Confira a unidade pedida."],
ex:["Num mapa de escala 1:200.000, duas cidades estão a 7 cm. Qual a distância real?","7 × 200.000 = 1.400.000 cm = 14 km."]},
{t:"Estatística",d:"Média, mediana, moda, desvio padrão e leitura de gráficos.",kw:"média|mediana|moda|gráfico|tabela|desvio|frequência",
s:[["Medidas de tendência central","Média aritmética: soma dos valores dividida pela quantidade. Média ponderada: cada valor multiplicado pelo seu peso, dividido pela soma dos pesos (como notas do SiSU). Mediana: valor central com os dados em ordem; se a quantidade for par, é a média dos dois centrais. Moda: valor mais frequente."],
["Quando usar cada uma","A média é sensível a valores extremos: um salário muito alto puxa a média para cima. A mediana não é afetada por extremos, por isso representa melhor rendas. A moda serve para dados qualitativos, como a cor de carro mais vendida."],
["Dispersão","Medidas de dispersão mostram quão espalhados estão os dados. Variância: média dos quadrados dos desvios em relação à média. Desvio padrão: raiz da variância. Menor desvio padrão significa maior regularidade: entre dois atletas com mesma média, o de menor desvio é mais constante."],
["Gráficos","Gráfico de barras compara categorias; de linhas mostra evolução no tempo; de setores mostra partes de um todo (360° = 100%). Observe se o eixo começa no zero: eixos cortados exageram diferenças. Leia título, legenda e unidades antes de calcular."]],
k:["Mediana: organize os dados antes.","Extremos afetam a média, não a mediana.","Menor desvio padrão = mais regular.","Setor: 1% = 3,6°."],
ex:["Notas: 4, 7, 7, 8, 10, 6. Calcule média, mediana e moda.","Média = 42/6 = 7. Em ordem: 4, 6, 7, 7, 8, 10 → mediana = (7 + 7)/2 = 7. Moda = 7."]},
{t:"Análise combinatória e probabilidade",d:"Princípio multiplicativo, permutação, combinação e probabilidade.",kw:"probabilidade|chance|sorte|possibilidades|combinaç|permutaç|maneiras|senha",
s:[["Princípio fundamental da contagem","Se uma escolha tem m opções e outra tem n, as duas juntas têm m·n possibilidades. Exemplo: 3 camisas e 4 calças formam 12 combinações. Senhas de 4 dígitos com repetição: 10⁴ = 10.000."],
["Permutação e arranjo","Permutação simples: ordenar n elementos distintos, n! possibilidades. Anagramas de AMOR: 4! = 24. Com letras repetidas, divida pelo fatorial das repetições: ARARA tem 5!/(3!·2!) = 10. Arranjo: escolher e ordenar p de n, n!/(n − p)!, usado quando a ordem importa (pódio)."],
["Combinação","Quando a ordem não importa (comissões, grupos, jogos de loteria): C(n,p) = n!/[p!(n − p)!]. Escolher 3 pessoas entre 5: C(5,3) = 10. Pergunte-se: trocar a ordem gera um resultado diferente? Se não, é combinação."],
["Probabilidade","P = casos favoráveis / casos possíveis, entre 0 e 1. Evento complementar: P(não A) = 1 − P(A), útil em perguntas com 'pelo menos um'. Eventos independentes acontecendo juntos: multiplique. Eventos mutuamente exclusivos (um ou outro): some."]],
k:["Ordem importa: arranjo/permutação. Não importa: combinação.","'E' multiplica; 'ou' (exclusivos) soma.","'Pelo menos um' → use 1 − P(nenhum).","Repetição em anagrama: divida pelos fatoriais."],
ex:["Ao lançar uma moeda 3 vezes, qual a probabilidade de sair pelo menos uma cara?","P(nenhuma cara) = (1/2)³ = 1/8. Logo, P(pelo menos uma) = 1 − 1/8 = 7/8."]},
{t:"Funções",d:"Função afim, quadrática, exponencial e logarítmica em contexto.",kw:"função|gráfico|f\\(x\\)|crescimento|exponenc|logaritm|parábola",
s:[["Função afim","f(x) = ax + b. O coeficiente a é a taxa de variação (quanto f muda quando x aumenta 1) e b é o valor inicial (onde corta o eixo y). Exemplo: corrida de táxi com bandeirada de R$ 5 e R$ 2,50 por km: f(x) = 2,5x + 5. Se a > 0, cresce; se a < 0, decresce."],
["Função quadrática","f(x) = ax² + bx + c tem gráfico em parábola, com concavidade para cima se a > 0. Raízes pela fórmula de Bhaskara, com Δ = b² − 4ac. O vértice, em x = −b/2a, dá o máximo ou mínimo: é o que se usa para calcular lucro máximo, altura máxima de um lançamento ou área máxima."],
["Função exponencial","f(x) = a·bˣ modela crescimento ou decaimento a taxa percentual constante: bactérias que dobram (2ˣ), juros compostos, meia-vida radioativa ((1/2)ˣ), depreciação de um carro. Cresce muito rápido quando b > 1."],
["Logaritmo","log_b(a) = x significa bˣ = a. Ele responde 'quanto tempo leva?' em problemas exponenciais. Propriedades: log(a·b) = log a + log b; log(a/b) = log a − log b; log(aⁿ) = n·log a. Escalas logarítmicas: pH, decibéis e magnitude de terremotos."]],
k:["Afim: a = taxa; b = valor inicial.","Máximo/mínimo da parábola no vértice: x = −b/2a.","Exponencial: taxa percentual constante.","Logaritmo descobre o expoente."],
ex:["O lucro de uma loja é L(x) = −x² + 40x − 300. Qual quantidade x dá lucro máximo?","x = −b/2a = −40/(−2) = 20 unidades. Lucro máximo: L(20) = −400 + 800 − 300 = 100."]},
{t:"Geometria plana",d:"Áreas, perímetros, Pitágoras, semelhança e trigonometria básica.",kw:"área|perímetro|triângulo|retângulo|círculo|ângulo|terreno|quadrado",
s:[["Áreas","Retângulo: b·h. Quadrado: l². Triângulo: b·h/2. Trapézio: (B + b)·h/2. Losango: D·d/2. Círculo: π·r²; comprimento da circunferência: 2·π·r. Figuras complexas: divida em figuras simples ou subtraia áreas."],
["Teorema de Pitágoras","No triângulo retângulo, a² = b² + c², em que a é a hipotenusa (oposta ao ângulo reto). Ternos comuns: 3-4-5, 5-12-13 e seus múltiplos (6-8-10). Diagonal do quadrado de lado l: l√2. Altura do triângulo equilátero: l√3/2."],
["Semelhança","Triângulos semelhantes têm ângulos iguais e lados proporcionais. Serve para calcular alturas por sombras: altura do prédio / sombra do prédio = altura da pessoa / sombra da pessoa. A razão entre áreas é o quadrado da razão de semelhança."],
["Trigonometria no triângulo retângulo","seno = cateto oposto / hipotenusa; cosseno = cateto adjacente / hipotenusa; tangente = oposto / adjacente. Valores notáveis: sen 30° = 1/2, cos 60° = 1/2, sen 45° = cos 45° = √2/2, tg 45° = 1. Usada em rampas, alturas inacessíveis e inclinações."]],
k:["Triângulo: bh/2. Círculo: πr².","a² = b² + c² (a = hipotenusa).","Semelhança: lados proporcionais; áreas ao quadrado.","sen 30° = 1/2; tg 45° = 1."],
ex:["Um poste projeta sombra de 6 m quando uma pessoa de 1,8 m projeta sombra de 1,2 m. Qual a altura do poste?","h/6 = 1,8/1,2 → h = 6 × 1,5 = 9 m."]},
{t:"Geometria espacial",d:"Prismas, cilindros, pirâmides, cones, esferas e planificações.",kw:"volume|cilindr|cubo|esfera|cone|prisma|pirâmide|capacidade|reservatório",
s:[["Prismas e cilindros","Volume = área da base × altura. Cubo: a³. Paralelepípedo: a·b·c. Cilindro: π·r²·h. A área lateral do cilindro, planificada, é um retângulo de lados 2πr e h. Lembre: 1 dm³ = 1 L, útil em caixas-d'água e embalagens."],
["Pirâmides e cones","Volume = (área da base × altura) / 3. Um cone tem um terço do volume do cilindro de mesma base e altura. A geratriz do cone (g) liga o vértice à borda da base: g² = h² + r²."],
["Esfera","Volume: 4πr³/3. Área da superfície: 4πr². Se o raio dobra, a área fica 4 vezes maior e o volume, 8 vezes maior. Por isso, em semelhança, áreas mudam com k² e volumes com k³."],
["Planificações e vistas","O ENEM cobra muito a planificação de sólidos (qual molde forma qual embalagem) e vistas (de frente, de cima, lateral). Cubo tem 11 planificações possíveis. Relação de Euler para poliedros convexos: V − A + F = 2."]],
k:["Prisma/cilindro: Ab·h. Pirâmide/cone: Ab·h/3.","Esfera: 4πr³/3.","Raio dobra: volume × 8.","V − A + F = 2."],
ex:["Uma caixa-d'água cilíndrica tem raio 1 m e altura 2 m. Quantos litros cabem? (π ≈ 3)","V = π r² h = 3 × 1 × 2 = 6 m³ = 6.000 L."]}
];

{t:"Interpretação de textos",d:"Tese, argumentos, inferência e as pegadinhas mais comuns.",kw:"texto|autor|leitor|narrador|crônica|reportagem",
s:[["Ler o enunciado primeiro","No ENEM, o enunciado diz o que procurar: objetivo do texto, efeito de sentido, relação entre textos. Leia a pergunta antes do texto e depois leia o texto inteiro com esse foco. Grife a tese e as palavras que mostram a posição do autor."],
["Compreensão e inferência","Compreender é recuperar o que está escrito; inferir é concluir algo que o texto sugere sem dizer. A inferência precisa estar apoiada em pistas do texto. Se a alternativa exige informação de fora, provavelmente está errada."],
["Pegadinhas","Desconfie de alternativas com generalizações (sempre, nunca, todos), de alternativas que extrapolam o texto e das que são verdadeiras no mundo mas não respondem ao que foi perguntado. Muitas vezes duas alternativas parecem certas: escolha a que está mais diretamente sustentada pelo texto."],
["Textos multimodais","Charges, tirinhas, cartazes e anúncios combinam imagem e texto. Identifique o contexto (época, fato noticiado), o recurso de humor ou crítica (ironia, exagero, quebra de expectativa) e o público-alvo. A crítica geralmente nasce da contradição entre o que se vê e o que se diz."]],
k:["Leia o comando antes do texto.","Inferência precisa de pista no texto.","Cuidado com generalizações.","Charge: contexto + recurso + crítica."],
ex:["Uma charge mostra um político dizendo 'investimos em educação' diante de uma escola em ruínas. Qual o recurso principal?","Ironia: a contradição entre a fala e a imagem revela a crítica à falta de investimento."]},
{t:"Gêneros textuais",d:"Função social, estrutura e linguagem dos gêneros mais cobrados.",kw:"gênero|anúncio|propaganda|carta|notícia|artigo|crônica|poema",
s:[["O que é gênero","Gênero textual é um formato socialmente reconhecido, com função, estrutura e linguagem típicas. O ENEM pergunta qual a função social de um texto: informar, convencer, orientar, divertir, emocionar, regular comportamento."],
["Gêneros jornalísticos","Notícia: relato objetivo de fato recente, em 3ª pessoa, com lide (o quê, quem, quando, onde, como, por quê). Reportagem: mais aprofundada, com entrevistas e dados. Artigo de opinião e editorial: defendem um ponto de vista; o editorial representa a opinião do jornal e não é assinado."],
["Gêneros literários e do cotidiano","Crônica: texto curto sobre o cotidiano, com tom leve, reflexivo ou humorístico. Conto: narrativa curta com poucos personagens e um conflito. Receita, manual e bula são instrucionais e usam verbos no imperativo. Anúncio publicitário usa função apelativa e linguagem persuasiva."],
["Tipologias","Tipos textuais são modos de organização: narração (fatos em sequência temporal), descrição (características), dissertação (expor ou argumentar), injunção (instruir) e exposição. Um mesmo gênero pode misturar tipos: uma reportagem pode ter trechos narrativos e descritivos."]],
k:["Pergunte: para que esse texto existe?","Notícia informa; artigo de opinião argumenta.","Instrucional usa imperativo.","Gênero ≠ tipo textual."],
ex:["Uma bula de remédio pertence a qual gênero e qual sua função?","É um gênero instrucional/informativo: orienta o uso seguro do medicamento, com posologia, contraindicações e efeitos adversos."]},
{t:"Funções da linguagem",d:"As seis funções de Jakobson e como reconhecê-las.",kw:"função|linguagem|emissor|receptor|mensagem",
s:[["Os elementos da comunicação","Jakobson descreveu seis elementos: emissor, receptor, mensagem, código, canal e referente (assunto). Cada função da linguagem destaca um deles. Um texto pode ter várias funções, mas há uma predominante."],
["Referencial, emotiva e conativa","Referencial (assunto): informa com objetividade, como notícias e textos científicos. Emotiva ou expressiva (emissor): 1ª pessoa, opiniões e sentimentos, como diários e poemas líricos. Conativa ou apelativa (receptor): busca convencer, com imperativo e vocativo, como propagandas."],
["Fática, metalinguística e poética","Fática (canal): testa ou mantém o contato (alô, né?, entendeu?). Metalinguística (código): a linguagem fala de si mesma, como dicionários, um poema sobre fazer poemas ou um filme sobre cinema. Poética (mensagem): destaca a forma, com rima, ritmo, sonoridade e jogos de palavras; aparece também em slogans."],
["Como identificar","Pergunte em que o texto concentra a atenção: no assunto, em quem fala, em quem ouve, no contato, no próprio código ou na forma. Propaganda com rima pode ter função poética a serviço da conativa; nesse caso, o objetivo de convencer costuma prevalecer."]],
k:["Referencial: informar.","Conativa: convencer o leitor.","Metalinguística: linguagem explicando linguagem.","Poética: atenção à forma."],
ex:["Um poema chamado 'Como escrever um poema' tem qual função predominante?","Metalinguística, pois o texto usa a poesia para falar do próprio fazer poético."]},
{t:"Variação linguística",d:"Tipos de variação, norma-padrão, adequação e preconceito linguístico.",kw:"variaç|linguístic|norma|fala|regional|dialeto|oralidade|gíria",
s:[["Língua viva","Toda língua varia e muda. Não existe forma 'errada' de falar, e sim formas mais ou menos adequadas a cada situação. A norma-padrão é uma das variedades, valorizada socialmente e usada em contextos formais, como a redação do vestibular."],
["Tipos de variação","Diatópica ou regional: diferenças entre lugares (mandioca, aipim, macaxeira). Diastrática ou social: ligada a grupo, idade, profissão (gírias, jargões). Diacrônica ou histórica: mudanças no tempo (vossa mercê → você). Diafásica ou situacional: formal ou informal conforme o contexto."],
["Oralidade e escrita","Marcas de oralidade incluem repetições, marcadores conversacionais (tipo, aí, né), reduções (tá, pra) e frases fragmentadas. Textos literários e publicitários as usam para criar proximidade ou caracterizar personagens."],
["Preconceito linguístico","É discriminar alguém pela forma como fala, geralmente associado a classe social ou região. O ENEM valoriza a ideia de que todas as variedades têm lógica e gramática próprias e que o domínio da norma-padrão é um direito a ser garantido, não um critério para desqualificar pessoas."]],
k:["Variação é natural, não erro.","Regional, social, histórica e situacional.","Norma-padrão é adequada a contextos formais.","Preconceito linguístico é discriminação social."],
ex:["Um texto usa 'trem' para qualquer objeto, 'uai' e 'sô'. Que variação predomina?","Variação regional (diatópica), típica do falar mineiro."]},
{t:"Figuras de linguagem",d:"Figuras de palavra, de pensamento e de construção.",kw:"metáfora|ironia|figura|sentido figurado|conotaç",
s:[["Figuras de palavra","Metáfora: comparação implícita (Meu coração é um balde despejado). Comparação: com conectivo (como, tal qual). Metonímia: substituição por relação de proximidade, como autor pela obra (li Machado) ou continente pelo conteúdo (bebi dois copos). Catacrese: metáfora já incorporada (pé da mesa). Sinestesia: mistura de sentidos (voz doce)."],
["Figuras de pensamento","Ironia: dizer o contrário do que se pensa, com intenção crítica. Antítese: ideias opostas próximas (rir e chorar). Paradoxo: ideias opostas atribuídas ao mesmo ser, gerando aparente absurdo (é dor que desatina sem doer). Hipérbole: exagero. Eufemismo: suavização (partiu desta para melhor). Personificação: características humanas a seres não humanos."],
["Figuras de construção e som","Elipse: omissão de termo fácil de recuperar. Zeugma: omissão de termo já mencionado. Pleonasmo: repetição de ideia para dar ênfase. Anáfora: repetição no início de versos ou frases. Aliteração: repetição de consoantes; assonância: de vogais. Onomatopeia: imitação de sons."],
["Na prova","As questões pedem o efeito de sentido da figura, e não só o nome. Pergunte-se: o que o autor ganha com esse recurso? Ênfase, humor, crítica, emoção, musicalidade?"]],
k:["Metáfora: comparação sem conectivo.","Metonímia: troca por proximidade.","Antítese opõe; paradoxo funde opostos.","Foque no efeito de sentido."],
ex:["'Ele é um banco de dados ambulante.' Que figura há aqui e qual o efeito?","Metáfora, com toque de hipérbole: destaca de forma expressiva que a pessoa sabe muitas informações."]},
{t:"Literatura: do Quinhentismo ao Simbolismo",d:"Escolas literárias até o fim do século XIX.",kw:"romantismo|realismo|barroco|árcad|parnasian|simbolis|Machado|Alencar",
s:[["Quinhentismo, Barroco e Arcadismo","Quinhentismo: textos de informação e catequese, como a Carta de Pero Vaz de Caminha. Barroco (século XVII): conflito entre fé e prazer, linguagem rebuscada; Gregório de Matos e Padre Antônio Vieira. Arcadismo (século XVIII): vida simples no campo, equilíbrio e pastores idealizados; Tomás Antônio Gonzaga e Cláudio Manuel da Costa."],
["Romantismo","Nacionalismo, subjetividade, idealização do amor e da mulher. Na poesia, três gerações: indianista (Gonçalves Dias), ultrarromântica, com pessimismo e morte (Álvares de Azevedo), e condoreira, social e abolicionista (Castro Alves). Na prosa, José de Alencar com romances indianistas (Iracema, O Guarani), urbanos e regionalistas."],
["Realismo e Naturalismo","Reação ao Romantismo: objetividade, crítica social, análise psicológica. Machado de Assis inaugura o Realismo no Brasil com Memórias Póstumas de Brás Cubas (1881), narrado por um defunto, com ironia e diálogo com o leitor; também Dom Casmurro e Quincas Borba. Naturalismo: determinismo do meio e da hereditariedade; Aluísio Azevedo, em O Cortiço."],
["Parnasianismo e Simbolismo","Parnasianismo: arte pela arte, culto à forma, soneto e rimas ricas; Olavo Bilac. Simbolismo: musicalidade, misticismo, subjetividade e sinestesia; Cruz e Sousa e Alphonsus de Guimaraens."]],
k:["Romantismo: idealização e nacionalismo.","Realismo: Machado, ironia e crítica social (1881).","Naturalismo: determinismo (O Cortiço).","Parnasianismo: forma. Simbolismo: musicalidade e mistério."],
ex:["Um narrador conta a própria vida depois de morto, ironizando a elite carioca. Que obra e escola?","Memórias Póstumas de Brás Cubas, de Machado de Assis, marco do Realismo brasileiro."]},
{t:"Literatura: Modernismo e contemporâneos",d:"Semana de 22, gerações modernistas e autores contemporâneos.",kw:"modernis|Semana de|Drummond|Graciliano|Clarice|Guimarães|Bandeira|Oswald",
s:[["Pré-Modernismo e Semana de 1922","O Pré-Modernismo mostra o Brasil esquecido: Euclides da Cunha (Os Sertões), Lima Barreto (Triste Fim de Policarpo Quaresma) e Monteiro Lobato. A Semana de Arte Moderna de 1922, em São Paulo, rompe com o academicismo e propõe liberdade formal e valorização da cultura brasileira."],
["Primeira geração (1922–1930)","Fase heroica e de ruptura: verso livre, humor, linguagem coloquial, poema-piada e antropofagia (devorar a cultura estrangeira e transformá-la em algo brasileiro). Oswald de Andrade (Manifesto Antropófago), Mário de Andrade (Macunaíma) e Manuel Bandeira."],
["Segunda geração (1930–1945)","Prosa regionalista com denúncia social: Graciliano Ramos (Vidas Secas), Rachel de Queiroz (O Quinze), Jorge Amado. Poesia reflexiva sobre o indivíduo no mundo: Carlos Drummond de Andrade, Cecília Meireles, Vinicius de Moraes."],
["Terceira geração e contemporâneos","Geração de 45: Guimarães Rosa reinventa a linguagem do sertão (Grande Sertão: Veredas); Clarice Lispector explora a introspecção e o fluxo de consciência (A Hora da Estrela); João Cabral de Melo Neto faz poesia objetiva e concreta (Morte e Vida Severina). Depois vêm o Concretismo, a poesia marginal e autores contemporâneos. Fuvest e Unicamp têm listas de leitura obrigatórias que mudam a cada ano."]],
k:["Semana de Arte Moderna: 1922.","Antropofagia: Oswald de Andrade.","Geração de 30: regionalismo e denúncia (Vidas Secas).","Clarice: introspecção. Rosa: invenção linguística."],
ex:["Um romance de 1938 narra a família de Fabiano fugindo da seca, com linguagem seca e enxuta. Qual a obra?","Vidas Secas, de Graciliano Ramos, da segunda geração modernista."]},
{t:"Coesão, coerência e gramática no texto",d:"Conectivos, referenciação, pontuação e concordância a serviço do sentido.",kw:"conectivo|coes|pronome|conjunç|pontuaç|vírgula|termo",
s:[["Coesão referencial","Retomar termos sem repeti-los: pronomes (ele, isso, o qual), sinônimos, hiperônimos (a fruta, referindo-se à maçã), elipse e expressões resumitivas (essa situação). Quem retoma algo já dito faz anáfora; quem antecipa algo faz catáfora."],
["Coesão sequencial e conectivos","Conectivos indicam relações lógicas. Adição: e, além disso. Oposição: mas, porém, contudo, entretanto. Concessão: embora, ainda que. Causa: porque, visto que. Consequência: de modo que. Conclusão: portanto, logo. Condição: se, caso. Finalidade: para que. Trocar um conectivo pode mudar todo o sentido."],
["Coerência","É a lógica do texto: ideias não contraditórias, progressão de informações e relação com o mundo real. Um texto pode ter coesão perfeita e ainda ser incoerente. Na redação, contradições entre tese e argumentos derrubam a nota."],
["Pontuação e concordância","A vírgula separa termos deslocados, apostos, vocativos e orações adverbiais antecipadas; não separa sujeito do verbo. O verbo concorda com o sujeito, mesmo que ele venha depois (Faltam dois dias). Haver no sentido de existir é impessoal (Havia muitas pessoas)."]],
k:["Pronomes e sinônimos evitam repetição.","Embora = concessão; porém = oposição.","Não se separa sujeito e verbo por vírgula.","Haver = existir: fica no singular."],
ex:["Reescreva sem mudar o sentido: 'Estudou muito, mas não passou.' usando 'embora'.","Embora tenha estudado muito, não passou."]}
];
